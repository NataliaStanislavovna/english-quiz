<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Law &amp; Crime + Future Perfect</title>
<style>
:root {
  --bg: #1a1a2e; --card: #16213e; --accent: #e94560; --accent-light: #ff6b81;
  --correct: #2ed573; --wrong: #ff4757; --text: #eaeaea; --text-dim: #8892a4;
  --border: #2a3a5e; --btn-radius: 12px;
  --theory-bg: rgba(255,255,255,0.03); --theory-border: #3a4a6e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; -webkit-tap-highlight-color: transparent; }
.container { max-width: 600px; margin: 0 auto; }
.header { text-align: center; padding: 20px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.header h1 { font-size: 22px; font-weight: 700; color: var(--accent-light); }
.header .subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
.phrase-box { background: linear-gradient(135deg, rgba(233,69,96,0.12), rgba(255,107,129,0.08)); border: 1px solid rgba(233,69,96,0.3); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; text-align: center; }
.phrase-box .label { font-size: 11px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.phrase-box .phrase { font-size: 16px; font-weight: 600; font-style: italic; color: var(--text); }
.phrase-box .translation { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
.progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); border-radius: 3px; transition: width 0.4s ease; width: 0%; }
.section-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.section-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--accent); display: flex; align-items: center; gap: 8px; }
.section-audio { text-align: center; margin-bottom: 14px; padding: 12px; background: rgba(233,69,96,0.08); border-radius: 10px; border: 1px solid rgba(233,69,96,0.2); }
.section-title .icon { font-size: 20px; }
.theory { background: var(--theory-bg); border-left: 3px solid var(--theory-border); border-radius: 0 8px 8px 0; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; line-height: 1.7; color: var(--text-dim); }
.theory strong { color: var(--text); font-weight: 600; }
.question-block { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
.question-number { font-size: 12px; font-weight: 600; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.sentence { font-size: 15px; line-height: 1.7; margin-bottom: 14px; padding: 12px; background: rgba(255,255,255,0.04); border-radius: 8px; }
.speak-btn { background: rgba(233,69,96,0.15); border: 2px solid var(--accent); border-radius: 50%; width: 52px; height: 52px; font-size: 24px; color: var(--accent-light); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; transition: all 0.2s ease; line-height: 1; }
.speak-btn:active { transform: scale(0.92); }
.speak-btn.speaking { animation: pulse 0.8s ease-in-out infinite; background: rgba(233,69,96,0.3); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(233,69,96,0.4); } 50% { box-shadow: 0 0 0 10px rgba(233,69,96,0); } }
.options { display: flex; flex-direction: column; gap: 8px; }
.options.horizontal { flex-direction: row; justify-content: center; gap: 12px; }
.option-btn { background: rgba(255,255,255,0.06); border: 2px solid var(--border); border-radius: var(--btn-radius); padding: 14px 20px; font-size: 15px; color: var(--text); cursor: pointer; transition: all 0.2s ease; text-align: center; min-height: 48px; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
.option-btn:active { transform: scale(0.97); }
.option-btn.correct { background: rgba(46,213,115,0.15); border-color: var(--correct); color: var(--correct); font-weight: 600; }
.option-btn.wrong { background: rgba(255,71,87,0.15); border-color: var(--wrong); color: var(--wrong); font-weight: 600; }
.option-btn:disabled { cursor: default; opacity: 0.7; }
.option-btn:disabled:active { transform: none; }
.option-btn .letter { font-weight: 700; margin-right: 8px; color: var(--text-dim); }
.option-btn.correct .letter { color: var(--correct); }
.option-btn.wrong .letter { color: var(--wrong); }
.tf-btn { flex: 1; max-width: 140px; padding: 18px 24px; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.explanation { margin-top: 10px; padding: 10px 12px; background: rgba(46,213,115,0.08); border-left: 3px solid var(--correct); border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.6; color: var(--text-dim); display: none; }
.explanation.visible { display: block; }
.results { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; text-align: center; animation: fadeIn 0.5s ease; }
.results .score { font-size: 48px; font-weight: 800; margin: 16px 0; }
.results .score .pct { font-size: 24px; color: var(--text-dim); }
.results .score.excellent { color: var(--correct); }
.results .score.good { color: var(--accent-light); }
.results .score.needs-work { color: var(--wrong); }
.results .message { font-size: 16px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }
.results-detail { text-align: left; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.results-detail h3 { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.result-item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; line-height: 1.5; }
.result-item .ri-q { color: var(--text-dim); margin-bottom: 4px; }
.result-item .ri-correct { color: var(--correct); font-weight: 600; }
.result-item .ri-wrong { color: var(--wrong); font-weight: 600; text-decoration: line-through; margin-right: 8px; }
.restart-btn { background: linear-gradient(135deg, var(--accent), var(--accent-light)); border: none; border-radius: var(--btn-radius); padding: 16px 40px; font-size: 16px; font-weight: 700; color: white; cursor: pointer; margin-top: 20px; transition: all 0.2s ease; }
.restart-btn:active { transform: scale(0.97); }
.hidden { display: none; }
.speed-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 13px; color: var(--text-dim); cursor: pointer; transition: all 0.2s ease; }
.subtitles { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 10px; text-align: left; }
.subtitles .sub-toggle { font-size: 12px; color: var(--accent-light); cursor: pointer; margin-bottom: 8px; display: block; }
.subtitles .sub-line { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.subtitles .sub-line:last-child { border-bottom: none; margin-bottom: 0; }
.subtitles .sub-speaker { font-size: 11px; color: var(--accent-light); text-transform: uppercase; margin-bottom: 2px; }
.subtitles .sub-hanzi { font-size: 16px; color: var(--text); line-height: 1.6; }
.speed-btn:active { transform: scale(0.95); }
.speed-btn.active { background: rgba(233,69,96,0.2); border-color: var(--accent); color: var(--accent-light); font-weight: 600; }
</style>
</head>

</div>
<script>
const quizData = {"title": "Law & Crime + Future Perfect", "subtitle": "2026-09-02", "date": "2026-09-02", "phrase_of_the_day": "The jury is still out", "phrase_translation": "Решение ещё не принято; вопрос ещё открыт", "audio_url": "https://nataliastanislavovna.github.io/english-quiz/lessons/audio_0902.mp3", "sections": [{"id": "s1", "title": "Vocabulary — Law & Crime", "icon": "📚", "theory": "", "instruction": "", "questions": [{"id": "v1", "type": "choice", "sentence": "What is \"evidence\"?", "options": ["A written law", "Facts or objects that prove something", "The lawyer's speech", "The police uniform"], "correct": "Facts or objects that prove something", "explanation": "Evidence — доказательства: факты, предметы, записи, которые подтверждают что-то в суде или расследовании. Например, camera footage is evidence — запись с камеры является доказательством."}, {"id": "v2", "type": "choice", "sentence": "A \"witness\" is...", "options": ["The person who decides the case", "A person who saw what happened", "The person accused of a crime", "A type of lawyer"], "correct": "A person who saw what happened", "explanation": "Witness — свидетель, человек, который видел происшествие. He appeared as a witness in court — он выступил в суде как свидетель. Не путайте: judge — судья, а witness — свидетель."}, {"id": "v3", "type": "choice", "sentence": "At the end of a trial, the jury gives a \"verdict\". What is it?", "options": ["The final decision: guilty or not guilty", "The punishment", "The price of the lawyer", "A list of the evidence"], "correct": "The final decision: guilty or not guilty", "explanation": "Verdict — вердикт, окончательное решение суда: виновен (guilty) или невиновен (not guilty). А наказание, которое назначают после виновного вердикта, — это sentence."}, {"id": "v4", "type": "choice", "sentence": "What is a \"fine\"?", "options": ["A prison sentence", "A money punishment for breaking a rule or law", "A warning without punishment", "A court document"], "correct": "A money punishment for breaking a rule or law", "explanation": "Fine — штраф, денежное наказание за мелкое нарушение. He got a fifty-euro fine for speeding — он получил штраф в пятьдесят евро за превышение скорости."}]}, {"id": "s2", "title": "Grammar — Future Perfect", "icon": "📖", "theory": "", "instruction": "", "questions": [{"id": "g1", "type": "choice", "sentence": "By this time tomorrow, the jury ___ a verdict.", "options": ["will reach", "will be reaching", "will have reached", "reach"], "correct": "will have reached", "explanation": "Future Perfect = will have + третья форма глагола. Действие будет ЗАВЕРШЕНО к определённому моменту в будущем. Маркер by — «к»: by this time tomorrow — к этому же времени завтра вердикт уже будет вынесен."}, {"id": "g2", "type": "choice", "sentence": "Don't worry about the roof — the builders ___ it by Friday.", "options": ["will have finished", "will be finishing", "finish", "have finished"], "correct": "will have finished", "explanation": "By Friday — к пятнице работа будет завершена, результат к моменту в будущем. Поэтому Future Perfect: will have finished. Ключевая подсказка — слово by (к какому-то сроку)."}, {"id": "g3", "type": "tf", "sentence": "Future Perfect describes an action that will be FINISHED before a certain moment in the future.", "options": [], "correct": "T", "explanation": "Верно. Future Perfect отвечает на вопрос «что будет сделано К такому-то времени»: By six I will have cleaned the flat — к шести я уже вычищу квартиру. Главное — не процесс, а завершённый результат."}, {"id": "g4", "type": "choice", "sentence": "Which sentence means that the action is FINISHED by ten o'clock?", "options": ["At ten o'clock, I will be writing the report.", "By ten o'clock, I will have written the report.", "At ten o'clock, I write the report.", "By ten o'clock, I will be writing the report."], "correct": "By ten o'clock, I will have written the report.", "explanation": "Сравните: at ten I will be writing — в десять я буду В ПРОЦЕССЕ написания (Future Continuous); by ten I will have written — К десяти я уже ЗАКОНЧУ (Future Perfect). At указывает момент процесса, by — крайний срок результата."}]}, {"id": "s3", "title": "Practical English", "icon": "💬", "theory": "", "instruction": "", "questions": [{"id": "p1", "type": "choice", "sentence": "You come to a police station. What do you say to report a stolen bicycle?", "options": ["I want to argue about a bicycle.", "I'd like to report a stolen bicycle.", "I will have stolen a bicycle.", "My bicycle is a witness."], "correct": "I'd like to report a stolen bicycle.", "explanation": "I'd like to report... — вежливый способ заявить о происшествии: «Я хотел бы сообщить о...». Так же: to report a theft — сообщить о краже, to report an accident — сообщить о аварии."}, {"id": "p2", "type": "choice", "sentence": "What does \"to press charges\" mean?", "options": ["To pay a fine quickly", "To officially ask for the case to go to court", "To run away from the police", "To hire a lawyer"], "correct": "To officially ask for the case to go to court", "explanation": "To press charges — официально заявить, что вы хотите привлечь человека к ответственности, чтобы дело пошло в суд. Обратное: to drop the charges — снять обвинения, отозвать заявление."}]}, {"id": "s4", "title": "Challenge", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": "c1", "type": "choice", "sentence": "The thief was caught red-handed. This means...", "options": ["He was caught with red paint on his hands", "He was caught in the very act of doing something wrong", "He was caught after a long chase", "He was caught by another criminal"], "correct": "He was caught in the very act of doing something wrong", "explanation": "Caught red-handed — пойман с поличным, на месте преступления. Идиома появилась, когда «красные руки» означали кровь пойманного браконьера или вора. Сегодня используется про любое нарушение: например, ребёнок, пойманный с печеньем из банки."}, {"id": "c2", "type": "choice", "sentence": "Your colleague asks: \"Are you moving to Riga?\" You answer: \"The jury is still out.\" What do you mean?", "options": ["You are going to court soon", "You have already decided to move", "The decision has not been made yet", "You want to become a lawyer"], "correct": "The decision has not been made yet", "explanation": "The jury is still out — «присяжные всё ещё совещаются», то есть решение ещё не принято, вопрос открыт. Идиома давно вышла за пределы суда и используется в любых спорных ситуациях: от переезда до выбора нового телефона."}]}, {"id": "s5", "title": "Listening Comprehension", "icon": "🎧", "theory": "", "instruction": "Listen to the audio, then answer the questions below.", "questions": [{"id": "l1", "type": "listen", "sentence": "Listen to the dialogue. What did Sarah see near the bike rack?", "options": ["A police officer checking the locks", "A man in a grey hoodie hanging around", "Her colleague riding the bike away", "Nobody at all"], "correct": "A man in a grey hoodie hanging around", "explanation": "Сара говорит: There was a man in a grey hoodie hanging around the rack. He kept staring at my lock — возле стоянки крутился мужчина в серой толстовке и разглядывал её замок. Полицейский считает, что это может быть подозреваемый (suspect).", "audio_text": "Sarah(F): Excuse me, I'd like to report a stolen bicycle.\nDavid(M): I'm sorry to hear that. Take a seat. When did you notice it was gone?\nSarah(F): This morning, around eight. It was locked to the railing outside my office.\nDavid(M): Did you see anyone suspicious nearby?\nSarah(F): Actually, yes. There was a man in a grey hoodie hanging around the rack. He kept staring at my lock.\nDavid(M): That could be our suspect. We've had three bikes stolen from that street this month.\nSarah(F): Three? So somebody is doing this on purpose?\nDavid(M): Looks like it. There's a camera across the road. If it caught him, we'll have solid evidence.\nSarah(F): What happens if you find him?\nDavid(M): He'll be arrested and charged with theft. Then the case goes to court.\nSarah(F): Will I have to appear as a witness?\nDavid(M): Most likely, yes. Your statement will be part of the case.\nSarah(F): I just want my bike back. It has a bell shaped like a frog.\nDavid(M): A frog-shaped bell? That shouldn't be hard to identify. By Friday we'll have reviewed the camera footage, and with a detail like that, it may be an open-and-shut case.\nSarah(F): So there's a real chance?\nDavid(M): There's always a chance. Nobody forgets a frog-shaped bell."}, {"id": "l2", "type": "listen", "sentence": "Listen to the dialogue again. What does the officer promise about Friday?", "options": ["The bike will be returned to Sarah by Friday", "The police will have reviewed the camera footage by Friday", "The trial will start on Friday", "Sarah will get a fine on Friday"], "correct": "The police will have reviewed the camera footage by Friday", "explanation": "Офицер говорит: By Friday we'll have reviewed the camera footage — к пятнице мы уже просмотрим запись с камеры. Это Future Perfect: к определённому сроку работа будет завершена. Открытый и закрытый случай (open-and-shut case) — дело, которое легко раскрыть.", "audio_text": "Sarah(F): Excuse me, I'd like to report a stolen bicycle.\nDavid(M): I'm sorry to hear that. Take a seat. When did you notice it was gone?\nSarah(F): This morning, around eight. It was locked to the railing outside my office.\nDavid(M): Did you see anyone suspicious nearby?\nSarah(F): Actually, yes. There was a man in a grey hoodie hanging around the rack. He kept staring at my lock.\nDavid(M): That could be our suspect. We've had three bikes stolen from that street this month.\nSarah(F): Three? So somebody is doing this on purpose?\nDavid(M): Looks like it. There's a camera across the road. If it caught him, we'll have solid evidence.\nSarah(F): What happens if you find him?\nDavid(M): He'll be arrested and charged with theft. Then the case goes to court.\nSarah(F): Will I have to appear as a witness?\nDavid(M): Most likely, yes. Your statement will be part of the case.\nSarah(F): I just want my bike back. It has a bell shaped like a frog.\nDavid(M): A frog-shaped bell? That shouldn't be hard to identify. By Friday we'll have reviewed the camera footage, and with a detail like that, it may be an open-and-shut case.\nSarah(F): So there's a real chance?\nDavid(M): There's always a chance. Nobody forgets a frog-shaped bell."}]}], "subtitles": [{"speaker": "Sarah", "text": "Excuse me, I'd like to report a stolen bicycle."}, {"speaker": "David", "text": "I'm sorry to hear that. Take a seat. When did you notice it was gone?"}, {"speaker": "Sarah", "text": "This morning, around eight. It was locked to the railing outside my office."}, {"speaker": "David", "text": "Did you see anyone suspicious nearby?"}, {"speaker": "Sarah", "text": "Actually, yes. There was a man in a grey hoodie hanging around the rack. He kept staring at my lock."}, {"speaker": "David", "text": "That could be our suspect. We've had three bikes stolen from that street this month."}, {"speaker": "Sarah", "text": "Three? So somebody is doing this on purpose?"}, {"speaker": "David", "text": "Looks like it. There's a camera across the road. If it caught him, we'll have solid evidence."}, {"speaker": "Sarah", "text": "What happens if you find him?"}, {"speaker": "David", "text": "He'll be arrested and charged with theft. Then the case goes to court."}, {"speaker": "Sarah", "text": "Will I have to appear as a witness?"}, {"speaker": "David", "text": "Most likely, yes. Your statement will be part of the case."}, {"speaker": "Sarah", "text": "I just want my bike back. It has a bell shaped like a frog."}, {"speaker": "David", "text": "A frog-shaped bell? That shouldn't be hard to identify. By Friday we'll have reviewed the camera footage, and with a detail like that, it may be an open-and-shut case."}, {"speaker": "Sarah", "text": "So there's a real chance?"}, {"speaker": "David", "text": "There's always a chance. Nobody forgets a frog-shaped bell."}]};
let answered = 0, totalQuestions = 0, answers = {}, sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(s => {
    if (!answers[s.id]) answers[s.id] = {};
    (s.questions || []).forEach(q => { totalQuestions++; answers[s.id][q.id] = null; });
  });
  renderAll(); updateProgress();
  // Fix: after audio ends, reset so it can be replayed
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function renderAll() {

    let h = '<div class="section-card" id="section_' + sec.id + '">';

    if (sec.theory) h += '<div class="theory">' + fmtTheory(sec.theory) + '</div>';
    if (sec.instruction) h += '<div style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(sec.instruction) + '</div>';

    var secAudioTexts = [...new Set((sec.questions||[]).filter(q=>q.type==='listen'&&q.audio_text).map(q=>q.audio_text))];

        h += '<div style="margin-top:8px;display:flex;justify-content:center;gap:8px;align-items:center;">';

        h += '<button class="speed-btn" data-speed="0.75" onclick="setAudioSpeed(0.75,this)">0.75x</button>';

      } else {
        h += '<button class="speak-btn" data-audio-b64="' + btoa(unescape(encodeURIComponent(JSON.stringify(secAudioTexts)))) + '" onclick="speakSection(this)">🔊</button>';

        subData.forEach(function(sl) {
          h += '<div class="sub-line">';
          h += '<div class="sub-speaker">' + esc(sl.speaker) + '</div>';
          h += '<div class="sub-hanzi">' + esc(sl.text) + '</div>';
          h += '</div>';
        });
        h += '</div>';
        h += '</div>';
      }
      h += '</div>';
    }
    (sec.questions||[]).forEach(q => {
      gq++; h += '<div class="question-block"><div class="question-number">Вопрос ' + gq + '</div>';
      if (q.sentence) h += '<div class="sentence">' + fmtSent(q.sentence, sec.id, q.id, q.type) + '</div>';
      h += renderOpts(sec.id, q);
      if (q.explanation) h += '<div class="explanation" id="exp_'+sec.id+'_'+q.id+'">' + esc(q.explanation) + '</div>';
      h += '</div>';
    });
    h += '</div>'; c.insertAdjacentHTML('beforeend', h);
  });
}

function speakSection(btn) {
  const texts = JSON.parse(decodeURIComponent(escape(atob(btn.dataset.audioB64))));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn || texts.length === 0) return; btn.classList.add('speaking');
  const v = window.speechSynthesis.getVoices();
  const voice = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  let idx = 0;
  function next() {
    if (idx >= texts.length) { btn.classList.remove('speaking'); return; }
    const u = new SpeechSynthesisUtterance(texts[idx]); u.lang='en-US'; u.rate=0.85;
    if (voice) u.voice = voice;
    u.onend = () => { idx++; setTimeout(next, 400); };
    u.onerror = () => { btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function speak(btn) {
  const text = btn.dataset.audioText;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn) return; btn.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
  const v = window.speechSynthesis.getVoices();
  const ev = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  if (ev) u.voice = ev;
  u.onend = () => btn.classList.remove('speaking');
  u.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) { window.speechSynthesis.getVoices(); if (window.speechSynthesis.onvoiceschanged!==undefined) { window.speechSynthesis.onvoiceschanged = function(){}; } }

function fmtTheory(t) { return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function fmtSent(s,sid,qid,type) { if(!s) return ''; if(type==='choice') return s.replace(/___+/g,'<span class="blank" id="blank_'+sid+'_'+qid+'">___</span>'); return esc(s); }

function renderOpts(sid, q) {
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type==='tf') return '<div class="options horizontal"><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="T" onclick="sel(this)">✓ True</button><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="F" onclick="sel(this)">✗ False</button></div>';
  if (q.type==='choice'||q.type==='listen') {
    let h='<div class="options">';
    var _opts = (q.options||[]).slice();
    for (var _i=_opts.length-1; _i>0; _i--) { var _j=Math.floor(Math.random()*(_i+1)); var _t=_opts[_i]; _opts[_i]=_opts[_j]; _opts[_j]=_t; }
    _opts.forEach((o,i) => { h+='<button class="option-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="'+esc(o)+'" onclick="sel(this)"><span class="letter">'+L[i]+'</span>'+esc(o)+'</button>'; });
    return h+'</div>';
  }
  return '';
}

function sel(btn) {
  const sid=btn.dataset.sec, qid=btn.dataset.q, val=btn.dataset.val;
  if(answers[sid][qid]!==null) return;
  answers[sid][qid]=val; answered++;
  const sec=sectionData.find(s=>s.id===sid), q=sec.questions.find(x=>x.id==qid);
  const corr=String(q.correct), ok=val===corr;
  btn.parentElement.querySelectorAll('.option-btn').forEach(s => {
    s.disabled=true; if(s.dataset.val===corr) s.classList.add('correct'); if(s===btn&&!ok) s.classList.add('wrong');
  });
  const bl=document.getElementById('blank_'+sid+'_'+qid);
  if(bl) { bl.textContent=corr; bl.classList.add(ok?'filled':'wrong-fill'); }
  const ex=document.getElementById('exp_'+sid+'_'+qid); if(ex) ex.classList.add('visible');
  updateProgress();
  if(answered>=totalQuestions) setTimeout(showRes, 800);
}

function updateProgress() { document.getElementById('progressFill').style.width = (totalQuestions>0?(answered/totalQuestions*100):0)+'%'; }

function showRes() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  let ok=0, d='';
  sectionData.forEach(sec => {
    sec.questions.forEach(q => {
      const ua=answers[sec.id][q.id], cs=String(q.correct), isOK=ua===cs; if(isOK) ok++;
      d+='<div class="result-item"><div class="ri-q">'+esc(sec.title)+' — '+q.id+'</div>';
      if(q.sentence) d+='<div>'+esc(q.sentence.replace(/___+/g,cs))+'</div>';
      else if(q.options) d+='<div>'+esc(q.options.join(' / '))+'</div>';
      if(!isOK&&ua!==null) d+='<div><span class="ri-wrong">'+esc(ua)+'</span> <span class="ri-correct">'+esc(cs)+'</span></div>';
      if(isOK) d+='<div><span class="ri-correct">✓ '+esc(cs)+'</span></div>';
      if(q.explanation) d+='<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">'+esc(q.explanation)+'</div>';
      d+='</div>';
    });
  });
  const p=Math.round(ok/totalQuestions*100), el=document.getElementById('scoreDisplay');
  el.innerHTML=ok+'/'+totalQuestions+' <span class="pct">('+p+'%)</span>';
  el.className='score '+(p>=90?'excellent':p>=60?'good':'needs-work');
  let m=''; if(p>=90) m='🎉 Отлично!'; else if(p>=70) m='👍 Хороший результат!'; else if(p>=50) m='📚 Стоит повторить.'; else m='💪 Попробуй ещё раз!';
  document.getElementById('scoreMessage').textContent=m;
  document.getElementById('resultsDetail').innerHTML='<h3>Подробно</h3>'+d;
}

function restartQuiz() {
  answered=0; if(window.speechSynthesis) window.speechSynthesis.cancel();
  Object.keys(answers).forEach(k=>Object.keys(answers[k]).forEach(qk=>answers[k][qk]=null));
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll(); updateProgress(); window.scrollTo(0,0);
  // Re-attach audio ended handler after re-render
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function setAudioSpeed(speed, btn) {
  const audio = document.getElementById('dialogAudio');
  if (audio) audio.playbackRate = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toggleSubs(el) { var body = el.parentElement.querySelector('.sub-body'); if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none'; }
init();
</script>
