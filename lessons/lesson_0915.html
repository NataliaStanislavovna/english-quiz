const quizData = {"title": "Law & Crime: Types of Crime + Modal Verbs of Deduction in the Past", "subtitle": "2026-09-15", "date": "2026-09-15", "phrase_of_the_day": "Get away with it", "phrase_translation": "Сойти с рук, избежать наказания. Говорят о том, кто сделал что-то плохое, но не был наказан — He broke the window, but he got away with it.", "audio_url": "https://nataliastanislavovna.github.io/english-quiz/lessons/audio_0915.mp3", "sections": [{"id": "s1", "title": "Vocabulary — Law & Crime", "icon": "📚", "theory": "", "instruction": "", "questions": [{"id": "v1", "type": "choice", "sentence": "At night someone entered a house through a window and stole a laptop. Nobody was at home, and no violence was used. What crime is this?", "options": ["Burglary — entering a building in order to steal from it", "Robbery — stealing from a person using force or threats", "Theft — taking somebody's property without any violence", "Shoplifting — taking goods from a shop without paying"], "correct": "Burglary — entering a building in order to steal from it", "explanation": "Burglary = кража со взломом: преступник проник в здание, чтобы украсть. Robbery = грабёж: кража у человека с применением силы или угроз (rob a bank, rob a person). Theft = общее слово для любой кражи, а shoplifting = кража в магазине. Полезный глагол: to break into a house — вломиться в дом."}, {"id": "v2", "type": "choice", "sentence": "A suspect tells the police that at the time of the crime he was at the cinema with friends. What is this statement called?", "options": ["An alibi — evidence that he was somewhere else", "A verdict — the decision of guilty or not guilty", "A witness — a person who saw what had happened", "A motive — the reason why somebody commits a crime"], "correct": "An alibi — evidence that he was somewhere else", "explanation": "Alibi = алиби, доказательство того, что человек в момент преступления был в другом месте. У слова всегда есть «переводчик»: to have an alibi, to check somebody's alibi, a perfect alibi. Если алиби подтвердилось — подозреваемого обычно отпускают."}, {"id": "v3", "type": "choice", "sentence": "In a British courtroom, a group of twelve ordinary people listen to the evidence and decide whether the person is guilty. Who are they?", "options": ["The jury — ordinary people who reach the verdict", "The judge — the lawyer who runs the trial in court", "The suspect — the person who is accused of the crime", "The witness — the person who describes what she saw"], "correct": "The jury — ordinary people who reach the verdict", "explanation": "Jury = присяжные, 12 обычных людей, которые выносят вердикт — guilty or not guilty. Judge = судья: он ведёт процесс и назначает наказание, но (в Британии) вину решают именно присяжные. Члена жюри называют a juror, а слушать дело — to sit on a jury."}, {"id": "v4", "type": "choice", "sentence": "The burglar was caught, and the court decided he must do sixty hours of community service. What is this punishment called?", "options": ["His sentence — the punishment given by the court", "His charge — the official accusation of a crime", "His fine — money you pay as a punishment", "His trial — the process of examining the case"], "correct": "His sentence — the punishment given by the court", "explanation": "Sentence = приговор, наказание, которое назначает суд (не путайте со «предложением» в грамматике!). To pass a sentence = вынести приговор, a heavy sentence = суровый приговор, a light sentence = мягкий. Charge = обвинение, fine = штраф, trial = судебный процесс."}]}, {"id": "s2", "title": "Grammar — Deduction in the Past", "icon": "📖", "theory": "", "instruction": "", "questions": [{"id": "g1", "type": "choice", "sentence": "The door was locked, the window was broken, and David had lost his keys. Choose the logical conclusion about the past:", "options": ["He must have climbed in through the window", "He should have climbed in through the window", "He can't have climbed in through the window", "He needn't have climbed in through the window"], "correct": "He must have climbed in through the window", "explanation": "Must have + V3 = «должно быть, он это сделал» — уверенный вывод о прошлом на основе фактов. Дверь заперта, окно разбито, ключи потеряны — значит, он наверняка влез через окно. Формула: факты + уверенность = must have + третья форма глагола."}, {"id": "g2", "type": "choice", "sentence": "The money was still in the kitchen jar, so a professional thief ___ it. Complete the negative deduction:", "options": ["can't have taken", "mustn't have taken", "shouldn't have taken", "might not have taken"], "correct": "can't have taken", "explanation": "Can't have + V3 = «не может быть, что он это сделал» — уверенный вывод, что что-то НЕ произошло. Внимание, ловушка: в этом значении нельзя сказать mustn't have taken. Шкала уверенности: must have taken (почти уверен, что взял) → might have taken (возможно) → can't have taken (точно не взял)."}, {"id": "g3", "type": "choice", "sentence": "The sandwich on the table was only half-eaten. The intruder ___ when he heard Kate's key in the door. Choose the uncertain conclusion:", "options": ["might have panicked", "can have panicked", "must be panicking", "should have panicked"], "correct": "might have panicked", "explanation": "Might have + V3 (также could have + V3) = «возможно, это произошло» — неуверенный вывод о прошлом. Бутерброд надкушен — возможно, вор испугался и убежал, но мы не уверены. Сравните: must have panicked = наверняка испугался, can have panicked — так не говорят."}, {"id": "g4", "type": "choice", "sentence": "Kate's expensive camera was standing right next to the stolen laptop. Complete the sentence: 'The camera ___, but luckily the thief left it behind.'", "options": ["could have been taken", "must have been taken", "can't have been taken", "should have been taking"], "correct": "could have been taken", "explanation": "Could have + V3 = «могло случиться, но не случилось» — упущенная возможность. Камера могла быть украдена (это было реально возможно), но её не взяли. Это важный оттенок: might have been taken = возможно, взяли (не знаем), а could have been taken = могли взять, но не взяли (мы знаем результат)."}]}, {"id": "s3", "title": "Practical English — At the Police Station", "icon": "💬", "theory": "", "instruction": "", "questions": [{"id": "p1", "type": "choice", "sentence": "You come home and see that your window is broken and your laptop is gone. You call the police. What is the natural way to report it?", "options": ["My flat has been broken into.", "My flat has broken into.", "Somebody was broken my flat.", "My flat was breaking into."], "correct": "My flat has been broken into.", "explanation": "To break into a flat = вломиться в квартиру. В сообщении о преступлении естественно использовать пассив: My flat has been broken into — предлог to остаётся на месте (to break into → broken into). Ещё полезные фразы: I'd like to report a theft. My laptop has been stolen."}, {"id": "p2", "type": "choice", "sentence": "In court, the man admitted that he had stolen the biscuits. What is the correct way to say this?", "options": ["He pleaded guilty to shoplifting.", "He found guilty of shoplifting.", "He was pleaded guilty to shoplift.", "He was charged guilty for shoplifting."], "correct": "He pleaded guilty to shoplifting.", "explanation": "To plead guilty = признать вину (сам признался), противоположность — to plead not guilty. После plead guilty используется предлог to + герундий: pleaded guilty to shoplifting. Не путайте: he was found guilty = его ПРИЗНАЛИ виновным (это решили другие, присяжные), а he pleaded guilty = он признался сам."}]}, {"id": "s4", "title": "Challenge", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": "c1", "type": "choice", "sentence": "The footprints near the window are enormous. Complete the deduction: 'They ___ Kate's — she wears tiny shoes.'", "options": ["can't have been", "mustn't have been", "might not have been", "shouldn't have been"], "correct": "can't have been", "explanation": "Схема та же, что с существительными: can't have + V3 = уверенный вывод, что этого НЕ было. Огромные следы + крошенные туфли Кейт = это точно не её следы. Ловушка mustn't have been — в британском английском так не говорят: mustn't означает запрет (mustn't touch), а не вывод. Мягкий вариант might not have been = «возможно, не её», но факты говорят жёстче."}, {"id": "c2", "type": "choice", "sentence": "Kate says: 'The camera could have been taken, but the thief left it behind.' What does this sentence mean?", "options": ["It was possible, but it did not happen", "It was impossible, so it never happened", "It probably happened, but nobody noticed it", "It certainly happened, and the police know it"], "correct": "It was possible, but it did not happen", "explanation": "Could have + V3 описывает упущенную возможность: это могло произойти, но не произошло. Камера стояла рядом с ноутбуком — её могли украсть, но не украли. Сравните три оттенка: could have been taken (могли, но не взяли), might have been taken (возможно, взяли — неизвестно), must have been taken (точно взяли)."}]}, {"id": "s5", "title": "Listening Comprehension", "icon": "🎧", "theory": "", "instruction": "Listen to the audio, then answer the questions below.", "questions": [{"id": "l1", "type": "listen", "sentence": "Listen to the dialogue. What conclusion does Mark draw about the intruder?", "options": ["It can't have been a professional, because a professional never leaves money behind", "It must have been a professional, because only a professional knows about the window", "It might have been her sister, because her sister knew Kate was out that day", "It can't have been a stranger, because the police found no footprints near the house"], "correct": "It can't have been a professional, because a professional never leaves money behind", "explanation": "Марк делает уверенный отрицательный вывод: It can't have been a professional burglar — let answered = 0, totalQuestions = 0, answers = {}, sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(s => {
    if (!answers[s.id]) answers[s.id] = {};
    (s.questions || []).forEach(q => { totalQuestions++; answers[s.id][q.id] = null; });
  });
  renderAll(); updateProgress();
  // Fix: after audio ends, reset so it can be replayed
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function renderAll() {
  const c = document.getElementById('quizContent'); c.innerHTML = ''; let gq = 0;
  sectionData.forEach(sec => {
    let h = '<div class="section-card" id="section_' + sec.id + '">';
    h += '<div class="section-title"><span class="icon">' + (sec.icon||'📝') + '</span>' + esc(sec.title) + '</div>';
    if (sec.theory) h += '<div class="theory">' + fmtTheory(sec.theory) + '</div>';
    if (sec.instruction) h += '<div style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(sec.instruction) + '</div>';
    // Section-level audio: use pre-generated MP3 if available, else TTS fallback
    var secAudioTexts = [...new Set((sec.questions||[]).filter(q=>q.type==='listen'&&q.audio_text).map(q=>q.audio_text))];
    var secAudioUrl = quizData.audio_url || '';
    if (secAudioTexts.length > 0) {
      h += '<div class="section-audio">';
      if (secAudioUrl) {
        h += '<audio id="dialogAudio" controls preload="auto" style="width:100%;border-radius:10px;margin-bottom:6px;">';
        h += '<source src="' + secAudioUrl + '" type="audio/mpeg">';
        h += '</audio>';
        h += '<div style="margin-top:8px;display:flex;justify-content:center;gap:8px;align-items:center;">';
        h += '<span style="font-size:12px;color:var(--text-dim);">Скорость:</span>';
        h += '<button class="speed-btn" data-speed="0.5" onclick="setAudioSpeed(0.5,this)">🐢 0.5x</button>';
        h += '<button class="speed-btn" data-speed="0.75" onclick="setAudioSpeed(0.75,this)">0.75x</button>';
        h += '<button class="speed-btn active" data-speed="1" onclick="setAudioSpeed(1,this)">1x</button>';
        h += '</div>';
      } else {
        h += '<button class="speak-btn" data-audio-b64="' + btoa(unescape(encodeURIComponent(JSON.stringify(secAudioTexts)))) + '" onclick="speakSection(this)">🔊</button>';
      }
      h += '<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">Нажми Play, чтобы послушать диалог</div>';
      // Subtitles / transcript (like Chinese lessons)
      var subData = quizData.subtitles || [];
      if (subData.length > 0) {
        h += '<div class="subtitles">';
        h += '<span class="sub-toggle" onclick="toggleSubs(this)">📝 Текст диалога (нажми, чтобы показать/скрыть)</span>';
        h += '<div class="sub-body" style="display:none;">';
        subData.forEach(function(sl) {
          h += '<div class="sub-line">';
          h += '<div class="sub-speaker">' + esc(sl.speaker) + '</div>';
          h += '<div class="sub-hanzi">' + esc(sl.text) + '</div>';
          h += '</div>';
        });
        h += '</div>';
        h += '</div>';
      }
      h += '</div>';
    }
    (sec.questions||[]).forEach(q => {
      gq++; h += '<div class="question-block"><div class="question-number">Вопрос ' + gq + '</div>';
      if (q.sentence) h += '<div class="sentence">' + fmtSent(q.sentence, sec.id, q.id, q.type) + '</div>';
      h += renderOpts(sec.id, q);
      if (q.explanation) h += '<div class="explanation" id="exp_'+sec.id+'_'+q.id+'">' + esc(q.explanation) + '</div>';
      h += '</div>';
    });
    h += '</div>'; c.insertAdjacentHTML('beforeend', h);
  });
}

function speakSection(btn) {
  const texts = JSON.parse(decodeURIComponent(escape(atob(btn.dataset.audioB64))));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn || texts.length === 0) return; btn.classList.add('speaking');
  const v = window.speechSynthesis.getVoices();
  const voice = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  let idx = 0;
  function next() {
    if (idx >= texts.length) { btn.classList.remove('speaking'); return; }
    const u = new SpeechSynthesisUtterance(texts[idx]); u.lang='en-US'; u.rate=0.85;
    if (voice) u.voice = voice;
    u.onend = () => { idx++; setTimeout(next, 400); };
    u.onerror = () => { btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function speak(btn) {
  const text = btn.dataset.audioText;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn) return; btn.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
  const v = window.speechSynthesis.getVoices();
  const ev = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  if (ev) u.voice = ev;
  u.onend = () => btn.classList.remove('speaking');
  u.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) { window.speechSynthesis.getVoices(); if (window.speechSynthesis.onvoiceschanged!==undefined) { window.speechSynthesis.onvoiceschanged = function(){}; } }

function fmtTheory(t) { return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function fmtSent(s,sid,qid,type) { if(!s) return ''; if(type==='choice') return s.replace(/___+/g,'<span class="blank" id="blank_'+sid+'_'+qid+'">___</span>'); return esc(s); }

function renderOpts(sid, q) {
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type==='tf') return '<div class="options horizontal"><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="T" onclick="sel(this)">✓ True</button><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="F" onclick="sel(this)">✗ False</button></div>';
  if (q.type==='choice'||q.type==='listen') {
    let h='<div class="options">';
    var _opts = (q.options||[]).slice();
    for (var _i=_opts.length-1; _i>0; _i--) { var _j=Math.floor(Math.random()*(_i+1)); var _t=_opts[_i]; _opts[_i]=_opts[_j]; _opts[_j]=_t; }
    _opts.forEach((o,i) => { h+='<button class="option-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="'+esc(o)+'" onclick="sel(this)"><span class="letter">'+L[i]+'</span>'+esc(o)+'</button>'; });
    return h+'</div>';
  }
  return '';
}

function sel(btn) {
  const sid=btn.dataset.sec, qid=btn.dataset.q, val=btn.dataset.val;
  if(answers[sid][qid]!==null) return;
  answers[sid][qid]=val; answered++;
  const sec=sectionData.find(s=>s.id===sid), q=sec.questions.find(x=>x.id==qid);
  const corr=String(q.correct), ok=val===corr;
  btn.parentElement.querySelectorAll('.option-btn').forEach(s => {
    s.disabled=true; if(s.dataset.val===corr) s.classList.add('correct'); if(s===btn&&!ok) s.classList.add('wrong');
  });
  const bl=document.getElementById('blank_'+sid+'_'+qid);
  if(bl) { bl.textContent=corr; bl.classList.add(ok?'filled':'wrong-fill'); }
  const ex=document.getElementById('exp_'+sid+'_'+qid); if(ex) ex.classList.add('visible');
  updateProgress();
  if(answered>=totalQuestions) setTimeout(showRes, 800);
}

function updateProgress() { document.getElementById('progressFill').style.width = (totalQuestions>0?(answered/totalQuestions*100):0)+'%'; }

function showRes() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  let ok=0, d='';
  sectionData.forEach(sec => {
    sec.questions.forEach(q => {
      const ua=answers[sec.id][q.id], cs=String(q.correct), isOK=ua===cs; if(isOK) ok++;
      d+='<div class="result-item"><div class="ri-q">'+esc(sec.title)+' — '+q.id+'</div>';
      if(q.sentence) d+='<div>'+esc(q.sentence.replace(/___+/g,cs))+'</div>';
      else if(q.options) d+='<div>'+esc(q.options.join(' / '))+'</div>';
      if(!isOK&&ua!==null) d+='<div><span class="ri-wrong">'+esc(ua)+'</span> <span class="ri-correct">'+esc(cs)+'</span></div>';
      if(isOK) d+='<div><span class="ri-correct">✓ '+esc(cs)+'</span></div>';
      if(q.explanation) d+='<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">'+esc(q.explanation)+'</div>';
      d+='</div>';
    });
  });
  const p=Math.round(ok/totalQuestions*100), el=document.getElementById('scoreDisplay');
  el.innerHTML=ok+'/'+totalQuestions+' <span class="pct">('+p+'%)</span>';
  el.className='score '+(p>=90?'excellent':p>=60?'good':'needs-work');
  let m=''; if(p>=90) m='🎉 Отлично!'; else if(p>=70) m='👍 Хороший результат!'; else if(p>=50) m='📚 Стоит повторить.'; else m='💪 Попробуй ещё раз!';
  document.getElementById('scoreMessage').textContent=m;
  document.getElementById('resultsDetail').innerHTML='<h3>Подробно</h3>'+d;
}

function restartQuiz() {
  answered=0; if(window.speechSynthesis) window.speechSynthesis.cancel();
  Object.keys(answers).forEach(k=>Object.keys(answers[k]).forEach(qk=>answers[k][qk]=null));
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll(); updateProgress(); window.scrollTo(0,0);
  // Re-attach audio ended handler after re-render
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function setAudioSpeed(speed, btn) {
  const audio = document.getElementById('dialogAudio');
  if (audio) audio.playbackRate = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toggleSubs(el) { var body = el.parentElement.querySelector('.sub-body'); if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none'; }
init();
</script>
