<style>

.speed-btn.active { background: rgba(233,69,96,0.2); border-color: var(--accent); color: var(--accent-light); font-weight: 600; }

<script>
const quizData = {"title": "Home Repairs & Renting + Zero and First Conditional", "subtitle": "2026-09-03", "date": "2026-09-03", "phrase_of_the_day": "It's on the blink", "phrase_translation": "Оно барахлит, вот-вот сломается (о технике)", "audio_url": "https://nataliastanislavovna.github.io/english-quiz/lessons/audio_0903.mp3", "sections": [{"id": "s1", "title": "Vocabulary — Repairs & Renting", "icon": "📚", "theory": "", "instruction": "", "questions": [{"id": "v1", "type": "choice", "sentence": "Who is a \"landlord\"?", "options": ["The person who rents a flat from someone", "The person who owns a flat and rents it out", "The person who repairs boilers and taps", "The person who cleans the building"], "correct": "The person who owns a flat and rents it out", "explanation": "Landlord — арендодатель, владелец квартиры, который сдаёт её в аренду. А тот, кто снимает, — это tenant. Например: I called my landlord about the leak — я позвонила арендодателю насчёт утечки."}, {"id": "v2", "type": "choice", "sentence": "There is a \"leak\" under the kitchen sink. What is the problem?", "options": ["The sink is blocked and water doesn't go down", "Water is escaping through a hole or a broken pipe", "The tap is too old-fashioned", "The sink is too small"], "correct": "Water is escaping through a hole or a broken pipe", "explanation": "Leak — утечка, протечка: вода просачивается через дыру или повреждённую трубу. There's a leak under the sink — под раковиной протекает. Похожее слово: a leaky tap — подтекающий кран."}, {"id": "v3", "type": "choice", "sentence": "Which of these is a \"household appliance\"?", "options": ["A sofa", "A washing machine", "A picture on the wall", "A bath towel"], "correct": "A washing machine", "explanation": "Household appliances — бытовая техника: washing machine (стиральная машина), fridge (холодильник), dishwasher (посудомоечная машина), boiler (котёл, бойлер). Sofa и полотенце — это мебель и вещи, а не техника. Глагол to break down — сломаться (о технике и машинах)."}, {"id": "v4", "type": "choice", "sentence": "When you rent a flat, you often pay a \"deposit\". What is it?", "options": ["A monthly payment for the internet", "A small gift for the landlord", "Money that is kept as security and returned when you move out", "The fee for using the lift"], "correct": "Money that is kept as security and returned when you move out", "explanation": "Deposit — залог: сумма, которую арендатор оставляет арендодателю как гарантию. Если квартира в порядке, залог возвращают при выезде. Ещё полезные слова: to rent a flat — снимать квартиру, rent — арендная плата, utilities — коммунальные услуги (электричество, вода, отопление)."}]}, {"id": "s2", "title": "Grammar — Zero & First Conditional", "icon": "📖", "theory": "", "instruction": "", "questions": [{"id": "g1", "type": "choice", "sentence": "If the boiler ___ down again, I'll call a plumber myself.", "options": ["will break", "breaks", "broke", "would break"], "correct": "breaks", "explanation": "Первый условный (First Conditional): If + Present Simple, will + инфинитив. Условие относится к будущему, но в части с if будущее время НЕ используется: If the boiler breaks down again, I'll call a plumber — если котёл снова сломается, я сама вызову сантехника."}, {"id": "g2", "type": "choice", "sentence": "Choose the correct sentence.", "options": ["Unless the landlord doesn't fix it, I'll move out.", "Unless the landlord fixes it, I'll move out.", "Unless the landlord will fix it, I move out.", "Unless the landlord fixed it, I'll move out."], "correct": "Unless the landlord fixes it, I'll move out.", "explanation": "Unless = if not, «если не». После unless глагол стоит в утвердительной форме: Unless the landlord fixes it = If the landlord doesn't fix it — если арендодатель не починит это, я съеду. Частая ошибка — писать don't после unless, получается двойное отрицание."}, {"id": "g3", "type": "tf", "sentence": "\"As long as\" and \"provided that\" can both mean \"if\" with the sense of \"on condition that\" (при условии, что).", "options": [], "correct": "T", "explanation": "Верно. As long as и provided that вводят условие со смыслом «при условии, что»: As long as you pay the rent on time, nobody will bother you — при условии что вы платите вовремя, никто вас не побеспокоит. Provided that значит то же самое, звучит чуть официальнее."}, {"id": "g4", "type": "choice", "sentence": "Which sentence is a Zero Conditional (a general fact, not a future plan)?", "options": ["If the tap leaks, water runs all over the floor.", "If the tap leaks, I'll turn off the water.", "If the tap leaked, I would turn off the water.", "If the tap will leak, I turn off the water."], "correct": "If the tap leaks, water runs all over the floor.", "explanation": "Нулевой условный (Zero Conditional) описывает общий факт, закономерность: If + Present Simple, Present Simple. Если кран подтекает, вода льётся на пол — это всегда так, в любое время. А вариант с will — это уже First Conditional: конкретное решение на будущее."}]}, {"id": "s3", "title": "Practical English", "icon": "💬", "theory": "", "instruction": "", "questions": [{"id": "p1", "type": "choice", "sentence": "You rent a flat and the fridge has stopped working. What do you write to the landlord?", "options": ["Fridge dead. Fix fast.", "The fridge has stopped working. Could you send someone to repair it?", "I will buy a new fridge, give me money.", "Why is your fridge always broken?"], "correct": "The fridge has stopped working. Could you send someone to repair it?", "explanation": "Разумный тон с арендодателем: сначала констатировать проблему (The fridge has stopped working — холодильник перестал работать), потом вежливая просьба: Could you send someone to repair it? — не могли бы вы прислать мастера? Present Perfect подчёркивает результат: он сейчас не работает."}, {"id": "p2", "type": "choice", "sentence": "The landlord says: \"The washing machine is still under warranty.\" What does this mean?", "options": ["The machine is very old", "The repair will be free, because the guarantee period hasn't finished yet", "The machine belongs to the landlord", "The machine is dangerous to use"], "correct": "The repair will be free, because the guarantee period hasn't finished yet", "explanation": "Warranty — гарантия на технику. Under warranty — на гарантии: если гарантийный срок ещё не закончился, ремонт или замену делает производитель бесплатно. После окончания гарантии ремонт платный. She sent the phone back under warranty — она вернула телефон по гарантии."}]}, {"id": "s4", "title": "Challenge", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": "c1", "type": "choice", "sentence": "Your colleague says: \"Don't use the office printer, it's on the blink.\" What does he mean?", "options": ["The printer has been stolen", "The printer is not working properly and may break down completely", "The printer is brand new and very expensive", "The printer belongs to another department"], "correct": "The printer is not working properly and may break down completely", "explanation": "On the blink — разговорное выражение про технику: барахлит, сбоит, на ладан дышит, может совсем сломаться. My laptop is on the blink again — мой ноутбук опять барахлит. Фраза дня этого урока."}, {"id": "c2", "type": "choice", "sentence": "Choose the sentence where \"in case\" is used correctly.", "options": ["I'll call a plumber in case the leak gets worse. I'm doing it now, before anything happens.", "I'll call a plumber in case the leak gets worse. I'll do it only when it gets worse.", "In case the leak gets worse, so I called nobody.", "The leak got worse in case I called a plumber."], "correct": "I'll call a plumber in case the leak gets worse. I'm doing it now, before anything happens.", "explanation": "Разница между if и in case — классическая ловушка на уровне B2. If — действие происходит ПОСЛЕ события: I'll call a plumber if the leak gets worse (вызову, когда станет хуже). In case — действие делается ЗАРАНЕЕ, на всякий случай: вызову сантехника сейчас, чтобы быть готовой, если станет хуже. After in case глагол не меняется: in case it rains, in case he comes."}]}, {"id": "s5", "title": "Listening Comprehension", "icon": "🎧", "theory": "", "instruction": "Listen to the audio, then answer the questions below.", "questions": [{"id": "l1", "type": "listen", "sentence": "Listen to the dialogue. What two problems does Kate report?", "options": ["A broken window and a lost key", "The boiler and a leak under the kitchen sink", "A noisy neighbour and a blocked sink", "The washing machine and the fridge"], "correct": "The boiler and a leak under the kitchen sink", "explanation": "Кейт называет две проблемы: the boiler is on the blink again — котёл снова барахлит, утром не было горячей воды, и there's a leak under the kitchen sink — под кухонной раковиной протечка. Стиральная машина тоже упоминается, но это просьба посмотреть заодно, а не основная проблема.", "audio_text": "Kate(F): Hi David, it's Kate from flat twelve. Do you have a minute?\nDavid(M): Hi Kate. For my best tenant, always. What's up?\nKate(F): I'm afraid the boiler is on the blink again. There was no hot water this morning.\nDavid(M): Not again. I had it repaired in June!\nKate(F): And there's a leak under the kitchen sink. I put a bucket under it, but it fills up every few hours.\nDavid(M): All right, I'll call a plumber today, as long as he can come this week.\nKate(F): Could you ask him to look at the washing machine too? It makes a strange noise.\nDavid(M): If it's still under warranty, the repair will be free. If not, I'll pay for the parts myself.\nKate(F): That's very decent of you. By the way, the utility bills went up again. Could you send me the new readings?\nDavid(M): Sure, I'll email them tonight. And the rent?\nKate(F): You'll get it on Friday, as always. No need to ask.\nDavid(M): I know, I know. I just enjoy asking.\nKate(F): David, unless something breaks in this flat, I won't call you at all.\nDavid(M): Well, in this flat something always breaks. Practically a house rule.\nKate(F): Fair point. If anything else goes wrong, I'll call you straight away.\nDavid(M): Please do. Unless it's after ten at night.\nKate(F): Even then?\nDavid(M): Even then. For you, Kate, I'm a twenty-four-hour landlord."}, {"id": "l2", "type": "listen", "sentence": "Listen to the dialogue again. What does David say about the washing machine repair?", "options": ["Kate must pay for everything herself", "It will be free if the machine is still under warranty; otherwise he will pay for the parts", "He will buy a new washing machine", "The repair is impossible this month"], "correct": "It will be free if the machine is still under warranty; otherwise he will pay for the parts", "explanation": "Дэвид говорит: If it's still under warranty, the repair will be free. If not, I'll pay for the parts myself — если стиральная машина ещё на гарантии, ремонт будет бесплатным, а если нет, он сам заплатит за детали. Это первый условный: If + Present Simple, will + инфинитив."}]}], "subtitles": [{"speaker": "Kate", "text": "Hi David, it's Kate from flat twelve. Do you have a minute?"}, {"speaker": "David", "text": "Hi Kate. For my best tenant, always. What's up?"}, {"speaker": "Kate", "text": "I'm afraid the boiler is on the blink again. There was no hot water this morning."}, {"speaker": "David", "text": "Not again. I had it repaired in June!"}, {"speaker": "Kate", "text": "And there's a leak under the kitchen sink. I put a bucket under it, but it fills up every few hours."}, {"speaker": "David", "text": "All right, I'll call a plumber today, as long as he can come this week."}, {"speaker": "Kate", "text": "Could you ask him to look at the washing machine too? It makes a strange noise."}, {"speaker": "David", "text": "If it's still under warranty, the repair will be free. If not, I'll pay for the parts myself."}, {"speaker": "Kate", "text": "That's very decent of you. By the way, the utility bills went up again. Could you send me the new readings?"}, {"speaker": "David", "text": "Sure, I'll email them tonight. And the rent?"}, {"speaker": "Kate", "text": "You'll get it on Friday, as always. No need to ask."}, {"speaker": "David", "text": "I know, I know. I just enjoy asking."}, {"speaker": "Kate", "text": "David, unless something breaks in this flat, I won't call you at all."}, {"speaker": "David", "text": "Well, in this flat something always breaks. Practically a house rule."}, {"speaker": "Kate", "text": "Fair point. If anything else goes wrong, I'll call you straight away."}, {"speaker": "David", "text": "Please do. Unless it's after ten at night."}, {"speaker": "Kate", "text": "Even then?"}, {"speaker": "David", "text": "Even then. For you, Kate, I'm a twenty-four-hour landlord."}]};
let answered = 0, totalQuestions = 0, answers = {}, sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(s => {
    if (!answers[s.id]) answers[s.id] = {};
    (s.questions || []).forEach(q => { totalQuestions++; answers[s.id][q.id] = null; });
  });
  renderAll(); updateProgress();
  // Fix: after audio ends, reset so it can be replayed
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

    var secAudioTexts = [...new Set((sec.questions||[]).filter(q=>q.type==='listen'&&q.audio_text).map(q=>q.audio_text))];
    var secAudioUrl = quizData.audio_url || '';
    if (secAudioTexts.length > 0) {

      if (secAudioUrl) {

        h += '<div style="margin-top:8px;display:flex;justify-content:center;gap:8px;align-items:center;">';

        h += '<button class="speed-btn" data-speed="0.5" onclick="setAudioSpeed(0.5,this)">🐢 0.5x</button>';
        h += '<button class="speed-btn" data-speed="0.75" onclick="setAudioSpeed(0.75,this)">0.75x</button>';
        h += '<button class="speed-btn active" data-speed="1" onclick="setAudioSpeed(1,this)">1x</button>';
        h += '</div>';
      } else {
        h += '<button class="speak-btn" data-audio-b64="' + btoa(unescape(encodeURIComponent(JSON.stringify(secAudioTexts)))) + '" onclick="speakSection(this)">🔊</button>';
      }
      h += '<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">Нажми Play, чтобы послушать диалог</div>';
      // Subtitles / transcript (like Chinese lessons)
      var subData = quizData.subtitles || [];
      if (subData.length > 0) {
        h += '<div class="subtitles">';
        h += '<span class="sub-toggle" onclick="toggleSubs(this)">📝 Текст диалога (нажми, чтобы показать/скрыть)</span>';
        h += '<div class="sub-body" style="display:none;">';
        subData.forEach(function(sl) {
          h += '<div class="sub-line">';
          h += '<div class="sub-speaker">' + esc(sl.speaker) + '</div>';
          h += '<div class="sub-hanzi">' + esc(sl.text) + '</div>';
          h += '</div>';
        });
        h += '</div>';
        h += '</div>';
      }
      h += '</div>';
    }
    (sec.questions||[]).forEach(q => {
      gq++; h += '<div class="question-block"><div class="question-number">Вопрос ' + gq + '</div>';
      if (q.sentence) h += '<div class="sentence">' + fmtSent(q.sentence, sec.id, q.id, q.type) + '</div>';
      h += renderOpts(sec.id, q);
      if (q.explanation) h += '<div class="explanation" id="exp_'+sec.id+'_'+q.id+'">' + esc(q.explanation) + '</div>';
      h += '</div>';
    });
    h += '</div>'; c.insertAdjacentHTML('beforeend', h);
  });
}

function speakSection(btn) {
  const texts = JSON.parse(decodeURIComponent(escape(atob(btn.dataset.audioB64))));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn || texts.length === 0) return; btn.classList.add('speaking');
  const v = window.speechSynthesis.getVoices();
  const voice = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  let idx = 0;
  function next() {
    if (idx >= texts.length) { btn.classList.remove('speaking'); return; }
    const u = new SpeechSynthesisUtterance(texts[idx]); u.lang='en-US'; u.rate=0.85;
    if (voice) u.voice = voice;
    u.onend = () => { idx++; setTimeout(next, 400); };
    u.onerror = () => { btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function speak(btn) {
  const text = btn.dataset.audioText;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn) return; btn.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
  const v = window.speechSynthesis.getVoices();
  const ev = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  if (ev) u.voice = ev;
  u.onend = () => btn.classList.remove('speaking');
  u.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) { window.speechSynthesis.getVoices(); if (window.speechSynthesis.onvoiceschanged!==undefined) { window.speechSynthesis.onvoiceschanged = function(){}; } }

function fmtTheory(t) { return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function fmtSent(s,sid,qid,type) { if(!s) return ''; if(type==='choice') return s.replace(/___+/g,'<span class="blank" id="blank_'+sid+'_'+qid+'">___</span>'); return esc(s); }

function renderOpts(sid, q) {
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type==='tf') return '<div class="options horizontal"><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="T" onclick="sel(this)">✓ True</button><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="F" onclick="sel(this)">✗ False</button></div>';
  if (q.type==='choice'||q.type==='listen') {
    let h='<div class="options">';
    var _opts = (q.options||[]).slice();
    for (var _i=_opts.length-1; _i>0; _i--) { var _j=Math.floor(Math.random()*(_i+1)); var _t=_opts[_i]; _opts[_i]=_opts[_j]; _opts[_j]=_t; }
    _opts.forEach((o,i) => { h+='<button class="option-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="'+esc(o)+'" onclick="sel(this)"><span class="letter">'+L[i]+'</span>'+esc(o)+'</button>'; });
    return h+'</div>';
  }
  return '';
}

function sel(btn) {
  const sid=btn.dataset.sec, qid=btn.dataset.q, val=btn.dataset.val;
  if(answers[sid][qid]!==null) return;
  answers[sid][qid]=val; answered++;
  const sec=sectionData.find(s=>s.id===sid), q=sec.questions.find(x=>x.id==qid);
  const corr=String(q.correct), ok=val===corr;
  btn.parentElement.querySelectorAll('.option-btn').forEach(s => {
    s.disabled=true; if(s.dataset.val===corr) s.classList.add('correct'); if(s===btn&&!ok) s.classList.add('wrong');
  });
  const bl=document.getElementById('blank_'+sid+'_'+qid);
  if(bl) { bl.textContent=corr; bl.classList.add(ok?'filled':'wrong-fill'); }
  const ex=document.getElementById('exp_'+sid+'_'+qid); if(ex) ex.classList.add('visible');
  updateProgress();
  if(answered>=totalQuestions) setTimeout(showRes, 800);
}

function updateProgress() { document.getElementById('progressFill').style.width = (totalQuestions>0?(answered/totalQuestions*100):0)+'%'; }

function showRes() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  let ok=0, d='';
  sectionData.forEach(sec => {
    sec.questions.forEach(q => {
      const ua=answers[sec.id][q.id], cs=String(q.correct), isOK=ua===cs; if(isOK) ok++;
      d+='<div class="result-item"><div class="ri-q">'+esc(sec.title)+' — '+q.id+'</div>';
      if(q.sentence) d+='<div>'+esc(q.sentence.replace(/___+/g,cs))+'</div>';
      else if(q.options) d+='<div>'+esc(q.options.join(' / '))+'</div>';
      if(!isOK&&ua!==null) d+='<div><span class="ri-wrong">'+esc(ua)+'</span> <span class="ri-correct">'+esc(cs)+'</span></div>';
      if(isOK) d+='<div><span class="ri-correct">✓ '+esc(cs)+'</span></div>';
      if(q.explanation) d+='<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">'+esc(q.explanation)+'</div>';
      d+='</div>';
    });
  });
  const p=Math.round(ok/totalQuestions*100), el=document.getElementById('scoreDisplay');
  el.innerHTML=ok+'/'+totalQuestions+' <span class="pct">('+p+'%)</span>';
  el.className='score '+(p>=90?'excellent':p>=60?'good':'needs-work');
  let m=''; if(p>=90) m='🎉 Отлично!'; else if(p>=70) m='👍 Хороший результат!'; else if(p>=50) m='📚 Стоит повторить.'; else m='💪 Попробуй ещё раз!';
  document.getElementById('scoreMessage').textContent=m;
  document.getElementById('resultsDetail').innerHTML='<h3>Подробно</h3>'+d;
}

function restartQuiz() {
  answered=0; if(window.speechSynthesis) window.speechSynthesis.cancel();
  Object.keys(answers).forEach(k=>Object.keys(answers[k]).forEach(qk=>answers[k][qk]=null));
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll(); updateProgress(); window.scrollTo(0,0);
  // Re-attach audio ended handler after re-render
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function setAudioSpeed(speed, btn) {
  const audio = document.getElementById('dialogAudio');
  if (audio) audio.playbackRate = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toggleSubs(el) { var body = el.parentElement.querySelector('.sub-body'); if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none'; }
init();
</script>
</body>
