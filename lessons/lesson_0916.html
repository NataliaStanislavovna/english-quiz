<style>

body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; -webkit-tap-highlight-color: transparent; }

.subtitles { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 10px; text-align: left; }

const quizData = {"title": "Directions & City: Around the Neighbourhood + Question Tags", "subtitle": "2026-09-16", "date": "2026-09-16", "phrase_of_the_day": "You can't miss it", "phrase_translation": "Мимо не пройдёшь. Говорят, объясняя дорогу: нужное место настолько заметное, что вы его точно увидите. Go straight on and turn left at the church — you can't miss it.", "audio_url": "https://nataliastanislavovna.github.io/english-quiz/lessons/audio_0916.mp3", "sections": [{"id": "s1", "title": "Vocabulary — Around the Neighbourhood", "icon": "📚", "theory": "", "instruction": "", "questions": [{"id": "v1", "type": "choice", "sentence": "You are driving and reach a circular place where several roads meet, and all the traffic moves around it. What is this place called?", "options": ["A roundabout — a circular road where traffic moves around it", "A crossroads — a place where two roads simply cross", "A junction — any place where two or more roads meet", "A dead end — a street that has no way out at the end"], "correct": "A roundabout — a circular road where traffic moves around it", "explanation": "Roundabout = круговое движение, «круг» на дороге: машины едут вокруг центра, а выезды расположены по кругу. Crossroads = перекрёсток, где две дороги просто пересекаются. Junction — общее слово для любого места, где дороги соединяются (a motorway junction — развязка). Dead end = тупик."}, {"id": "v2", "type": "choice", "sentence": "You know a small side street that saves you ten minutes on the way to the station. What is this quicker route called?", "options": ["A shortcut — a quicker way to get somewhere", "A landmark — a tall building that helps you find your way", "A detour — a longer way you take to avoid a problem", "A suburb — an area of houses on the edge of a city"], "correct": "A shortcut — a quicker way to get somewhere", "explanation": "A shortcut = короткая дорога, путь-«срезка»: to take a shortcut = пойти коротким путём. Не путайте с a detour — это объезд, наоборот, более длинный путь, чтобы объехать пробку или закрытую улицу. Landmark = ориентир, заметное здание или памятник, по которому легко узнать место."}, {"id": "v3", "type": "choice", "sentence": "In Britain, what do you call the place with black and white stripes on the road where people can safely cross to the other side?", "options": ["A zebra crossing — a striped place where people cross safely", "A roundabout — a circle in the road where the traffic goes around", "A dead end — a street that suddenly has no exit at the end", "A landmark — a famous building that is easy to recognise"], "correct": "A zebra crossing — a striped place where people cross safely", "explanation": "A zebra crossing = «зебра», пешеходный переход с белыми полосами: у него машины обязаны остановиться и пропустить пешеходов. Общее слово для любого перехода — a pedestrian crossing (подземный — an underpass). Zebra — это зебра, полосы как у зебры, отсюда и название."}, {"id": "v4", "type": "choice", "sentence": "Anna's family moved out of the busy centre to a quiet area of family houses on the edge of the city. Where do they live now?", "options": ["In the suburbs — quiet housing areas on the edge of a city", "In the city centre — the busy heart of the city with offices", "In the countryside — farms and fields far away from the city", "In the neighbourhood — all the streets that surround your home"], "correct": "In the suburbs — quiet housing areas on the edge of a city", "explanation": "The suburbs = пригород, спальный район на окраине города (по-английски почти всегда во множественном числе). Neighbourhood = район, квартал вокруг вашего дома — это слово не про окраину, а про «рядом с домом». Countryside = сельская местность, за городом вообще."}]}, {"id": "s2", "title": "Grammar — Question Tags", "icon": "📖", "theory": "", "instruction": "", "questions": [{"id": "g1", "type": "choice", "sentence": "Complete the question tag: 'You have just moved into the flat upstairs, ___?'", "options": ["haven't you", "didn't you", "don't you", "hadn't you"], "correct": "haven't you", "explanation": "Основное правило «разделительного вопроса»: утвердительное предложение → отрицательный хвост, и в хвосте тот же глагол, что в предложении. You have just moved → haven't you? Вспоминаем: have здесь — вспомогательный (Present Perfect), поэтому он и переходит в хвост. Если бы было «You moved in last week», хвост был бы didn't you?"}, {"id": "g2", "type": "choice", "sentence": "Complete the question tag: 'Nobody in this building uses the old lift anymore, ___?'", "options": ["do they", "does he", "don't they", "does it"], "correct": "do they", "explanation": "Ловушка с «пустыми» подлежащими: Nobody, Everybody, Somebody, Everyone = они! Поэтому хвост строится с they. Предложение формально отрицательное (nobody), значит хвост должен быть утвердительным: Nobody uses it anymore, do they? Правило: nobody/everybody + they, nothing/everything + it."}, {"id": "g3", "type": "choice", "sentence": "Complete the question tag: 'I'm on the right track to the post office, ___?'", "options": ["aren't I", "isn't I", "isn't it", "aren't you"], "correct": "aren't I", "explanation": "Знаменитое исключение: I am → aren't I? По правилам должно быть am not I, но так не говорят — в разговорном английском принято aren't I. I'm late, aren't I? — Я опаздываю, не так ли? Это единственное «неправильное» место во всей системе вопросительных хвостов."}, {"id": "g4", "type": "choice", "sentence": "Complete the question tag: 'Let's ask at the corner shop for directions, ___?'", "options": ["shall we", "will we", "don't we", "will you"], "correct": "shall we", "explanation": "Предложение Let's... (= давайте...) всегда получает хвост shall we? Let's go for a walk, shall we? Сравните: обычное побуждение к собеседнику получает will you или won't you (Open the window, will you?), а отрицательная просьба — только will you (Don't be late, will you?)."}]}, {"id": "s3", "title": "Practical English — Asking for Directions", "icon": "💬", "theory": "", "instruction": "", "questions": [{"id": "p1", "type": "choice", "sentence": "You are lost in a new city and want to ask a stranger the way to the railway station. What is the most natural way to begin?", "options": ["Excuse me, could you tell me the way to the station, please?", "Tell me where is the station, I am completely lost here", "You must explain to me how exactly I can find the station", "I want that you show me the station on this map right now"], "correct": "Excuse me, could you tell me the way to the station, please?", "explanation": "Разговорная формула: Excuse me (извините, чтобы начать разговор с незнакомцем) + Could you tell me the way to...? Обратите внимание: после Could you tell me... слово where уже не требует вопроса — скажем ...tell me where the station is, а не where is the station. Естественные варианты: How do I get to...? Is it far from here? Is this the right way for...?"}, {"id": "p2", "type": "choice", "sentence": "A passer-by says: 'Go straight on until you get to the traffic lights, then take the second left.' What should you do first?", "options": ["Walk straight ahead and look for the traffic lights", "Turn left twice before you reach the traffic lights", "Cross the road at the second zebra crossing nearby", "Turn right at the second set of traffic lights there"], "correct": "Walk straight ahead and look for the traffic lights", "explanation": "Go straight on = идите прямо. Сначала — прямо до светофора, и только потом второй поворот налево. Полезные глаголы направления: turn left / turn right = поверните, take the first left = первый поворот налево, go past the church = пройдите мимо церкви, it's on your left = это будет по левую сторону."}]}, {"id": "s4", "title": "Challenge", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": "c1", "type": "choice", "sentence": "Complete the question tag: 'Your grandfather used to run that corner shop, ___?'", "options": ["didn't he", "didn't they", "doesn't he", "wasn't he"], "correct": "didn't he", "explanation": "С used to хвост строится с didn't: He used to run the shop, didn't he? Used to — это прошедшее время, а хвост берёт вспомогательный глагол прошедшего времени do. Не говорите usedn't he — эта форма считается старомодной, в современном английском — didn't he? Ещё пример: You used to live here, didn't you?"}, {"id": "c2", "type": "choice", "sentence": "Complete the question tag: 'Don't get lost on your way home, ___?'", "options": ["will you", "won't we", "won't you", "don't you"], "correct": "will you", "explanation": "С отрицательным побуждением (Don't...) хвост всегда will you: Don't be late, will you? Don't forget, will you? С обычным, положительным побуждением возможны will you или won't you (Open the door, will you / won't you?), а с предложением Let's — только shall we. Запомните тройку: Let's → shall we, Don't → will you, I am → aren't I."}]}, {"id": "s5", "title": "Listening Comprehension", "icon": "🎧", "theory": "", "instruction": "Listen to the audio, then answer the questions below.", "questions": [{"id": "l1", "type": "listen", "sentence": "Listen to the dialogue. What happened to Emma when she went out for bread this morning?", "options": ["She took a shortcut and ended up in a dead end by the railway", "She got lost in the park somewhere behind the old church", "She missed the bakery because it had already closed for the day", "She waited fifteen minutes for bus number nine at the corner"], "correct": "She took a shortcut and ended up in a dead end by the railway", "explanation": "Эмма пошла за хлебом, решила срезать дорогу (I took what looked like a shortcut) и попала в тупик у железной дороги (ended up in a dead end next to the railway). Обратите внимание на полезную пару слов: a shortcut — короткий путь, a dead end — тупик.", "audio_text": "Mark(M): Hello there! You must be the new neighbour from flat twelve.\nEmma(F): That's me. Emma. Nice to meet you. You're in flat eight, aren't let answered = 0, totalQuestions = 0, answers = {}, sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(s => {
    if (!answers[s.id]) answers[s.id] = {};
    (s.questions || []).forEach(q => { totalQuestions++; answers[s.id][q.id] = null; });
  });
  renderAll(); updateProgress();
  // Fix: after audio ends, reset so it can be replayed
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function renderAll() {
  const c = document.getElementById('quizContent'); c.innerHTML = ''; let gq = 0;
  sectionData.forEach(sec => {
    let h = '<div class="section-card" id="section_' + sec.id + '">';
    h += '<div class="section-title"><span class="icon">' + (sec.icon||'📝') + '</span>' + esc(sec.title) + '</div>';
    if (sec.theory) h += '<div class="theory">' + fmtTheory(sec.theory) + '</div>';
    if (sec.instruction) h += '<div style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(sec.instruction) + '</div>';
    // Section-level audio: use pre-generated MP3 if available, else TTS fallback
    var secAudioTexts = [...new Set((sec.questions||[]).filter(q=>q.type==='listen'&&q.audio_text).map(q=>q.audio_text))];
    var secAudioUrl = quizData.audio_url || '';
    if (secAudioTexts.length > 0) {
      h += '<div class="section-audio">';
      if (secAudioUrl) {
        h += '<audio id="dialogAudio" controls preload="auto" style="width:100%;border-radius:10px;margin-bottom:6px;">';
        h += '<source src="' + secAudioUrl + '" type="audio/mpeg">';
        h += '</audio>';
        h += '<div style="margin-top:8px;display:flex;justify-content:center;gap:8px;align-items:center;">';
        h += '<span style="font-size:12px;color:var(--text-dim);">Скорость:</span>';
        h += '<button class="speed-btn" data-speed="0.5" onclick="setAudioSpeed(0.5,this)">🐢 0.5x</button>';
        h += '<button class="speed-btn" data-speed="0.75" onclick="setAudioSpeed(0.75,this)">0.75x</button>';
        h += '<button class="speed-btn active" data-speed="1" onclick="setAudioSpeed(1,this)">1x</button>';
        h += '</div>';
      } else {
        h += '<button class="speak-btn" data-audio-b64="' + btoa(unescape(encodeURIComponent(JSON.stringify(secAudioTexts)))) + '" onclick="speakSection(this)">🔊</button>';
      }
      h += '<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">Нажми Play, чтобы послушать диалог</div>';
      // Subtitles / transcript (like Chinese lessons)
      var subData = quizData.subtitles || [];
      if (subData.length > 0) {
        h += '<div class="subtitles">';
        h += '<span class="sub-toggle" onclick="toggleSubs(this)">📝 Текст диалога (нажми, чтобы показать/скрыть)</span>';
        h += '<div class="sub-body" style="display:none;">';
        subData.forEach(function(sl) {
          h += '<div class="sub-line">';
          h += '<div class="sub-speaker">' + esc(sl.speaker) + '</div>';
          h += '<div class="sub-hanzi">' + esc(sl.text) + '</div>';
          h += '</div>';
        });
        h += '</div>';
        h += '</div>';
      }
      h += '</div>';
    }
    (sec.questions||[]).forEach(q => {
      gq++; h += '<div class="question-block"><div class="question-number">Вопрос ' + gq + '</div>';
      if (q.sentence) h += '<div class="sentence">' + fmtSent(q.sentence, sec.id, q.id, q.type) + '</div>';
      h += renderOpts(sec.id, q);
      if (q.explanation) h += '<div class="explanation" id="exp_'+sec.id+'_'+q.id+'">' + esc(q.explanation) + '</div>';
      h += '</div>';
    });
    h += '</div>'; c.insertAdjacentHTML('beforeend', h);
  });
}

function speakSection(btn) {
  const texts = JSON.parse(decodeURIComponent(escape(atob(btn.dataset.audioB64))));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn || texts.length === 0) return; btn.classList.add('speaking');
  const v = window.speechSynthesis.getVoices();
  const voice = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  let idx = 0;
  function next() {
    if (idx >= texts.length) { btn.classList.remove('speaking'); return; }
    const u = new SpeechSynthesisUtterance(texts[idx]); u.lang='en-US'; u.rate=0.85;
    if (voice) u.voice = voice;
    u.onend = () => { idx++; setTimeout(next, 400); };
    u.onerror = () => { btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function speak(btn) {
  const text = btn.dataset.audioText;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn) return; btn.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
  const v = window.speechSynthesis.getVoices();
  const ev = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  if (ev) u.voice = ev;
  u.onend = () => btn.classList.remove('speaking');
  u.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) { window.speechSynthesis.getVoices(); if (window.speechSynthesis.onvoiceschanged!==undefined) { window.speechSynthesis.onvoiceschanged = function(){}; } }

function fmtTheory(t) { return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function fmtSent(s,sid,qid,type) { if(!s) return ''; if(type==='choice') return s.replace(/___+/g,'<span class="blank" id="blank_'+sid+'_'+qid+'">___</span>'); return esc(s); }

function renderOpts(sid, q) {
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type==='tf') return '<div class="options horizontal"><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="T" onclick="sel(this)">✓ True</button><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="F" onclick="sel(this)">✗ False</button></div>';
  if (q.type==='choice'||q.type==='listen') {
    let h='<div class="options">';
    var _opts = (q.options||[]).slice();
    for (var _i=_opts.length-1; _i>0; _i--) { var _j=Math.floor(Math.random()*(_i+1)); var _t=_opts[_i]; _opts[_i]=_opts[_j]; _opts[_j]=_t; }
    _opts.forEach((o,i) => { h+='<button class="option-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="'+esc(o)+'" onclick="sel(this)"><span class="letter">'+L[i]+'</span>'+esc(o)+'</button>'; });
    return h+'</div>';
  }
  return '';
}

function sel(btn) {
  const sid=btn.dataset.sec, qid=btn.dataset.q, val=btn.dataset.val;
  if(answers[sid][qid]!==null) return;
  answers[sid][qid]=val; answered++;
  const sec=sectionData.find(s=>s.id===sid), q=sec.questions.find(x=>x.id==qid);
  const corr=String(q.correct), ok=val===corr;
  btn.parentElement.querySelectorAll('.option-btn').forEach(s => {
    s.disabled=true; if(s.dataset.val===corr) s.classList.add('correct'); if(s===btn&&!ok) s.classList.add('wrong');
  });
  const bl=document.getElementById('blank_'+sid+'_'+qid);
  if(bl) { bl.textContent=corr; bl.classList.add(ok?'filled':'wrong-fill'); }
  const ex=document.getElementById('exp_'+sid+'_'+qid); if(ex) ex.classList.add('visible');
  updateProgress();
  if(answered>=totalQuestions) setTimeout(showRes, 800);
}

function updateProgress() { document.getElementById('progressFill').style.width = (totalQuestions>0?(answered/totalQuestions*100):0)+'%'; }

function showRes() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  let ok=0, d='';
  sectionData.forEach(sec => {
    sec.questions.forEach(q => {
      const ua=answers[sec.id][q.id], cs=String(q.correct), isOK=ua===cs; if(isOK) ok++;
      d+='<div class="result-item"><div class="ri-q">'+esc(sec.title)+' — '+q.id+'</div>';
      if(q.sentence) d+='<div>'+esc(q.sentence.replace(/___+/g,cs))+'</div>';
      else if(q.options) d+='<div>'+esc(q.options.join(' / '))+'</div>';
      if(!isOK&&ua!==null) d+='<div><span class="ri-wrong">'+esc(ua)+'</span> <span class="ri-correct">'+esc(cs)+'</span></div>';
      if(isOK) d+='<div><span class="ri-correct">✓ '+esc(cs)+'</span></div>';
      if(q.explanation) d+='<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">'+esc(q.explanation)+'</div>';
      d+='</div>';
    });
  });
  const p=Math.round(ok/totalQuestions*100), el=document.getElementById('scoreDisplay');
  el.innerHTML=ok+'/'+totalQuestions+' <span class="pct">('+p+'%)</span>';
  el.className='score '+(p>=90?'excellent':p>=60?'good':'needs-work');
  let m=''; if(p>=90) m='🎉 Отлично!'; else if(p>=70) m='👍 Хороший результат!'; else if(p>=50) m='📚 Стоит повторить.'; else m='💪 Попробуй ещё раз!';
  document.getElementById('scoreMessage').textContent=m;
  document.getElementById('resultsDetail').innerHTML='<h3>Подробно</h3>'+d;
}

function restartQuiz() {
  answered=0; if(window.speechSynthesis) window.speechSynthesis.cancel();
  Object.keys(answers).forEach(k=>Object.keys(answers[k]).forEach(qk=>answers[k][qk]=null));
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll(); updateProgress(); window.scrollTo(0,0);
  // Re-attach audio ended handler after re-render
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function setAudioSpeed(speed, btn) {
  const audio = document.getElementById('dialogAudio');
  if (audio) audio.playbackRate = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toggleSubs(el) { var body = el.parentElement.querySelector('.sub-body'); if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none'; }
init();
</script>
