lo."}, {"id": "v3", "type": "choice", "sentence": "This morning no trains are running because the drivers refused to work until they get better pay. What is this situation called?", "options": ["A strike — workers refuse to work to demand something", "A delay — a train leaves later than the scheduled time", "A transfer — a passenger changes to a different line", "A booking — a passenger reserves a seat on the train"], "correct": "A strike — workers refuse to work to demand something", "explanation": "Strike = забастовка. Быть на забастовке — to be on strike: The drivers are on strike. Объявить забастовку — to go on strike. Если поезда отменяют из-за забастовки, часто запускают replacement bus service — автобусы вместо поездов."}, {"id": "v4", "type": "choice", "sentence": "Mark's train was cancelled, but the railway company paid him money as an apology for the ruined journey. What is this money called?", "options": ["Compensation — money paid when a service fails you", "A deposit — money kept as security and returned later", "A refund — money given back when you return goods", "A fare — the price that you pay for one journey"], "correct": "Compensation — money paid when a service fails you", "explanation": "Compensation = компенсация, деньги за причинённые неудобства. У железных дорог Британии есть схема Delay Repay: если поезд задержали или отменили — можно подать заявку, to claim compensation. To claim = потребовать, запросить (деньги, возврат)."}]}, {"id": "s2", "title": "Grammar — Present Perfect vs Past Simple", "icon": "📖", "theory": "", "instruction": "", "questions": [{"id": "g1", "type": "choice", "sentence": "Choose the correct question about life experience:", "options": ["Have you ever missed a train because of a strike?", "Did you ever miss a train because of a strike?", "Are you ever missing a train because of a strike?", "Have you ever miss a train because of a strike?"], "correct": "Have you ever missed a train because of a strike?", "explanation": "Опыт за всю жизнь передаётся Present Perfect: Have you ever + V3 (missed)? Слово ever = «когда-нибудь» — верный сигнал Present Perfect. Когда собеседник ответит и назовёт конкретный момент (last year, in 2024), время переключится на Past Simple: Yes, I did — I missed one in Riga last winter."}, {"id": "g2", "type": "choice", "sentence": "Complete the sentence: 'I ___ my season ticket on the first of September, and I'm already using it every day.'", "options": ["bought", "have bought", "had bought", "was buying"], "correct": "bought", "explanation": "On the first of September = законченный момент прошлого (дата уже прошла). С законченным временем — Past Simple: bought. Present Perfect (have bought) нужен, когда периода нет или он ещё длится: this week, this month, today (если день не кончился)."}, {"id": "g3", "type": "choice", "sentence": "Complete the sentence: 'Kate has ___ to Manchester, so she is not answering her office phone in London.'", "options": ["gone", "been", "went", "left"], "correct": "gone", "explanation": "Классическая пара-ловушка: has gone to = уехала и ЕЩЁ там (поэтому не берёт трубку в Лондоне); has been to = была и уже вернулась (Kate has been to Manchester twice — Катя дважды ездила в Манчестер). После has нужен только третий глагол: gone, been — но не went."}, {"id": "g4", "type": "choice", "sentence": "Complete the sentence: 'There ___ three big delays on this line so far this week, and it is only Wednesday.'", "options": ["have been", "were", "had been", "are being"], "correct": "have been", "explanation": "This week + so far = неделя ещё не закончилась, период «открыт» → Present Perfect: there have been. Как только неделя пройдёт (last week), появится Past Simple: there were three delays last week. So far = «до сих пор» — ещё один маркер Present Perfect."}]}, {"id": "s3", "title": "Practical English", "icon": "💬", "theory": "", "instruction": "", "questions": [{"id": "p1", "type": "choice", "sentence": "You are late for work because roadworks stopped your bus for half an hour. Which sentence is correct English?", "options": ["I was held up by roadworks on my way to work.", "I held up by roadworks on my way to work.", "I was held on by roadworks on my way to work.", "I was held up from roadworks on my way to work."], "correct": "I was held up by roadworks on my way to work.", "explanation": "To be held up = быть задержанным по дороге (пробки, ремонт, авария). Это пассив: задержан КЕМ/ЧЕМ → предлог by (by roadworks, by traffic). Признание опоздания звучит так: Sorry I'm late, I was held up in traffic. Идиома-родственник: to hold somebody up = задерживать кого-то."}, {"id": "p2", "type": "choice", "sentence": "The bus is finally at the platform and Mark says, 'Let's get this show on the road!' What does he mean?", "options": ["It is time to start doing what we planned", "We should watch a street performance outside", "The road ahead is closed and we need a new route", "Our travelling show has finally arrived on schedule"], "correct": "It is time to start doing what we planned", "explanation": "Get the show on the road = «поехали!», пора начинать. Фраза пришла из цирка: представление грузят и в путь. Говорят, когда всё долго обсуждалось и пора наконец выдвигаться. Сегодняшняя фраза дня — идеально для утра понедельника."}]}, {"id": "s4", "title": "Challenge", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": "c1", "type": "choice", "sentence": "Complete the sentence: 'It is the first time I ___ such a long delay at this station.'", "options": ["have seen", "saw", "had seen", "am seeing"], "correct": "have seen", "explanation": "Конструкция It is the first / second / third time ВСЕГДА требует Present Perfect, даже если речь о происходящем прямо сейчас: It's the first time I have seen such a delay. Логика: момент «первый раз» ещё не закрылся — он длится в настоящем. Past Simple (saw) здесь — типичная ошибка даже на B2."}, {"id": "c2", "type": "choice", "sentence": "Complete the sentence: ' itting.\nKate(F): Can I at least get some money back for the cancelled train?\nMark(M): Yes — delayed or cancelled, you can claim through Delay Repay. Fifteen minutes or more, and you get your money back.\nKate(F): Fifteen minutes? My train was cancelled twelve hours in advance. I want a medal, not a form.\nMark(M): The form is faster, believe me. Fill it in on the website, and the money lands in your account within two weeks.\nKate(F): Fine. And can I pay for the bus with my card? Contactless?\nMark(M): Of course. Just tap when you get on. We also accept dramatic sighs, but the card is quicker.\nKate(F): One more thing — the timetable on the wall still shows the old departure times.\nMark(M): That timetable is purely decorative. Trust the screens, not the wallpaper.\nKate(F): Noted. Bus at ten thirty from platform four, claim Delay Repay, tap, breathe.\nMark(M): Exactly. Now hurry — your bus is about to leave, and it will not wait for paperwork.\nKate(F): Then let's get this show on the road. Thanks for your help!"}, {"id": "l2", "type": "listen", "sentence": "Listen to the dialogue and answer: What does Mark tell Kate about compensation for the cancelled train?", "options": ["She can claim money back through the Delay Repay website", "She must call the airline and ask them for a full refund", "She can collect the money in cash at the desk right now", "Compensation is only paid when a delay lasts over a week"], "correct": "She can claim money back through the Delay Repay website", "explanation": "Марк объясняет: задержка или отмена на пятнадцать минут и больше — деньги возвращают через Delay Repay. Нужно заполнить форму на сайте (fill it in on the website), и деньги придут на счёт в течение двух недель. Заодно он шутит, что карточка-кон так быстрее, чем «драматичные вздохи»."}]}], "subtitles": [{"speaker": "Mark", "text": "Good morning. Station information desk — how can I help you today?"}, {"speaker": "Kate", "text": "Morning. My app says all trains to the airport are cancelled today. Please tell me the app is lying."}, {"speaker": "Mark", "text": "I'm afraid the app is honest for once. The drivers are on strike until six tomorrow morning."}, {"speaker": "Kate", "text": "A strike. Wonderful. I have a flight at noon and a taxi budget of zero."}, {"speaker": "Mark", "text": "Don't panic. There's a replacement bus service from platform four — every half hour, direct to the airport."}, {"speaker": "Kate", "text": "Direct? Last time direct meant forty stops and a guided tour of every village in the county."}, {"speaker": "Mark", "text": "That was the sightseeing route. This one is really direct — forty-five minutes, traffic permitting."}, {"speaker": "Kate", "text": "Can I at least get some money back for the cancelled train?"}, {"speaker": "Mark", "text": "Yes — delayed or cancelled, you can claim through Delay Repay. Fifteen minutes or more, and you get your money back."}, {"speaker": "Kate", "text": "Fifteen minutes? My train was cancelled twelve hours in advance. I want a medal, not a form."}, {"speaker": "Mark", "text": "The form is faster, believe me. Fill it in on the website, and the money lands in your account within two weeks."}, {"speaker": "Kate", "text": "Fine. And can I pay for the bus with my card? Contactless?"}, {"speaker": "Mark", "text": "Of course. Just tap when you get on. We also accept dramatic sighs, but the card is quicker."}, {"speaker": "Kate", "text": "One more thing — the timetable on the wall still shows the old departure times."}, {"speaker": "Mark", "text": "That timetable is purely decorative. Trust the screens, not the wallpaper."}, {"speaker": "Kate", "text": "Noted. Bus at ten thirty from platform four, claim Delay Repay, tap, breathe."}, {"speaker": "Mark", "text": "Exactly. Now hurry — your bus is about to leave, and it will not wait for paperwork."}, {"speaker": "Kate", "text": "Then let's get this show on the road. Thanks for your help!"}]};

      h += '<div class="section-audio">';
      if (secAudioUrl) {
        h += '<audio id="dialogAudio" controls preload="auto" style="width:100%;border-radius:10px;margin-bottom:6px;">';
        h += '<source src="' + secAudioUrl + '" type="audio/mpeg">';
        h += '</audio>';
        h += '<div style="margin-top:8px;display:flex;justify-content:center;gap:8px;align-items:center;">';
        h += '<span style="font-size:12px;color:var(--text-dim);">Скорость:</span>';
        h += '<button class="speed-btn" data-speed="0.5" onclick="setAudioSpeed(0.5,this)">🐢 0.5x</button>';
        h += '<button class="speed-btn" data-speed="0.75" onclick="setAudioSpeed(0.75,this)">0.75x</button>';
        h += '<button class="speed-btn active" data-speed="1" onclick="setAudioSpeed(1,this)">1x</button>';
        h += '</div>';
      } else {
        h += '<button class="speak-btn" data-audio-b64="' + btoa(unescape(encodeURIComponent(JSON.stringify(secAudioTexts)))) + '" onclick="speakSection(this)">🔊</button>';
      }
      h += '<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">Нажми Play, чтобы послушать диалог</div>';
      // Subtitles / transcript (like Chinese lessons)
      var subData = quizData.subtitles || [];
      if (subData.length > 0) {
        h += '<div class="subtitles">';
        h += '<span class="sub-toggle" onclick="toggleSubs(this)">📝 Текст диалога (нажми, чтобы показать/скрыть)</span>';
        h += '<div class="sub-body" style="display:none;">';
        subData.forEach(function(sl) {
          h += '<div class="sub-line">';
          h += '<div class="sub-speaker">' + esc(sl.speaker) + '</div>';
          h += '<div class="sub-hanzi">' + esc(sl.text) + '</div>';
          h += '</div>';
        });
        h += '</div>';
        h += '</div>';
      }
      h += '</div>';
    }
    (sec.questions||[]).forEach(q => {
      gq++; h += '<div class="question-block"><div class="question-number">Вопрос ' + gq + '</div>';
      if (q.sentence) h += '<div class="sentence">' + fmtSent(q.sentence, sec.id, q.id, q.type) + '</div>';
      h += renderOpts(sec.id, q);
      if (q.explanation) h += '<div class="explanation" id="exp_'+sec.id+'_'+q.id+'">' + esc(q.explanation) + '</div>';
      h += '</div>';
    });
    h += '</div>'; c.insertAdjacentHTML('beforeend', h);
  });
}

function speakSection(btn) {
  const texts = JSON.parse(decodeURIComponent(escape(atob(btn.dataset.audioB64))));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn || texts.length === 0) return; btn.classList.add('speaking');
  const v = window.speechSynthesis.getVoices();
  const voice = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  let idx = 0;
  function next() {
    if (idx >= texts.length) { btn.classList.remove('speaking'); return; }
    const u = new SpeechSynthesisUtterance(texts[idx]); u.lang='en-US'; u.rate=0.85;
    if (voice) u.voice = voice;
    u.onend = () => { idx++; setTimeout(next, 400); };
    u.onerror = () => { btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function speak(btn) {
  const text = btn.dataset.audioText;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn) return; btn.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
  const v = window.speechSynthesis.getVoices();
  const ev = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  if (ev) u.voice = ev;
  u.onend = () => btn.classList.remove('speaking');
  u.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) { window.speechSynthesis.getVoices(); if (window.speechSynthesis.onvoiceschanged!==undefined) { window.speechSynthesis.onvoiceschanged = function(){}; } }

function fmtTheory(t) { return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function fmtSent(s,sid,qid,type) { if(!s) return ''; if(type==='choice') return s.replace(/___+/g,'<span class="blank" id="blank_'+sid+'_'+qid+'">___</span>'); return esc(s); }

function renderOpts(sid, q) {
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type==='tf') return '<div class="options horizontal"><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="T" onclick="sel(this)">✓ True</button><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="F" onclick="sel(this)">✗ False</button></div>';
  if (q.type==='choice'||q.type==='listen') {
    let h='<div class="options">';
    var _opts = (q.options||[]).slice();
    for (var _i=_opts.length-1; _i>0; _i--) { var _j=Math.floor(Math.random()*(_i+1)); var _t=_opts[_i]; _opts[_i]=_opts[_j]; _opts[_j]=_t; }
    _opts.forEach((o,i) => { h+='<button class="option-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="'+esc(o)+'" onclick="sel(this)"><span class="letter">'+L[i]+'</span>'+esc(o)+'</button>'; });
    return h+'</div>';
  }
  return '';
}

function sel(btn) {
  const sid=btn.dataset.sec, qid=btn.dataset.q, val=btn.dataset.val;
  if(answers[sid][qid]!==null) return;
  answers[sid][qid]=val; answered++;
  const sec=sectionData.find(s=>s.id===sid), q=sec.questions.find(x=>x.id==qid);
  const corr=String(q.correct), ok=val===corr;
  btn.parentElement.querySelectorAll('.option-btn').forEach(s => {
    s.disabled=true; if(s.dataset.val===corr) s.classList.add('correct'); if(s===btn&&!ok) s.classList.add('wrong');
  });
  const bl=document.getElementById('blank_'+sid+'_'+qid);
  if(bl) { bl.textContent=corr; bl.classList.add(ok?'filled':'wrong-fill'); }
  const ex=document.getElementById('exp_'+sid+'_'+qid); if(ex) ex.classList.add('visible');
  updateProgress();
  if(answered>=totalQuestions) setTimeout(showRes, 800);
}

function updateProgress() { document.getElementById('progressFill').style.width = (totalQuestions>0?(answered/totalQuestions*100):0)+'%'; }

function showRes() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  let ok=0, d='';
  sectionData.forEach(sec => {
    sec.questions.forEach(q => {
      const ua=answers[sec.id][q.id], cs=String(q.correct), isOK=ua===cs; if(isOK) ok++;
      d+='<div class="result-item"><div class="ri-q">'+esc(sec.title)+' — '+q.id+'</div>';
      if(q.sentence) d+='<div>'+esc(q.sentence.replace(/___+/g,cs))+'</div>';
      else if(q.options) d+='<div>'+esc(q.options.join(' / '))+'</div>';
      if(!isOK&&ua!==null) d+='<div><span class="ri-wrong">'+esc(ua)+'</span> <span class="ri-correct">'+esc(cs)+'</span></div>';
      if(isOK) d+='<div><span class="ri-correct">✓ '+esc(cs)+'</span></div>';
      if(q.explanation) d+='<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">'+esc(q.explanation)+'</div>';
      d+='</div>';
    });
  });
  const p=Math.round(ok/totalQuestions*100), el=document.getElementById('scoreDisplay');
  el.innerHTML=ok+'/'+totalQuestions+' <span class="pct">('+p+'%)</span>';
  el.className='score '+(p>=90?'excellent':p>=60?'good':'needs-work');
  let m=''; if(p>=90) m='🎉 Отлично!'; else if(p>=70) m='👍 Хороший результат!'; else if(p>=50) m='📚 Стоит повторить.'; else m='💪 Попробуй ещё раз!';
  document.getElementById('scoreMessage').textContent=m;
  document.getElementById('resultsDetail').innerHTML='<h3>Подробно</h3>'+d;
}

function restartQuiz() {
  answered=0; if(window.speechSynthesis) window.speechSynthesis.cancel();
  Object.keys(answers).forEach(k=>Object.keys(answers[k]).forEach(qk=>answers[k][qk]=null));
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll(); updateProgress(); window.scrollTo(0,0);
  // Re-attach audio ended handler after re-render
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function setAudioSpeed(speed, btn) {
  const audio = document.getElementById('dialogAudio');
  if (audio) audio.playbackRate = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toggleSubs(el) { var body = el.parentElement.querySelector('.sub-body'); if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none'; }
init();
</script>
</body>
