ion": "Off-peak — вне часов пик, в менее загруженное время (например, после девяти тридцати утра). Такие билеты заметно дешевле. Peak — наоборот, самое загруженное и дорогое время."}, {"id": "v2", "type": "choice", "sentence": "A friend says: 'Don't drive into the city centre — use the park and ride.' What is a park and ride?", "options": ["A car park where you leave your car and continue by bus or train into the centre", "A free car park only for cyclists", "A taxi service that picks you up at home", "A funfair ride in the city park"], "correct": "A car park where you leave your car and continue by bus or train into the centre", "explanation": "Park and ride — парковка на окраине города: оставляете машину там и едете дальше на автобусе или поезде. Обычно дешевле, чем парковка в центре, и без пробок."}, {"id": "v3", "type": "choice", "sentence": "You booked a train ticket online. To collect it from the machine at the station, you need your booking reference. What is it?", "options": ["A short code (often letters and numbers) that identifies your booking", "The name of the passenger", "A map of the station", "The phone number of the ticket office"], "correct": "A short code (often letters and numbers) that identifies your booking", "explanation": "Booking reference — код бронирования, короткое сочетание букв и цифр из письма-подтверждения. По нему автомат или кассир находит ваш билет. Синоним: booking confirmation."}, {"id": "v4", "type": "choice", "sentence": "What is a bike lane?", "options": ["A special part of the road marked for cyclists", "A fast lane for motorbikes", "A footpath next to a railway", "A lane for cars with two or more passengers"], "correct": "A special part of the road marked for cyclists", "explanation": "Bike lane (или cycle lane) — велодорожка, выделенная полоса для велосипедистов. Lane вообще — полоса движения: bus lane — полоса для автобусов."}]}, {"id": "s3", "title": "Grammar — Future in the Past", "icon": "📖", "theory": "", "instruction": "", "questions": [{"id": "g1", "type": "choice", "sentence": "Complete: Anna missed the announcement, so Mark told her that the train ___ from platform six.", "options": ["would leave", "will leave", "leaves", "is leaving"], "correct": "would leave", "explanation": "Future in the Past — «будущее с точки зрения прошлого». Если говорящий в прошлом рассказывает о будущем событии, will превращается в would: Mark told her the train would leave. Прямая речь была бы: The train will leave from platform six."}, {"id": "g2", "type": "tf", "sentence": "In Future in the Past, after a past verb like 'said' or 'thought' you keep 'will' unchanged.", "options": ["True", "False"], "correct": "False", "explanation": "Неверно: после глагола в прошедшем времени will меняется на would. She said she would call me. Исключение по смыслу — если ситуация актуальна и сейчас: She said she will call tomorrow (и правда позвонит сегодня-завтра)."}, {"id": "g3", "type": "choice", "sentence": "Complete: I ___ book my ticket online, but the website crashed.", "options": ["was going to", "would to", "will", "am going to"], "correct": "was going to", "explanation": "Was/were going to — «собирался сделать» (намерение в прошлом, которое часто не сбылось). I was going to book = я собирался забронировать, но не вышло. Это второй способ выразить будущее в прошлом после would."}, {"id": "g4", "type": "choice", "sentence": "What does this sentence mean: 'The train was about to leave when Anna reached the platform.'", "options": ["The train had already left before she arrived", "The train was on the point of leaving — just seconds away", "The train left exactly when she arrived", "The train was leaving every five minutes"], "correct": "The train was on the point of leaving — just seconds away", "explanation": "Was/were about to do — «вот-вот должен был произойти»: до отправления оставались секунды. Третий способ Future in the Past: would do, was going to do, was about to do."}]}, {"id": "s4", "title": "Practical English — On the Train", "icon": "💬", "theory": "", "instruction": "", "questions": [{"id": "p1", "type": "choice", "sentence": "The carriage is busy. There is one free seat next to another passenger. What do you say before sitting down?", "options": ["Excuse me, is this seat taken?", "Move up, I want this seat.", "Do you know who sits here?", "Is anybody sitting on me?"], "correct": "Excuse me, is this seat taken?", "explanation": "Is this seat taken? — стандартная вежливая фраза: «Это место занято?» Если свободно, обычно отвечают: No, it's free — go ahead."}, {"id": "p2", "type": "choice", "sentence": "You arrive at a big station and need to find your train. What do you ask a member of staff?", "options": ["Which platform does the Bristol train leave from, please?", "Where is my train going to, please?", "Does the Bristol train exist today?", "How does the Bristol train look like?"], "correct": "Which platform does the Bristol train leave from, please?", "explanation": "Which platform does the ... train leave from? — «С какой платформы отходит поезд до...?» Полезно знать и обратное объявление: The train now standing at platform six is the ... service to Bristol."}]}, {"id": "s5", "title": "Challenge", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": "c1", "type": "choice", "sentence": "Which sentence is completely correct?", "options": ["Mark promised he would text Anna as soon as he reached the office.", "Mark promised he would text Anna as soon as he would reach the office.", "Mark promised he will text Anna as soon as he reaches the office.", "Mark promises he would text Anna as soon as he reached the office."], "correct": "Mark promised he would text Anna as soon as he reached the office.", "explanation": "Двойная ловушка. Во-первых, после promised будущее в прошлом: will → would. Во-вторых, в придаточном времени (as soon as, when, until) вместо будущего всегда обычное прошедшее: as soon as he reached, а не would reach."}, {"id": "c2", "type": "choice", "sentence": "Why is 'would' (not 'was going to') the right choice here: 'Anna said she ___ take the ten oh five, but Mark advised her not to.'", "options": ["Because 'was going to' is never used about plans", "Because 'would' here shows a decision seen from the past, without the sense of a firm prior intention", "Because 'would' is more polite than any other form", "Because 'was going to' can only describe the weather"], "correct": "Because 'would' here shows a decision seen from the past, without the sense of a firm prior intention", "explanation": "Тонкость B2. Would — просто будущее действие с точки зрения прошлого, нейтрально. Was going to — заранее созревшее намерение или план (я собиралась и, возможно, передумала). В нейтральном пересказе решения обычно выбирают would."}]}, {"id": "s6", "title": "Listening Comprehension", "icon": "🎧", "theory": "", "instruction": "Listen to the audio, then answer the questions below.", "questions": [{"id": "l1", "type": "listen", "sentence": "Listen to the dialogue and answer: why can't Anna take the cheaper off-peak ticket?", "options": ["Because the meeting is at eleven and the off-peak trains would arrive too late", "Because off-peak tickets are only for students", "Because there are no off-peak trains to Bristol at all", "Because the off-peak train is always cancelled on Sundays"], "correct": "Because the meeting is at eleven and the off-peak trains would arrive too late", "explanation": "Марк объясняет: вне часов пик — это поезда после девяти тридцати, а поезд в десять ноль пять прибывает почти к полудню. Встреча в одиннадцать к тому моменту уже закончилась бы, поэтому Анна вынуждена взять дорогой билет на время пик.", "audio_text": "Mark(M): Good morning, ticket office. How can I help you?\nAnna(F): Morning! I'd like a return ticket to Bristol for tomorrow, please.\nMark(M): Of course. What time were you thinking of leaving?\nAnna(F): Around eight thirty. I have a meeting at eleven.\nMark(M): Ah, that's a problem. Eight thirty is peak time — the busiest and the most expensive train of the day.\nAnna(F): How much of a difference are we talking about?\nMark(M): An off-peak return is almost half the price. But off-peak means trains after nine thirty.\nAnna(F): And when would the off-peak train get in?\nMark(M): The ten oh five arrives just before noon.\nAnna(F): Noon! My meeting would be over by then. Everyone would be leaving while I walked in.\nMark(M): So it's your money or your meeting, I'm afraid.\nAnna(F): The meeting, sadly. Peak return it is.\nMark(M): Will you print the tickets at home or collect them here?\nAnna(F): Here, please. Last time my printer ate the ticket. It only likes important documents.\nMark(M): A classic. Then you'll need your booking reference — it's the code with letters and numbers in your confirmation email. You type it into the machine and the tickets come out.\nAnna(F): Got it. One more thing — is the station car park free on Sundays?\nMark(M): It's four pounds a day, but there's a park and ride just outside town. Two pounds, and the bus drops you right at the station door.\nAnna(F): Perfect, I'll do that.\nMark(M): Here you are: one peak return, seat reserved in coach C, platform six over the footbridge. And watch out for the new bike lane on the concourse — cyclists treat it like a race track.\nAnna(F): I'll keep my eyes open. Thank you for your help!\nMark(M): Any time. And one last warning: the Sunday evening train back is packed like sardines. You have been warned.\nAnna(F): I'll bring a sense of adventure. Thanks again!"}, {"id": "l2", "type": "listen", "sentence": "Listen again: how will Anna get her tickets at the station?", "options": ["She will type her booking reference into the machine", "Mark will post them to her home address", "She will print them at home on her printer", "Her colleague will buy them at another office"], "correct": "She will type her booking reference into the machine", "explanation": "Анна решает забра     if (sec.instruction) h += '<div style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(sec.instruction) + '</div>';
    // Section-level audio: use pre-generated MP3 if available, else TTS fallback
    var secAudioTexts = [...new Set((sec.questions||[]).filter(q=>q.type==='listen'&&q.audio_text).map(q=>q.audio_text))];
    var secAudioUrl = quizData.audio_url || '';
    if (secAudioTexts.length > 0) {
      h += '<div class="section-audio">';
      if (secAudioUrl) {
        h += '<audio id="dialogAudio" controls preload="auto" style="width:100%;border-radius:10px;margin-bottom:6px;">';
        h += '<source src="' + secAudioUrl + '" type="audio/mpeg">';
        h += '</audio>';
        h += '<div style="margin-top:8px;display:flex;justify-content:center;gap:8px;align-items:center;">';
        h += '<span style="font-size:12px;color:var(--text-dim);">Скорость:</span>';
        h += '<button class="speed-btn" data-speed="0.5" onclick="setAudioSpeed(0.5,this)">🐢 0.5x</button>';
        h += '<button class="speed-btn" data-speed="0.75" onclick="setAudioSpeed(0.75,this)">0.75x</button>';
        h += '<button class="speed-btn active" data-speed="1" onclick="setAudioSpeed(1,this)">1x</button>';
        h += '</div>';
      } else {
        h += '<button class="speak-btn" data-audio-b64="' + btoa(unescape(encodeURIComponent(JSON.stringify(secAudioTexts)))) + '" onclick="speakSection(this)">🔊</button>';
      }
      h += '<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">Нажми Play, чтобы послушать диалог</div>';
      // Subtitles / transcript (like Chinese lessons)
      var subData = quizData.subtitles || [];
      if (subData.length > 0) {
        h += '<div class="subtitles">';
        h += '<span class="sub-toggle" onclick="toggleSubs(this)">📝 Текст диалога (нажми, чтобы показать/скрыть)</span>';
        h += '<div class="sub-body" style="display:none;">';
        subData.forEach(function(sl) {
          h += '<div class="sub-line">';
          h += '<div class="sub-speaker">' + esc(sl.speaker) + '</div>';
          h += '<div class="sub-hanzi">' + esc(sl.text) + '</div>';
          h += '</div>';
        });
        h += '</div>';
        h += '</div>';
      }
      h += '</div>';
    }
    (sec.questions||[]).forEach(q => {
      gq++; h += '<div class="question-block"><div class="question-number">Вопрос ' + gq + '</div>';
      if (q.sentence) h += '<div class="sentence">' + fmtSent(q.sentence, sec.id, q.id, q.type) + '</div>';
      h += renderOpts(sec.id, q);
      if (q.explanation) h += '<div class="explanation" id="exp_'+sec.id+'_'+q.id+'">' + esc(q.explanation) + '</div>';
      h += '</div>';
    });
    h += '</div>'; c.insertAdjacentHTML('beforeend', h);
  });
}

function speakSection(btn) {
  const texts = JSON.parse(decodeURIComponent(escape(atob(btn.dataset.audioB64))));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn || texts.length === 0) return; btn.classList.add('speaking');
  const v = window.speechSynthesis.getVoices();
  const voice = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  let idx = 0;
  function next() {
    if (idx >= texts.length) { btn.classList.remove('speaking'); return; }
    const u = new SpeechSynthesisUtterance(texts[idx]); u.lang='en-US'; u.rate=0.85;
    if (voice) u.voice = voice;
    u.onend = () => { idx++; setTimeout(next, 400); };
    u.onerror = () => { btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function speak(btn) {
  const text = btn.dataset.audioText;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn) return; btn.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
  const v = window.speechSynthesis.getVoices();
  const ev = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  if (ev) u.voice = ev;
  u.onend = () => btn.classList.remove('speaking');
  u.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) { window.speechSynthesis.getVoices(); if (window.speechSynthesis.onvoiceschanged!==undefined) { window.speechSynthesis.onvoiceschanged = function(){}; } }

function fmtTheory(t) { return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function fmtSent(s,sid,qid,type) { if(!s) return ''; if(type==='choice') return s.replace(/___+/g,'<span class="blank" id="blank_'+sid+'_'+qid+'">___</span>'); return esc(s); }

function renderOpts(sid, q) {
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type==='tf') return '<div class="options horizontal"><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="T" onclick="sel(this)">✓ True</button><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="F" onclick="sel(this)">✗ False</button></div>';
  if (q.type==='choice'||q.type==='listen') {
    let h='<div class="options">';
    var _opts = (q.options||[]).slice();
    for (var _i=_opts.length-1; _i>0; _i--) { var _j=Math.floor(Math.random()*(_i+1)); var _t=_opts[_i]; _opts[_i]=_opts[_j]; _opts[_j]=_t; }
    _opts.forEach((o,i) => { h+='<button class="option-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="'+esc(o)+'" onclick="sel(this)"><span class="letter">'+L[i]+'</span>'+esc(o)+'</button>'; });
    return h+'</div>';
  }
  return '';
}

function sel(btn) {
  const sid=btn.dataset.sec, qid=btn.dataset.q, val=btn.dataset.val;
  if(answers[sid][qid]!==null) return;
  answers[sid][qid]=val; answered++;
  const sec=sectionData.find(s=>s.id===sid), q=sec.questions.find(x=>x.id==qid);
  const corr=String(q.correct), ok=val===corr;
  btn.parentElement.querySelectorAll('.option-btn').forEach(s => {
    s.disabled=true; if(s.dataset.val===corr) s.classList.add('correct'); if(s===btn&&!ok) s.classList.add('wrong');
  });
  const bl=document.getElementById('blank_'+sid+'_'+qid);
  if(bl) { bl.textContent=corr; bl.classList.add(ok?'filled':'wrong-fill'); }
  const ex=document.getElementById('exp_'+sid+'_'+qid); if(ex) ex.classList.add('visible');
  updateProgress();
  if(answered>=totalQuestions) setTimeout(showRes, 800);
}

function updateProgress() { document.getElementById('progressFill').style.width = (totalQuestions>0?(answered/totalQuestions*100):0)+'%'; }

function showRes() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  let ok=0, d='';
  sectionData.forEach(sec => {
    sec.questions.forEach(q => {
      const ua=answers[sec.id][q.id], cs=String(q.correct), isOK=ua===cs; if(isOK) ok++;
      d+='<div class="result-item"><div class="ri-q">'+esc(sec.title)+' — '+q.id+'</div>';
      if(q.sentence) d+='<div>'+esc(q.sentence.replace(/___+/g,cs))+'</div>';
      else if(q.options) d+='<div>'+esc(q.options.join(' / '))+'</div>';
      if(!isOK&&ua!==null) d+='<div><span class="ri-wrong">'+esc(ua)+'</span> <span class="ri-correct">'+esc(cs)+'</span></div>';
      if(isOK) d+='<div><span class="ri-correct">✓ '+esc(cs)+'</span></div>';
      if(q.explanation) d+='<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">'+esc(q.explanation)+'</div>';
      d+='</div>';
    });
  });
  const p=Math.round(ok/totalQuestions*100), el=document.getElementById('scoreDisplay');
  el.innerHTML=ok+'/'+totalQuestions+' <span class="pct">('+p+'%)</span>';
  el.className='score '+(p>=90?'excellent':p>=60?'good':'needs-work');
  let m=''; if(p>=90) m='🎉 Отлично!'; else if(p>=70) m='👍 Хороший результат!'; else if(p>=50) m='📚 Стоит повторить.'; else m='💪 Попробуй ещё раз!';
  document.getElementById('scoreMessage').textContent=m;
  document.getElementById('resultsDetail').innerHTML='<h3>Подробно</h3>'+d;
}

function restartQuiz() {
  answered=0; if(window.speechSynthesis) window.speechSynthesis.cancel();
  Object.keys(answers).forEach(k=>Object.keys(answers[k]).forEach(qk=>answers[k][qk]=null));
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll(); updateProgress(); window.scrollTo(0,0);
  // Re-attach audio ended handler after re-render
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function setAudioSpeed(speed, btn) {
  const audio = document.getElementById('dialogAudio');
  if (audio) audio.playbackRate = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toggleSubs(el) { var body = el.parentElement.querySelector('.sub-body'); if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none'; }
init();
</script>
