<script>
const quizData = {"title": "Nature & Environment: Climate and Waste + Reporting Verbs", "subtitle": "2026-09-13", "date": "2026-09-13", "phrase_of_the_day": "Every little helps", "phrase_translation": "Даже маленький вклад имеет значение — небольшие действия, повторяемые многими людьми, вместе дают большой результат.", "audio_url": "https://nataliastanislavovna.github.io/english-quiz/audio.mp3", "sections": [{"id": "s1", "title": "Vocabulary — Nature & Environment", "icon": "📚", "theory": "", "instruction": "", "questions": [{"id": "v1", "type": "choice", "sentence": "Scientists say that cars and factories must reduce their emissions. What are emissions?", "options": ["Gases released into the air by cars, factories and power stations", "Rubbish thrown away in forests, parks and by the sides of roads", "Energy saved by switching off lights and electrical devices", "Trees planted to replace the forests that were cut down before"], "correct": "Gases released into the air by cars, factories and power stations", "explanation": "Emissions = выбросы, вредные газы, которые попадают в воздух. Чаще всего говорят carbon emissions — выбросы углекислого газа. Глагол: to emit. Фраза to cut emissions = сократить выбросы — она постоянно звучит в новостях про климат."}, {"id": "v2", "type": "choice", "sentence": "A region has had almost no rain for six months. The rivers are drying up and the soil is like dust. What is this called?", "options": ["A drought — a long period with little or no rain", "A flood — too much water covering streets and fields", "A heatwave — several days of extremely hot weather", "A thunderstorm — heavy rain with strong wind and thunder"], "correct": "A drought — a long period with little or no rain", "explanation": "Drought [draut] = засуха: долгий период без дождя, когда земле не хватает воды. Не путать с flood = наводнение (воды слишком много) и heatwave = жара (жарко, но речь о температуре, а не о дожде). Drought губит урожаи и пересушивает почву."}, {"id": "v3", "type": "choice", "sentence": "In Riga, people put paper, glass and plastic into separate coloured containers. What is this practice called?", "options": ["Waste sorting — separating rubbish so it can be recycled", "Composting — turning food waste into soil for gardens", "Littering — dropping rubbish on the ground in parks", "Deforestation — cutting down forests to build new roads"], "correct": "Waste sorting — separating rubbish so it can be recycled", "explanation": "Waste sorting (или rubbish separation) = сортировка мусора: раздельный сбор бумаги, стекла, пластика. To sort = сортировать. Waste = мусор (официальное слово; бытовой синоним — rubbish). Отсортированный мусор потом идёт на переработку — recycling."}, {"id": "v4", "type": "choice", "sentence": "Every year huge areas of forest are cut down in the Amazon to make room for farms. What is this process called?", "options": ["Deforestation — destroying forests by cutting down trees", "Irrigation — bringing water to dry fields through channels", "Conservation — protecting nature and saving rare species", "Erosion — washing away of soil by wind and heavy rain"], "correct": "Deforestation — destroying forests by cutting down trees", "explanation": "Deforestation = вырубка лесов: forests (леса) + де- (убирание) → исчезновение лесов. Леса поглощают углекислый газ, поэтому вырубка ускоряет изменение климата. Ложное слово-приманка: afforestation — противоположный процесс, посадка новых лесов."}]}, {"id": "s2", "title": "Grammar — Reporting Verbs", "icon": "📖", "theory": "", "instruction": "", "questions": [{"id": "g1", "type": "choice", "sentence": "Mark came late to the meeting and said he was sorry. Choose the correct sentence:", "options": ["He apologised for being late.", "He apologised to be late.", "He apologised for that he was late.", "He apologised of being late."], "correct": "He apologised for being late.", "explanation": "Многие глаголы сообщения требуют после себя предлог + герундий (глагол с -ing). Apologise FOR doing something = извиниться за что-то. Никакого to do и никакой связки for that. Так работают: apologise for, insist on, accuse somebody of, blame somebody for, congratulate somebody on."}, {"id": "g2", "type": "choice", "sentence": "The city council discussed recycling at yesterday's meeting. Choose the correct sentence:", "options": ["They suggested starting a new scheme.", "They suggested to start a new scheme.", "They suggested start a new scheme.", "They suggested for starting a new scheme."], "correct": "They suggested starting a new scheme.", "explanation": "Suggest — самый знаменитый «обманщик»: после него сразу герундий (V-ing) без предлога. Suggest doing = предложить что-то сделать. Ошибки suggested to start не существует в стандартном английском. Внимание: suggest нельзя и с объектом — не suggest somebody doing, а suggest that somebody should do."}, {"id": "g3", "type": "choice", "sentence": "Kate did not break the window, and she said this clearly to the teacher. How do we report her words?", "options": ["She denied breaking the window.", "She denied to break the window.", "She refused breaking the window.", "She denied for breaking the window."], "correct": "She denied breaking the window.", "explanation": "Deny + герундий = отрицать, что сделал (denied breaking = «я не ломал»). Сравните пару deny / refuse: deny doing (отрицать поступок) и refuse to do (отказаться делать). Второй как раз требует to do — поэтому refused breaking здесь неправильно."}, {"id": "g4", "type": "choice", "sentence": "David wanted to pay for the whole dinner and did not listen to objections. Choose the correct sentence:", "options": ["He insisted on paying the bill.", "He insisted to pay the bill.", "He insisted on to pay the bill.", "He insisted for paying the bill."], "correct": "He insisted on paying the bill.", "explanation": "Insist ON + герундий = настаивать на чём-то: insisted on paying. Предлог on здесь нельзя терять и нельзя заменять на to. Полезные примеры: She insisted on opening the window (настаивала, чтобы открыли), He insisted on driving me home (упрямо вызвался отвезти)."}]}, {"id": "s3", "title": "Practical English", "icon": "💬", "theory": "", "instruction": "", "questions": [{"id": "p1", "type": "choice", "sentence": "A colleague says you lost the report, but you did not even touch it. Which reply is correct English?", "options": ["Don't accuse me of losing it — I never touched that file.", "Don't accuse me to lose it — I never touched that file.", "Don't accuse me for losing it — I never touched that file.", "Don't accuse me that I lost it — I never touched that file."], "correct": "Don't accuse me of losing it — I never touched that file.", "explanation": "To accuse somebody OF doing something = обвинить кого-то в чём-то. Предлог только of. Родственник: to blame somebody FOR doing = винить кого-то за (здесь предлог for!). Пара accuse of / blame for — классическая ловушка на экзаменах уровня B2, запомните оба предлога вместе."}, {"id": "p2", "type": "choice", "sentence": "Emma says, 'I'll just bring one reusable cup.' David answers, 'Every little helps.' What does he mean?", "options": ["Even small actions matter when many people repeat them", "Helping your neighbours is the best way to make new friends", "Small purchases are always cheaper than the bigger ones", "You should ask for a little help before starting something"], "correct": "Even small actions matter when many people repeat them", "explanation": "Every little helps = «даже мелочь помогает», каждая маленькая помощь важна. Фраза часто встречается в разговорах про экологию: одна чашка ничего не изменит, но миллион чашек — уже нет мусора. Сегодняшняя фраза дня: говорите её, когда кто-то сомневается, стоит ли делать «слишком мало»."}]}, {"id": "s4", "title": "Challenge", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": "c1", "type": "choice", "sentence": "Anna has just won the school science prize. Which sentence is grammatically correct?", "options": ["The teacher congratulated Anna on winning the prize.", "The teacher congratulated Anna for winning the prize.", "The teacher congratulated Anna to win the prize.", "The teacher congratulated Anna at winning the prize."], "correct": "The teacher congratulated Anna on winning the prize.", "explanation": "Congratulate somebody ON doing something = поздравить кого-то с чем-то. Предлог только on — это ловушка даже для продвинутых, потому что по-русски «поздравлять С» (и хочется of или with). Соберите семейство предлогов: congratulate on, accuse of, blame for, apologise for, insist on."}, {"id": "c2", "type": "choice", "sentence": "The mayor's original words were, 'Let's start a car-sharing scheme.' Which reported sentence is correct?", "options": ["The mayor suggested starting a car-sharing scheme.", "The mayor suggested to start a car-sharing scheme.", "The mayor insisted starting a car-sharing scheme.", "The mayor offered starting a car-sharing scheme."], "correct": "The mayor suggested starting a car-sharing scheme.", "explanation": "Let's do something в косвенной речи = suggest + герундий: The mayor suggested starting. Второй и третий варианты ломают правила (suggest + to, insist без on), а четвёртый подменяет смысл: offer требует to do (offered to start = предложил и вызвался сам), да и значение другое. Car-sharing = каршеринг, совместное использование машин — кстати, тоже про экологию."}]}, {"id": "s5", "title": "Listening Comprehension", "icon": "🎧", "theory": "", "instruction": "Listen to the audio, then answer the questions below.", "questions": [{"id": "l1", "type": "listen", "sentence": "Listen to the dialogue and answer: What is the main purpose of the meeting?", "options": ["To introduce waste sorting and a compost scheme", "To ask residents to pay for new street containers", "To plan a big spring cleaning of the library lot", "To choose families who will grow vegetables there"], "correct": "To introduce waste sorting and a compost scheme", "explanation": "Эмма — координатор «зелёного» собрания соседей. Главная тема — новый пункт сортировки мусора на Мэйпл-стрит (waste-sorting point): бумага в синий контейнер, стекло в зелёный, пластик в жёлтый. Вторая тема — компост для общего огорода за библиотекой (compost scheme for the community garden).", "audio_text": "Emma(F): Good evening, everyone, and welcome to our green neighbourhood meeting. I'm Emma, your new coordinator.\nDavid(M): Green meeting? I mostly came for the free coffee. Does that count as recycling?\nEmma(F): Reusing your cup is a great start, David. Tonight's topic is the new waste-sorting point on Maple Street.\nDavid(M): We already have bins. I throw everything into one big bag and feel fantastic.\nEmma(F): That's exactly the problem. If we sort paper, glass and plastic, the city recycles them instead of burning them.\nDavid(M): And who pays for all those fancy containers? Not me, I hope.\nEmma(F): The city council covers the cost. We only need volunteers to explain the rules to the neighbours.\nDavid(M): Rules? Like which bin is sad and which one is happy?\nEmma(F): Very funny. Paper goes in the blue bin, glass in the green one, plastic in the yellow one.\nDavid(M): I admit the system sounds simpler than I expected. And what about food waste?\nEmma(F): Great question. We're starting a compost scheme for the community garden behind the library.\nDavid(M): A garden? Last year that lot was full of old rubbish.\nEmma(F): Exactly. We cleaned it up, and now fifteen families grow vegetables there.\nDavid(M): Fine. I apologise for laughing earlier. Maybe I'll bring my old tomatoes.\nEmma(F): You mean tomato plants? Please do. Every little helps.\nDavid(M): Just promise me one thing — no future meetings about recycling coffee cups.\nEmma(F): I promise nothing. See you on Saturday at ten, and bring gloves!"}, {"id": "l2", "type": "listen", "sentence": "Listen to the dialogue and answer: How does David's attitude change during the conversation?", "options": ["He starts with jokes but ends by offering to help", "He supports the plan from the start and joins at once", "He strongly opposes the project and leaves feeling angry", "He asks about prices and refuses to pay anything"], "correct": "He starts with jokes but ends by offering to help", "explanation": "Дэвид начинает с шуток про бесплатный кофе и «грустный контейнер», сомневается («who pays?»), но узнав подробности, признаёт — I admit the system sounds simpler than I expected — и извиняется за смех: I apologise for laughing earlier. В конце он готов принести свои помидоры и прийти в субботу. Обратите внимание на глаголы сообщения из урока: admit, apologise for — живьём в речи."}]}], "subtitles": [{"speaker": "Emma", "text": "Good evening, everyone, and welcome to our green neighbourhood meeting. I'm Emma, your new coordinator."}, {"speaker": "David", "text": "Green meeting? I mostly came for the free coffee. Does that count as recycling?"}, {"speaker": "Emma", "text": "Reusing your cup is a great start, David. Tonight's topic is the new waste-sorting point on Maple Street."}, {"speaker": "David", "text": "We already have bins. I throw everything into one big bag and feel fantastic."}, {"speaker": "Emma", "text": "That's exactly the problem. If we sort paper, glass and plastic, the city recycles them instead of burning them."}, {"speaker": "David", "text": "And who pays for all those fancy containers? Not me, I hope."}, {"speaker": "Emma", "text": "The city council covers the cost. We only need volunteers to explain the rules to the neighbours."}, {"speaker": "David", "text": "Rules? Like which bin is sad and which one is happy?"}, {"speaker": "Emma", "text": "Very funny. Paper goes in the blue bin, glass in the green one, plastic in the yellow one."}, {"speaker": "David", "text": "I admit the system sounds simpler than I expected. And what about food waste?"}, {"speaker": "Emma", "text": "Great question. We're starting a compost scheme for the community garden behind the library."}, {"speaker": "David", "text": "A garden? Last year that lot was full of old rubbish."}, {"speaker": "Emma", "text": "Exactly. We cleaned it up, and now fifteen families grow vegetables there."}, {"speaker": "David", "text": "Fine. I apologise for laughing earlier. Maybe I'll bring my old tomatoes."}, {"speaker": "Emma", "text": "You mean tomato plants? Please do. Every little helps."}, {"speaker": "David", "text": "Just promise me one thing — no future meetings about recycling coffee cups."}, {"speaker": "Emma", "text": "I promise nothing. See you on Saturday at ten, and bring gloves!"}]};

    if (sec.instruction) h += '<div style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(sec.instruction) + '</div>';
    // Section-level audio: use pre-generated MP3 if available, else TTS fallback
    var secAudioTexts = [...new Set((sec.questions||[]).filter(q=>q.type==='listen'&&q.audio_text).map(q=>q.audio_text))];
    var secAudioUrl = quizData.audio_url || '';
    if (secAudioTexts.length > 0) {
      h += '<div class="section-audio">';
      if (secAudioUrl) {
        h += '<audio id="dialogAudio" controls preload="auto" style="width:100%;border-radius:10px;margin-bottom:6px;">';
        h += '<source src="' + secAudioUrl + '" type="audio/mpeg">';
        h += '</audio>';
        h += '<div style="margin-top:8px;display:flex;justify-content:center;gap:8px;align-items:center;">';
        h += '<span style="font-size:12px;color:var(--text-dim);">Скорость:</span>';
        h += '<button class="speed-btn" data-speed="0.5" onclick="setAudioSpeed(0.5,this)">🐢 0.5x</button>';
        h += '<button class="speed-btn" data-speed="0.75" onclick="setAudioSpeed(0.75,this)">0.75x</button>';
        h += '<button class="speed-btn active" data-speed="1" onclick="setAudioSpeed(1,this)">1x</button>';
        h += '</div>';
      } else {
        h += '<button class="speak-btn" data-audio-b64="' + btoa(unescape(encodeURIComponent(JSON.stringify(secAudioTexts)))) + '" onclick="speakSection(this)">🔊</button>';
      }
      h += '<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">Нажми Play, чтобы послушать диалог</div>';
      // Subtitles / transcript (like Chinese lessons)
      var subData = quizData.subtitles || [];
      if (subData.length > 0) {
        h += '<div class="subtitles">';
        h += '<span class="sub-toggle" onclick="toggleSubs(this)">📝 Текст диалога (нажми, чтобы показать/скрыть)</span>';
        h += '<div class="sub-body" style="display:none;">';
        subData.forEach(function(sl) {
          h += '<div class="sub-line">';
          h += '<div class="sub-speaker">' + esc(sl.speaker) + '</div>';
          h += '<div class="sub-hanzi">' + esc(sl.text) + '</div>';
          h += '</div>';
        });
        h += '</div>';
        h += '</div>';
      }
      h += '</div>';
    }
    (sec.questions||[]).forEach(q => {
      gq++; h += '<div class="question-block"><div class="question-number">Вопрос ' + gq + '</div>';
      if (q.sentence) h += '<div class="sentence">' + fmtSent(q.sentence, sec.id, q.id, q.type) + '</div>';
      h += renderOpts(sec.id, q);
      if (q.explanation) h += '<div class="explanation" id="exp_'+sec.id+'_'+q.id+'">' + esc(q.explanation) + '</div>';
      h += '</div>';
    });
    h += '</div>'; c.insertAdjacentHTML('beforeend', h);
  });
}

function speakSection(btn) {
  const texts = JSON.parse(decodeURIComponent(escape(atob(btn.dataset.audioB64))));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn || texts.length === 0) return; btn.classList.add('speaking');
  const v = window.speechSynthesis.getVoices();
  const voice = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  let idx = 0;
  function next() {
    if (idx >= texts.length) { btn.classList.remove('speaking'); return; }
    const u = new SpeechSynthesisUtterance(texts[idx]); u.lang='en-US'; u.rate=0.85;
    if (voice) u.voice = voice;
    u.onend = () => { idx++; setTimeout(next, 400); };
    u.onerror = () => { btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function speak(btn) {
  const text = btn.dataset.audioText;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn) return; btn.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
  const v = window.speechSynthesis.getVoices();
  const ev = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  if (ev) u.voice = ev;
  u.onend = () => btn.classList.remove('speaking');
  u.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) { window.speechSynthesis.getVoices(); if (window.speechSynthesis.onvoiceschanged!==undefined) { window.speechSynthesis.onvoiceschanged = function(){}; } }

function fmtTheory(t) { return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function fmtSent(s,sid,qid,type) { if(!s) return ''; if(type==='choice') return s.replace(/___+/g,'<span class="blank" id="blank_'+sid+'_'+qid+'">___</span>'); return esc(s); }

function renderOpts(sid, q) {
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type==='tf') return '<div class="options horizontal"><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="T" onclick="sel(this)">✓ True</button><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="F" onclick="sel(this)">✗ False</button></div>';
  if (q.type==='choice'||q.type==='listen') {
    let h='<div class="options">';
    var _opts = (q.options||[]).slice();
    for (var _i=_opts.length-1; _i>0; _i--) { var _j=Math.floor(Math.random()*(_i+1)); var _t=_opts[_i]; _opts[_i]=_opts[_j]; _opts[_j]=_t; }
    _opts.forEach((o,i) => { h+='<button class="option-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="'+esc(o)+'" onclick="sel(this)"><span class="letter">'+L[i]+'</span>'+esc(o)+'</button>'; });
    return h+'</div>';
  }
  return '';
}

function sel(btn) {
  const sid=btn.dataset.sec, qid=btn.dataset.q, val=btn.dataset.val;
  if(answers[sid][qid]!==null) return;
  answers[sid][qid]=val; answered++;
  const sec=sectionData.find(s=>s.id===sid), q=sec.questions.find(x=>x.id==qid);
  const corr=String(q.correct), ok=val===corr;
  btn.parentElement.querySelectorAll('.option-btn').forEach(s => {
    s.disabled=true; if(s.dataset.val===corr) s.classList.add('correct'); if(s===btn&&!ok) s.classList.add('wrong');
  });
  const bl=document.getElementById('blank_'+sid+'_'+qid);
  if(bl) { bl.textContent=corr; bl.classList.add(ok?'filled':'wrong-fill'); }
  const ex=document.getElementById('exp_'+sid+'_'+qid); if(ex) ex.classList.add('visible');
  updateProgress();
  if(answered>=totalQuestions) setTimeout(showRes, 800);
}

function updateProgress() { document.getElementById('progressFill').style.width = (totalQuestions>0?(answered/totalQuestions*100):0)+'%'; }

function showRes() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  let ok=0, d='';
  sectionData.forEach(sec => {
    sec.questions.forEach(q => {
      const ua=answers[sec.id][q.id], cs=String(q.correct), isOK=ua===cs; if(isOK) ok++;
      d+='<div class="result-item"><div class="ri-q">'+esc(sec.title)+' — '+q.id+'</div>';
      if(q.sentence) d+='<div>'+esc(q.sentence.replace(/___+/g,cs))+'</div>';
      else if(q.options) d+='<div>'+esc(q.options.join(' / '))+'</div>';
      if(!isOK&&ua!==null) d+='<div><span class="ri-wrong">'+esc(ua)+'</span> <span class="ri-correct">'+esc(cs)+'</span></div>';
      if(isOK) d+='<div><span class="ri-correct">✓ '+esc(cs)+'</span></div>';
      if(q.explanation) d+='<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">'+esc(q.explanation)+'</div>';
      d+='</div>';
    });
  });
  const p=Math.round(ok/totalQuestions*100), el=document.getElementById('scoreDisplay');
  el.innerHTML=ok+'/'+totalQuestions+' <span class="pct">('+p+'%)</span>';
  el.className='score '+(p>=90?'excellent':p>=60?'good':'needs-work');
  let m=''; if(p>=90) m='🎉 Отлично!'; else if(p>=70) m='👍 Хороший результат!'; else if(p>=50) m='📚 Стоит повторить.'; else m='💪 Попробуй ещё раз!';
  document.getElementById('scoreMessage').textContent=m;
  document.getElementById('resultsDetail').innerHTML='<h3>Подробно</h3>'+d;
}

function restartQuiz() {
  answered=0; if(window.speechSynthesis) window.speechSynthesis.cancel();
  Object.keys(answers).forEach(k=>Object.keys(answers[k]).forEach(qk=>answers[k][qk]=null));
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll(); updateProgress(); window.scrollTo(0,0);
  // Re-attach audio ended handler after re-render
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function setAudioSpeed(speed, btn) {
  const audio = document.getElementById('dialogAudio');
  if (audio) audio.playbackRate = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toggleSubs(el) { var body = el.parentElement.querySelector('.sub-body'); if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none'; }
init();
</script>
