<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Health: At the Doctor&#x27;s Office</title>
<style>
:root {
  --bg: #1a1a2e; --card: #16213e; --accent: #e94560; --accent-light: #ff6b81;
  --correct: #2ed573; --wrong: #ff4757; --text: #eaeaea; --text-dim: #8892a4;
  --border: #2a3a5e; --btn-radius: 12px;
  --theory-bg: rgba(255,255,255,0.03); --theory-border: #3a4a6e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; -webkit-tap-highlight-color: transparent; }
.container { max-width: 600px; margin: 0 auto; }
.header { text-align: center; padding: 20px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.header h1 { font-size: 22px; font-weight: 700; color: var(--accent-light); }
.header .subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
.phrase-box { background: linear-gradient(135deg, rgba(233,69,96,0.12), rgba(255,107,129,0.08)); border: 1px solid rgba(233,69,96,0.3); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; text-align: center; }
.phrase-box .label { font-size: 11px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.phrase-box .phrase { font-size: 16px; font-weight: 600; font-style: italic; color: var(--text); }
.phrase-box .translation { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
.progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); border-radius: 3px; transition: width 0.4s ease; width: 0%; }
.section-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.section-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--accent); display: flex; align-items: center; gap: 8px; }
.section-audio { text-align: center; margin-bottom: 14px; padding: 12px; background: rgba(233,69,96,0.08); border-radius: 10px; border: 1px solid rgba(233,69,96,0.2); }
.section-title .icon { font-size: 20px; }
.theory { background: var(--theory-bg); border-left: 3px solid var(--theory-border); border-radius: 0 8px 8px 0; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; line-height: 1.7; color: var(--text-dim); }
.theory strong { color: var(--text); font-weight: 600; }
.question-block { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
.question-number { font-size: 12px; font-weight: 600; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.sentence { font-size: 15px; line-height: 1.7; margin-bottom: 14px; padding: 12px; background: rgba(255,255,255,0.04); border-radius: 8px; }
.speak-btn { background: rgba(233,69,96,0.15); border: 2px solid var(--accent); border-radius: 50%; width: 52px; height: 52px; font-size: 24px; color: var(--accent-light); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; transition: all 0.2s ease; line-height: 1; }
.speak-btn:active { transform: scale(0.92); }
.speak-btn.speaking { animation: pulse 0.8s ease-in-out infinite; background: rgba(233,69,96,0.3); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(233,69,96,0.4); } 50% { box-shadow: 0 0 0 10px rgba(233,69,96,0); } }
.options { display: flex; flex-direction: column; gap: 8px; }
.options.horizontal { flex-direction: row; justify-content: center; gap: 12px; }
.option-btn { background: rgba(255,255,255,0.06); border: 2px solid var(--border); border-radius: var(--btn-radius); padding: 14px 20px; font-size: 15px; color: var(--text); cursor: pointer; transition: all 0.2s ease; text-align: center; min-height: 48px; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
.option-btn:active { transform: scale(0.97); }
.option-btn.correct { background: rgba(46,213,115,0.15); border-color: var(--correct); color: var(--correct); font-weight: 600; }
.option-btn.wrong { background: rgba(255,71,87,0.15); border-color: var(--wrong); color: var(--wrong); font-weight: 600; }
.option-btn:disabled { cursor: default; opacity: 0.7; }
.option-btn:disabled:active { transform: none; }
.option-btn .letter { font-weight: 700; margin-right: 8px; color: var(--text-dim); }
.option-btn.correct .letter { color: var(--correct); }
.option-btn.wrong .letter { color: var(--wrong); }
.tf-btn { flex: 1; max-width: 140px; padding: 18px 24px; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.explanation { margin-top: 10px; padding: 10px 12px; background: rgba(46,213,115,0.08); border-left: 3px solid var(--correct); border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.6; color: var(--text-dim); display: none; }
.explanation.visible { display: block; }
.results { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; text-align: center; animation: fadeIn 0.5s ease; }
.results .score { font-size: 48px; font-weight: 800; margin: 16px 0; }
.results .score .pct { font-size: 24px; color: var(--text-dim); }
.results .score.excellent { color: var(--correct); }
.results .score.good { color: var(--accent-light); }
.results .score.needs-work { color: var(--wrong); }
.results .message { font-size: 16px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }
.results-detail { text-align: left; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.results-detail h3 { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.result-item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; line-height: 1.5; }
.result-item .ri-q { color: var(--text-dim); margin-bottom: 4px; }
.result-item .ri-correct { color: var(--correct); font-weight: 600; }
.result-item .ri-wrong { color: var(--wrong); font-weight: 600; text-decoration: line-through; margin-right: 8px; }
.restart-btn { background: linear-gradient(135deg, var(--accent), var(--accent-light)); border: none; border-radius: var(--btn-radius); padding: 16px 40px; font-size: 16px; font-weight: 700; color: white; cursor: pointer; margin-top: 20px; transition: all 0.2s ease; }
.restart-btn:active { transform: scale(0.97); }
.hidden { display: none; }
.speed-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 13px; color: var(--text-dim); cursor: pointer; transition: all 0.2s ease; }
.speed-btn:active { transform: scale(0.95); }
.speed-btn.active { background: rgba(233,69,96,0.2); border-color: var(--accent); color: var(--accent-light); font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>Health: At the Doctor&#x27;s Office</h1><div class="subtitle">2026-08-07</div></div>
  <div class="phrase-box"><div class="label">💡 Фраза дня</div><div class="phrase">I&#x27;m not feeling well</div><div class="translation">Мне нездоровится / Я плохо себя чувствую</div></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quizContent"></div>
  <div class="results hidden" id="results">
    <div style="font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;">Результат</div>
    <div class="score" id="scoreDisplay"></div>
    <div class="message" id="scoreMessage"></div>
    <div class="results-detail" id="resultsDetail"></div>
    <button class="restart-btn" onclick="restartQuiz()">Пройти ещё раз</button>
  </div>
</div>
<script>
const quizData = {"title": "Health: At the Doctor's Office", "subtitle": "2026-08-07", "date": "2026-08-07", "phrase_of_the_day": "I'm not feeling well", "phrase_translation": "Мне нездоровится / Я плохо себя чувствую", "audio_url": "https://nataliastanislavovna.github.io/english-quiz/audio.mp3", "sections": [{"id": "s1", "title": "Vocabulary", "icon": "📚", "theory": "", "instruction": "", "questions": [{"id": "v1", "type": "choice", "sentence": "Choose the correct word: I have a high ___, my temperature is 39 degrees.", "options": ["fever", "cough", "allergy"], "correct": "fever", "explanation": "A 'fever' (лихорадка, жар) means your body temperature is higher than normal (above 37.5C). A 'cough' is when you expel air from your lungs with a sound. An 'allergy' is a reaction to things like pollen or food. When you say 'I have a fever', it means your temperature is high."}, {"id": "v2", "type": "choice", "sentence": "What do you call the document that lists your symptoms and the medicine the doctor recommends?", "options": ["Prescription", "Receipt", "Bill"], "correct": "Prescription", "explanation": "A 'prescription' (рецепт) is the official document a doctor gives you so you can buy medicine at a pharmacy. A 'receipt' is proof of payment. A 'bill' is an invoice for money you owe. You take a prescription to the pharmacy to get your medicine."}, {"id": "v3", "type": "choice", "sentence": "Complete the sentence: My throat ___. It hurts when I swallow.", "options": ["hurts", "breaks", "costs"], "correct": "hurts", "explanation": "'Hurts' means causes pain (болит). 'My throat hurts' is the most natural way to say your throat is painful. 'Breaks' means to damage a bone. 'Costs' refers to the price of something. Other body pain phrases: 'My head hurts', 'My back hurts', 'My stomach hurts'."}, {"id": "v4", "type": "choice", "sentence": "What word means the place where you buy medicine with or without a prescription?", "options": ["Pharmacy (chemist's)", "Hospital", "Clinic"], "correct": "Pharmacy (chemist's)", "explanation": "A 'pharmacy' or 'chemist's' (аптека) is where you buy medicine. A 'hospital' is for serious conditions and emergencies. A 'clinic' is where you see a doctor for consultation. In British English, people often say 'chemist's'; in American English, 'pharmacy' or 'drugstore'."}]}, {"id": "s2", "title": "Grammar", "icon": "📖", "theory": "", "instruction": "", "questions": [{"id": "g1", "type": "choice", "sentence": "Choose the correct form: How long ___ you ___ like this?", "options": ["have / been feeling", "did / felt", "are / feeling"], "correct": "have / been feeling", "explanation": "We use the present perfect continuous ('have been feeling') to describe a symptom that started in the past and is still happening now. 'How long have you been feeling like this?' asks about the duration of an ongoing condition. 'Did you felt' is grammatically wrong. 'Are you feeling' asks about now, not the duration."}, {"id": "g2", "type": "choice", "sentence": "Choose the correct form: The doctor told me ___ more water and ___ some rest.", "options": ["to drink / get", "drinking / getting", "drink / get"], "correct": "to drink / get", "explanation": "After the verb 'tell' in reported speech, we use the infinitive with 'to': 'told me to drink', 'told me to get'. This structure is: tell + person + to + verb. Other examples: 'The doctor told me to rest', 'She told me to take the medicine twice a day'."}]}, {"id": "s3", "title": "True/False", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": "t1", "type": "tf", "sentence": "We use 'I have a headache' (not 'I have headache') because we need the article 'a' before illness phrases with 'ache'.", "options": [], "correct": "T", "explanation": "True. In English, we say 'a headache', 'a stomachache', 'a toothache', 'a backache'. The article 'a' is needed because these are countable noun phrases. However, we say 'I have a fever' but 'I feel dizzy' (no article with adjectives). Remember: a + ache, but no article for 'I feel + adjective'."}, {"id": "t2", "type": "tf", "sentence": "'Should' and 'must' have the same meaning when giving medical advice, so 'You should take this medicine' and 'You must take this medicine' are identical.", "options": [], "correct": "F", "explanation": "False. 'Should' is a recommendation or suggestion (soft advice). 'Must' is a strong obligation or necessity. A doctor might say 'You should drink more water' (general advice), but 'You must take these antibiotics' (strong, important instruction). 'Must' is stronger and more urgent than 'should'."}]}, {"id": "s4", "title": "Practical English", "icon": "💬", "theory": "", "instruction": "", "questions": [{"id": "p1", "type": "choice", "sentence": "You call a clinic to make an appointment. What is the most natural way to ask?", "options": ["I'd like to make an appointment with a doctor, please.", "I want doctor now.", "Give me appointment."], "correct": "I'd like to make an appointment with a doctor, please.", "explanation": "'I'd like to make an appointment' is the standard, polite phrase for booking a doctor visit. 'I want doctor now' is rude and grammatically wrong. 'Give me appointment' sounds demanding and unnatural. The receptionist will then ask: 'What day works for you?' or 'What seems to be the problem?'"}, {"id": "p2", "type": "choice", "sentence": "The doctor asks: 'What seems to be the problem?' What is the best answer?", "options": ["I've had a bad cough and a runny nose for three days.", "I don't know, you tell me.", "Problem is yes."], "correct": "I've had a bad cough and a runny nose for three days.", "explanation": "When the doctor asks 'What seems to be the problem?', describe your symptoms clearly and mention how long you have had them: 'I've had a bad cough and a runny nose for three days.' This gives the doctor useful information. 'I don't know, you tell me' is impolite. 'Problem is yes' is not natural English."}]}, {"id": "s5", "title": "Listening Comprehension", "icon": "🎧", "theory": "", "instruction": "Listen to the audio, then answer the questions below.", "questions": [{"id": "l1", "type": "listen", "sentence": "What is wrong with Laura?", "options": ["She has a sore throat and a fever", "She has a broken leg", "She has a stomachache"], "correct": "She has a sore throat and a fever", "explanation": "Laura tells the doctor 'I have a really sore throat and a fever since yesterday.' She also mentions her temperature is 38.5. She does not have a broken leg or a stomachache. Dr. Chen examines her throat and prescribes medicine.", "audio_text": "Dr. Chen: Good morning, Laura. What seems to be the problem today? Laura: Good morning, Doctor. I have a really sore throat and a fever since yesterday. My temperature is 38.5. Dr. Chen: I see. Do you have any other symptoms? A cough, or a headache? Laura: Yes, I have a headache too, and I feel very tired. Dr. Chen: Let me check your throat. Open your mouth, please. Yes, it is quite red and swollen. I think you have a throat infection. Laura: Is it serious? Dr. Chen: No, nothing to worry about. I will prescribe you some medicine. Take it three times a day for five days, and drink plenty of water. You should also rest at home for two or three days. Laura: Thank you, Doctor. Can I get the prescription now? Dr. Chen: Of course. I will also give you a medical certificate for your employer. Laura: That would be great. Thank you for your help!"}, {"id": "l2", "type": "listen", "sentence": "What does Dr. Chen advise Laura to do?", "options": ["Take medicine three times a day, drink water, and rest for 2-3 days", "Take medicine once a day and go to work", "Take medicine twice a day and exercise"], "correct": "Take medicine three times a day, drink water, and rest for 2-3 days", "explanation": "Dr. Chen says: 'Take it three times a day for five days, and drink plenty of water. You should also rest at home for two or three days.' He also gives her a medical certificate for her employer so she can stay home. The advice is clear: medicine + water + rest.", "audio_text": "Dr. Chen: Good morning, Laura. What seems to be the problem today? Laura: Good morning, Doctor. I have a really sore throat and a fever since yesterday. My temperature is 38.5. Dr. Chen: I see. Do you have any other symptoms? A cough, or a headache? Laura: Yes, I have a headache too, and I feel very tired. Dr. Chen: Let me check your throat. Open your mouth, please. Yes, it is quite red and swollen. I think you have a throat infection. Laura: Is it serious? Dr. Chen: No, nothing to worry about. I will prescribe you some medicine. Take it three times a day for five days, and drink plenty of water. You should also rest at home for two or three days. Laura: Thank you, Doctor. Can I get the prescription now? Dr. Chen: Of course. I will also give you a medical certificate for your employer. Laura: That would be great. Thank you for your help!"}]}]};
let answered = 0, totalQuestions = 0, answers = {}, sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(s => {
    if (!answers[s.id]) answers[s.id] = {};
    (s.questions || []).forEach(q => { totalQuestions++; answers[s.id][q.id] = null; });
  });
  renderAll(); updateProgress();
}

function renderAll() {
  const c = document.getElementById('quizContent'); c.innerHTML = ''; let gq = 0;
  sectionData.forEach(sec => {
    let h = '<div class="section-card" id="section_' + sec.id + '">';
    h += '<div class="section-title"><span class="icon">' + (sec.icon||'📝') + '</span>' + esc(sec.title) + '</div>';
    if (sec.theory) h += '<div class="theory">' + fmtTheory(sec.theory) + '</div>';
    if (sec.instruction) h += '<div style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(sec.instruction) + '</div>';
    // Section-level audio: use pre-generated MP3 if available, else TTS fallback
    var secAudioTexts = [...new Set((sec.questions||[]).filter(q=>q.type==='listen'&&q.audio_text).map(q=>q.audio_text))];
    var secAudioUrl = quizData.audio_url || '';
    if (secAudioTexts.length > 0) {
      h += '<div class="section-audio">';
      if (secAudioUrl) {
        h += '<audio id="dialogAudio" controls preload="auto" style="width:100%;border-radius:10px;margin-bottom:6px;">';
        h += '<source src="' + secAudioUrl + '?nocache=' + Date.now() + '" type="audio/mpeg">';
        h += '</audio>';
        h += '<div style="margin-top:8px;display:flex;justify-content:center;gap:8px;align-items:center;">';
        h += '<span style="font-size:12px;color:var(--text-dim);">Скорость:</span>';
        h += '<button class="speed-btn" data-speed="0.5" onclick="setAudioSpeed(0.5,this)">🐢 0.5x</button>';
        h += '<button class="speed-btn" data-speed="0.75" onclick="setAudioSpeed(0.75,this)">0.75x</button>';
        h += '<button class="speed-btn active" data-speed="1" onclick="setAudioSpeed(1,this)">1x</button>';
        h += '</div>';
      } else {
        h += '<button class="speak-btn" data-audio-b64="' + btoa(unescape(encodeURIComponent(JSON.stringify(secAudioTexts)))) + '" onclick="speakSection(this)">🔊</button>';
      }
      h += '<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">Нажми Play, чтобы послушать диалог</div>';
      h += '</div>';
    }
    (sec.questions||[]).forEach(q => {
      gq++; h += '<div class="question-block"><div class="question-number">Вопрос ' + gq + '</div>';
      if (q.sentence) h += '<div class="sentence">' + fmtSent(q.sentence, sec.id, q.id, q.type) + '</div>';
      h += renderOpts(sec.id, q);
      if (q.explanation) h += '<div class="explanation" id="exp_'+sec.id+'_'+q.id+'">' + esc(q.explanation) + '</div>';
      h += '</div>';
    });
    h += '</div>'; c.insertAdjacentHTML('beforeend', h);
  });
}

function speakSection(btn) {
  const texts = JSON.parse(decodeURIComponent(escape(atob(btn.dataset.audioB64))));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn || texts.length === 0) return; btn.classList.add('speaking');
  const v = window.speechSynthesis.getVoices();
  const voice = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  let idx = 0;
  function next() {
    if (idx >= texts.length) { btn.classList.remove('speaking'); return; }
    const u = new SpeechSynthesisUtterance(texts[idx]); u.lang='en-US'; u.rate=0.85;
    if (voice) u.voice = voice;
    u.onend = () => { idx++; setTimeout(next, 400); };
    u.onerror = () => { btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function speak(btn) {
  const text = btn.dataset.audioText;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn) return; btn.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
  const v = window.speechSynthesis.getVoices();
  const ev = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  if (ev) u.voice = ev;
  u.onend = () => btn.classList.remove('speaking');
  u.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) { window.speechSynthesis.getVoices(); if (window.speechSynthesis.onvoiceschanged!==undefined) { window.speechSynthesis.onvoiceschanged = function(){}; } }

function fmtTheory(t) { return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function fmtSent(s,sid,qid,type) { if(!s) return ''; if(type==='choice') return s.replace(/___+/g,'<span class="blank" id="blank_'+sid+'_'+qid+'">___</span>'); return esc(s); }

function renderOpts(sid, q) {
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type==='tf') return '<div class="options horizontal"><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="T" onclick="sel(this)">✓ True</button><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="F" onclick="sel(this)">✗ False</button></div>';
  if (q.type==='choice'||q.type==='listen') {
    let h='<div class="options">';
    var _opts = (q.options||[]).slice();
    for (var _i=_opts.length-1; _i>0; _i--) { var _j=Math.floor(Math.random()*(_i+1)); var _t=_opts[_i]; _opts[_i]=_opts[_j]; _opts[_j]=_t; }
    _opts.forEach((o,i) => { h+='<button class="option-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="'+esc(o)+'" onclick="sel(this)"><span class="letter">'+L[i]+'</span>'+esc(o)+'</button>'; });
    return h+'</div>';
  }
  return '';
}

function sel(btn) {
  const sid=btn.dataset.sec, qid=btn.dataset.q, val=btn.dataset.val;
  if(answers[sid][qid]!==null) return;
  answers[sid][qid]=val; answered++;
  const sec=sectionData.find(s=>s.id===sid), q=sec.questions.find(x=>x.id==qid);
  const corr=String(q.correct), ok=val===corr;
  btn.parentElement.querySelectorAll('.option-btn').forEach(s => {
    s.disabled=true; if(s.dataset.val===corr) s.classList.add('correct'); if(s===btn&&!ok) s.classList.add('wrong');
  });
  const bl=document.getElementById('blank_'+sid+'_'+qid);
  if(bl) { bl.textContent=corr; bl.classList.add(ok?'filled':'wrong-fill'); }
  const ex=document.getElementById('exp_'+sid+'_'+qid); if(ex) ex.classList.add('visible');
  updateProgress();
  if(answered>=totalQuestions) setTimeout(showRes, 800);
}

function updateProgress() { document.getElementById('progressFill').style.width = (totalQuestions>0?(answered/totalQuestions*100):0)+'%'; }

function showRes() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  let ok=0, d='';
  sectionData.forEach(sec => {
    sec.questions.forEach(q => {
      const ua=answers[sec.id][q.id], cs=String(q.correct), isOK=ua===cs; if(isOK) ok++;
      d+='<div class="result-item"><div class="ri-q">'+esc(sec.title)+' — '+q.id+'</div>';
      if(q.sentence) d+='<div>'+esc(q.sentence.replace(/___+/g,cs))+'</div>';
      else if(q.options) d+='<div>'+esc(q.options.join(' / '))+'</div>';
      if(!isOK&&ua!==null) d+='<div><span class="ri-wrong">'+esc(ua)+'</span> <span class="ri-correct">'+esc(cs)+'</span></div>';
      if(isOK) d+='<div><span class="ri-correct">✓ '+esc(cs)+'</span></div>';
      if(q.explanation) d+='<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">'+esc(q.explanation)+'</div>';
      d+='</div>';
    });
  });
  const p=Math.round(ok/totalQuestions*100), el=document.getElementById('scoreDisplay');
  el.innerHTML=ok+'/'+totalQuestions+' <span class="pct">('+p+'%)</span>';
  el.className='score '+(p>=90?'excellent':p>=60?'good':'needs-work');
  let m=''; if(p>=90) m='🎉 Отлично!'; else if(p>=70) m='👍 Хороший результат!'; else if(p>=50) m='📚 Стоит повторить.'; else m='💪 Попробуй ещё раз!';
  document.getElementById('scoreMessage').textContent=m;
  document.getElementById('resultsDetail').innerHTML='<h3>Подробно</h3>'+d;
}

function restartQuiz() {
  answered=0; if(window.speechSynthesis) window.speechSynthesis.cancel();
  Object.keys(answers).forEach(k=>Object.keys(answers[k]).forEach(qk=>answers[k][qk]=null));
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll(); updateProgress(); window.scrollTo(0,0);
}

function setAudioSpeed(speed, btn) {
  const audio = document.getElementById('dialogAudio');
  if (audio) audio.playbackRate = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
init();
</script>
