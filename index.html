<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Travel &amp; Transport — airports, hotels, getting around a city</title>
<style>
:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --accent: #e94560;
  --accent-light: #ff6b81;
  --correct: #2ed573;
  --wrong: #ff4757;
  --text: #eaeaea;
  --text-dim: #8892a4;
  --border: #2a3a5e;
  --btn-radius: 12px;
  --theory-bg: rgba(255,255,255,0.03);
  --theory-border: #3a4a6e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  -webkit-tap-highlight-color: transparent;
}

.container { max-width: 600px; margin: 0 auto; }

.header {
  text-align: center;
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.header h1 { font-size: 22px; font-weight: 700; color: var(--accent-light); }
.header .subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }

.phrase-box {
  background: linear-gradient(135deg, rgba(233,69,96,0.12), rgba(255,107,129,0.08));
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 16px;
  text-align: center;
}
.phrase-box .label { font-size: 11px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.phrase-box .phrase { font-size: 16px; font-weight: 600; font-style: italic; color: var(--text); }
.phrase-box .translation { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

.audio-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  text-align: center;
}
.audio-box .audio-label { font-size: 12px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.audio-box audio { width: 100%; max-width: 320px; height: 40px; border-radius: 8px; }

.progress-bar {
  width: 100%; height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin-bottom: 16px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}

.section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-title {
  font-size: 16px; font-weight: 700; color: var(--text);
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
  display: flex; align-items: center; gap: 8px;
}
.section-title .icon { font-size: 20px; }

.theory {
  background: var(--theory-bg);
  border-left: 3px solid var(--theory-border);
  border-radius: 0 8px 8px 0;
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-dim);
}
.theory strong { color: var(--text); font-weight: 600; }
.theory em { color: var(--accent-light); font-style: italic; }

.question-block {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.question-number {
  font-size: 12px; font-weight: 600;
  color: var(--accent-light);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.sentence {
  font-size: 15px; line-height: 1.7;
  margin-bottom: 14px;
  padding: 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 8px;
}

.blank {
  display: inline-block;
  min-width: 80px;
  border-bottom: 2px dashed var(--accent);
  margin: 0 4px;
  text-align: center;
  color: var(--accent-light);
  font-weight: 600;
}
.blank.filled { border-bottom-style: solid; color: var(--correct); }
.blank.wrong-fill { border-bottom-style: solid; color: var(--wrong); }

.options { display: flex; flex-direction: column; gap: 8px; }
.options.horizontal { flex-direction: row; justify-content: center; gap: 12px; }

.option-btn {
  background: rgba(255,255,255,0.06);
  border: 2px solid var(--border);
  border-radius: var(--btn-radius);
  padding: 14px 20px;
  font-size: 15px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  min-height: 48px;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
}
.option-btn:active { transform: scale(0.97); }
.option-btn.correct {
  background: rgba(46,213,115,0.15);
  border-color: var(--correct);
  color: var(--correct);
  font-weight: 600;
}
.option-btn.wrong {
  background: rgba(255,71,87,0.15);
  border-color: var(--wrong);
  color: var(--wrong);
  font-weight: 600;
}
.option-btn:disabled { cursor: default; opacity: 0.7; }
.option-btn:disabled:active { transform: none; }
.option-btn .letter { font-weight: 700; margin-right: 8px; color: var(--text-dim); }
.option-btn.correct .letter { color: var(--correct); }
.option-btn.wrong .letter { color: var(--wrong); }

.tf-btn {
  flex: 1; max-width: 140px;
  padding: 18px 24px;
  font-size: 18px; font-weight: 700;
  letter-spacing: 1px;
}

.explanation {
  margin-top: 10px;
  padding: 10px 12px;
  background: rgba(46,213,115,0.08);
  border-left: 3px solid var(--correct);
  border-radius: 0 8px 8px 0;
  font-size: 13px; line-height: 1.6;
  color: var(--text-dim);
  display: none;
}
.explanation.visible { display: block; }

.results {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  animation: fadeIn 0.5s ease;
}
.results .score { font-size: 48px; font-weight: 800; margin: 16px 0; }
.results .score .pct { font-size: 24px; color: var(--text-dim); }
.results .score.excellent { color: var(--correct); }
.results .score.good { color: var(--accent-light); }
.results .score.needs-work { color: var(--wrong); }
.results .message { font-size: 16px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }

.results-detail {
  text-align: left;
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.results-detail h3 {
  font-size: 14px; color: var(--text-dim);
  margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 1px;
}
.result-item {
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 14px; line-height: 1.5;
}
.result-item .ri-q { color: var(--text-dim); margin-bottom: 4px; }
.result-item .ri-correct { color: var(--correct); font-weight: 600; }
.result-item .ri-wrong { color: var(--wrong); font-weight: 600; text-decoration: line-through; margin-right: 8px; }

.restart-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  border: none; border-radius: var(--btn-radius);
  padding: 16px 40px;
  font-size: 16px; font-weight: 700;
  color: white; cursor: pointer;
  margin-top: 20px;
  transition: all 0.2s ease;
}
.restart-btn:active { transform: scale(0.97); }

.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Travel &amp; Transport — airports, hotels, getting around a city</h1>
    <div class="subtitle">2026-07-20</div>
  </div>
  <div class="phrase-box">
<div class="label">💡 Фраза дня</div>
<div class="phrase">Could you tell me how to get to the train station?</div>
<div class="translation">Не подскажете, как добраться до вокзала?</div>
</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quizContent"></div>
  <div class="results hidden" id="results">
    <div style="font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;">Результат</div>
    <div class="score" id="scoreDisplay"></div>
    <div class="message" id="scoreMessage"></div>
    <div class="results-detail" id="resultsDetail"></div>
    <button class="restart-btn" onclick="restartQuiz()">Пройти ещё раз</button>
  </div>
</div>
<script>
const quizData = {"title": "Travel & Transport — airports, hotels, getting around a city", "subtitle": "2026-07-20", "date": "2026-07-20", "phrase_of_the_day": "Could you tell me how to get to the train station?", "phrase_translation": "Не подскажете, как добраться до вокзала?", "audio_url": "https://nataliastanislavovna.github.io/english-quiz/audio.mp3", "sections": [{"id": "s1", "title": "Vocabulary: At the airport", "icon": "✏️", "theory": "Аэропортная лексика: **boarding pass** (посадочный талон), **departure lounge** (зал вылета), **baggage claim** (выдача багажа), **customs** (таможня), **passport control** (паспортный контроль), **delayed** (задержанный), **gate** (выход на посадку), **aisle seat** (место у прохода), **window seat** (место у окна), **hand luggage** (ручная кладь).", "instruction": "", "questions": [{"id": 1, "type": "choice", "sentence": "You show your ___ at passport control before you can enter the departure lounge.", "options": ["boarding pass", "ticket", "passport", "luggage"], "correct": "passport", "explanation": "На паспортном контроле (passport control) показывают **passport** (паспорт). Boarding pass (посадочный талон) показывают уже в зоне вылета на выходе на посадку (gate). Ticket (билет) — при покупке/регистрации. Luggage (багаж) — сдают отдельно."}, {"id": 2, "type": "fill", "sentence": "Our flight to Berlin has been ___ by two hours because of bad weather.", "options": ["delayed", "cancelled", "departed", "arrived"], "correct": "delayed", "explanation": "«Delayed» = задержан (на 2 часа — by two hours). Это когда рейс улетит позже расписания. «Cancelled» = отменён полностью (не вылетит вообще). «Departed» = вылетел вовремя. «Arrived» = прибыл."}, {"id": 3, "type": "tf", "sentence": "\"Baggage claim\" is the area where you pick up your suitcases after a flight.", "options": ["T", "F"], "correct": "T", "explanation": "Верно! «Baggage claim» (или «baggage reclaim» в британском английском) = зона выдачи багажа. Это карусель, где вы забираете свои чемоданы после прилёта. «Check-in» — регистрация, где вы сдаёте багаж ПЕРЕД вылетом."}]}, {"id": "s2", "title": "Vocabulary: Hotels & Accommodation", "icon": "✏️", "theory": "Лексика отелей: **check in** (зарегистрироваться/заселиться), **check out** (выехать), **reception / front desk** (стойка ресепшен), **single room** (одноместный номер), **double room** (двухместный номер), **breakfast included** (завтрак включён), **key card** (ключ-карта), **booking / reservation** (бронирование).", "instruction": "", "questions": [{"id": 4, "type": "choice", "sentence": "When you arrive at a hotel, you go to the ___ to check in.", "options": ["reception", "restaurant", "gym", "lobby"], "correct": "reception", "explanation": "«Reception» (или «front desk») = стойка регистрации в отеле. Здесь вы оформляете check-in и получаете ключ-карту. «Restaurant» = ресторан (для питания). «Gym» = спортзал. «Lobby» = вестибюль/холл (большая зона при входе, но регистрацию делает именно reception)."}, {"id": 5, "type": "fill", "sentence": "I have a ___ for three nights under the name Johnson.", "options": ["reservation", "subscription", "decision", "presentation"], "correct": "reservation", "explanation": "«Reservation» = бронирование. Фраза «I have a reservation under the name...» = У меня есть бронирование на имя... Стандартная фраза при check-in. «Subscription» = подписка. «Decision» = решение. «Presentation» = презентация."}, {"id": 6, "type": "tf", "sentence": "\"Check out\" means the moment when you arrive at a hotel and get your room key.", "options": ["T", "F"], "correct": "F", "explanation": "Нет! «Check out» = выехать из отеля (освободить номер, вернуть ключ). «Check in» = заселиться (приехать, зарегистрироваться, получить ключ). Напротив: check in = въезд, check out = выезд."}]}, {"id": "s3", "title": "Grammar: Prepositions of movement", "icon": "✏️", "theory": "Предлоги направления: **to** (к, в — цель): *go to London, walk to the station*. **into** (внутрь): *walk into the building*. **onto** (на поверхность): *get onto the bus*. **out of** (изнутри наружу): *get out of the car*. **through** (сквозь): *walk through the park*. **along** (вдоль): *walk along the street*.", "instruction": "", "questions": [{"id": 7, "type": "choice", "sentence": "We got ___ the train and found our seats.", "options": ["onto", "into", "in", "over"], "correct": "onto", "explanation": "С транспортными средствами используем **onto** или **on**: «get onto/on the train/bus/plane» = сесть на поезд/автобус/самолёт. «Into» — для помещения (into the room, into the car — для машин, потому что это замкнутое пространство). «Over» = через/над."}, {"id": 8, "type": "fill", "sentence": "Go straight ___ this road, then turn left at the traffic lights.", "options": ["along", "across", "through", "around"], "correct": "along", "explanation": "«Along» = вдоль. «Go straight along this road» = идите прямо вдоль этой дороги. «Across» = через (через дорогу — across the road). «Through» = сквозь (через парк — through the park). «Around» = вокруг (около). Для движения вдоль прямой линии используем along."}, {"id": 9, "type": "tf", "sentence": "\"Get out of the taxi\" is the correct way to say «выйти из такси».", "options": ["T", "F"], "correct": "T", "explanation": "Верно! «Get out of» используется для закрытых транспортных средств, где вы «внутри»: get out of the taxi, get out of the car, get out of the bus. Не путайте с «get off» — для транспорта, где вы «на» поверхности: get off the bus (обычно тоже используется), get off the train, get off a bicycle."}]}, {"id": "s4", "title": "Listening: At a hotel reception", "icon": "🎧", "theory": "", "instruction": "", "questions": [{"id": 10, "type": "listen", "sentence": "Listen and answer: How many nights is the guest staying?", "options": ["Three nights", "Two nights", "One night", "Five nights"], "correct": "Three nights", "explanation": "Ресепшионист говорит: «A double room for three nights with breakfast included» = Двухместный номер на три ночи с завтраком. Ответ: three nights (три ночи). Гость подтверждает: «That's correct» (Это верно).", "audio_text": "Good afternoon, welcome to the Grand Hotel. How can I help you today? Hello, I'd like to check in, please. I have a reservation under the name Anderson. Let me look that up for you. Anderson... Yes, here it is. A double room for three nights with breakfast included. That's correct. Could I have a room on a higher floor, if possible? Of course. I can give you room five oh eight on the fifth floor. It has a beautiful view of the river. That sounds wonderful. And could you tell me what time breakfast is served? Breakfast is served from seven to ten in the dining room on the ground floor. Perfect. And one more thing — is there WiFi in the rooms? Yes, the password is on the key card holder. Here's your key card. The lift is just down the corridor on your left. Thank you very much. Enjoy your stay."}, {"id": 11, "type": "listen", "sentence": "Listen and answer: Where can the guest have breakfast?", "options": ["In the dining room on the ground floor", "In the room", "In a restaurant across the street", "On the fifth floor"], "correct": "In the dining room on the ground floor", "explanation": "Ресепшионист отвечает: «Breakfast is served from seven to ten in the dining room on the ground floor» = Завтрак подаётся с семи до десяти в столовой на первом этаже (ground floor). «Ground floor» в британском английском = первый этаж (в американском — first floor).", "audio_text": "Good afternoon, welcome to the Grand Hotel. How can I help you today? Hello, I'd like to check in, please. I have a reservation under the name Anderson. Let me look that up for you. Anderson... Yes, here it is. A double room for three nights with breakfast included. That's correct. Could I have a room on a higher floor, if possible? Of course. I can give you room five oh eight on the fifth floor. It has a beautiful view of the river. That sounds wonderful. And could you tell me what time breakfast is served? Breakfast is served from seven to ten in the dining room on the ground floor. Perfect. And one more thing — is there WiFi in the rooms? Yes, the password is on the key card holder. Here's your key card. The lift is just down the corridor on your left. Thank you very much. Enjoy your stay."}, {"id": 12, "type": "listen", "sentence": "Listen and answer: What special feature does the room have?", "options": ["A view of the river", "A balcony", "A private bathroom with a bath", "A mini-fridge"], "correct": "A view of the river", "explanation": "Ресепшионист говорит: «I can give you room five oh eight on the fifth floor. It has a beautiful view of the river» = Могу дать вам номер 508 на пятом этаже. Оттуда прекрасный вид на реку. «View of the river» = вид на реку. Балкон, ванная и мини-холодильник не упоминались.", "audio_text": "Good afternoon, welcome to the Grand Hotel. How can I help you today? Hello, I'd like to check in, please. I have a reservation under the name Anderson. Let me look that up for you. Anderson... Yes, here it is. A double room for three nights with breakfast included. That's correct. Could I have a room on a higher floor, if possible? Of course. I can give you room five oh eight on the fifth floor. It has a beautiful view of the river. That sounds wonderful. And could you tell me what time breakfast is served? Breakfast is served from seven to ten in the dining room on the ground floor. Perfect. And one more thing — is there WiFi in the rooms? Yes, the password is on the key card holder. Here's your key card. The lift is just down the corridor on your left. Thank you very much. Enjoy your stay."}]}]};

let answered = 0;
let totalQuestions = 0;
let answers = {};
let sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(section => {
    if (!answers[section.id]) answers[section.id] = {};
    (section.questions || []).forEach(q => {
      totalQuestions++;
      answers[section.id][q.id] = null;
    });
  });
  renderAll();
  updateProgress();
}

function renderAll() {
  const container = document.getElementById('quizContent');
  container.innerHTML = '';
  let globalQ = 0;
  sectionData.forEach(section => {
    let html = '<div class="section-card" id="section_' + section.id + '">';

    // Section title
    html += '<div class="section-title"><span class="icon">' + (section.icon || '📝') + '</span>' + esc(section.title) + '</div>';

    // Audio player INSIDE this section if it has listen questions
    const hasListen = (section.questions || []).some(q => q.type === 'listen');
    if (hasListen && quizData.audio_url) {
      html += '<div class="audio-box">';
      html += '<div class="audio-label">🎧 Listen to the dialogue</div>';
      html += '<audio controls preload="none"><source src="' + esc(quizData.audio_url) + '">Your browser does not support audio.</audio>';
      html += '</div>';
    }

    // Theory BEFORE questions
    if (section.theory) {
      html += '<div class="theory">' + formatTheory(section.theory) + '</div>';
    }

    // Instruction
    if (section.instruction) {
      html += '<div class="instruction" style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(section.instruction) + '</div>';
    }

    // Questions
    (section.questions || []).forEach(q => {
      globalQ++;
      html += '<div class="question-block">';
      html += '<div class="question-number">Вопрос ' + globalQ + '</div>';
      if (q.sentence) {
        html += '<div class="sentence">' + formatSentence(q.sentence, section.id, q.id, q.type) + '</div>';
      }
      html += renderOptions(section.id, q);
      if (q.explanation) {
        html += '<div class="explanation" id="exp_' + section.id + '_' + q.id + '">' + esc(q.explanation) + '</div>';
      }
      html += '</div>';
    });

    html += '</div>';
    container.insertAdjacentHTML('beforeend', html);
  });
}

function formatTheory(text) {
  // Support **bold** and *italic* in theory text
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function formatSentence(sentence, secId, qId, type) {
  if (!sentence) return '';
  if (type === 'fill' || type === 'choice') {
    return sentence.replace(/___+/g, '<span class="blank" id="blank_' + secId + '_' + qId + '">___</span>');
  }
  return esc(sentence);
}

function renderOptions(secId, q) {
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type === 'tf') {
    return '<div class="options horizontal">' +
      '<button class="option-btn tf-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="T" onclick="selectOption(this)">✓ True</button>' +
      '<button class="option-btn tf-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="F" onclick="selectOption(this)">✗ False</button>' +
      '</div>';
  }
  if (q.type === 'choice' || q.type === 'fill' || q.type === 'select' || q.type === 'listen') {
    let html = '<div class="options">';
    (q.options || []).forEach((opt, i) => {
      html += '<button class="option-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="' + esc(opt) + '" onclick="selectOption(this)">' +
        '<span class="letter">' + letters[i] + '</span>' + esc(opt) + '</button>';
    });
    html += '</div>';
    return html;
  }
  return '';
}

function selectOption(btn) {
  const secId = btn.dataset.sec;
  const qId = btn.dataset.q;
  const val = btn.dataset.val;

  if (answers[secId][qId] !== null) return;

  answers[secId][qId] = val;
  answered++;

  const section = sectionData.find(s => s.id === secId);
  const question = section.questions.find(q => q.id == qId);
  const correct = question.correct;
  const isCorrect = val === correct;

  const siblings = btn.parentElement.querySelectorAll('.option-btn');
  siblings.forEach(s => {
    s.disabled = true;
    if (s.dataset.val === correct) s.classList.add('correct');
    if (s === btn && !isCorrect) s.classList.add('wrong');
  });

  const blank = document.getElementById('blank_' + secId + '_' + qId);
  if (blank) {
    blank.textContent = correct;
    blank.classList.add(isCorrect ? 'filled' : 'wrong-fill');
  }

  const exp = document.getElementById('exp_' + secId + '_' + qId);
  if (exp) exp.classList.add('visible');

  updateProgress();

  if (answered >= totalQuestions) {
    setTimeout(showResults, 800);
  }
}

function updateProgress() {
  const pct = totalQuestions > 0 ? (answered / totalQuestions * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function showResults() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');

  let correct = 0;
  let detailsHtml = '';

  sectionData.forEach(section => {
    section.questions.forEach(q => {
      const userAnswer = answers[section.id][q.id];
      const isCorrect = userAnswer === q.correct;
      if (isCorrect) correct++;

      detailsHtml += '<div class="result-item">';
      detailsHtml += '<div class="ri-q">' + esc(section.title) + ' — Вопрос ' + q.id + '</div>';
      if (q.sentence) {
        detailsHtml += '<div>' + esc(q.sentence.replace(/___+/g, q.correct)) + '</div>';
      } else {
        detailsHtml += '<div>' + esc(q.options ? q.options.join(' / ') : '') + '</div>';
      }
      if (!isCorrect && userAnswer !== null) {
        detailsHtml += '<div><span class="ri-wrong">' + esc(userAnswer) + '</span><span class="ri-correct">' + esc(q.correct) + '</span></div>';
      }
      if (isCorrect) {
        detailsHtml += '<div><span class="ri-correct">✓ ' + esc(q.correct) + '</span></div>';
      }
      if (q.explanation) {
        detailsHtml += '<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">' + esc(q.explanation) + '</div>';
      }
      detailsHtml += '</div>';
    });
  });

  const pct = Math.round(correct / totalQuestions * 100);
  const scoreEl = document.getElementById('scoreDisplay');
  scoreEl.textContent = correct + '/' + totalQuestions + ' ';
  scoreEl.innerHTML += '<span class="pct">(' + pct + '%)</span>';
  scoreEl.className = 'score ' + (pct >= 90 ? 'excellent' : pct >= 60 ? 'good' : 'needs-work');

  let msg = '';
  if (pct >= 90) msg = '🎉 Отлично! Великолепная работа!';
  else if (pct >= 70) msg = '👍 Хороший результат! Ещё немного практики.';
  else if (pct >= 50) msg = '📚 Неплохо, но стоит повторить материал.';
  else msg = '💪 Не расстраивайся! Повтори тему и попробуй ещё раз.';
  document.getElementById('scoreMessage').textContent = msg;

  document.getElementById('resultsDetail').innerHTML = '<h3>Подробно</h3>' + detailsHtml;
}

function restartQuiz() {
  answered = 0;
  Object.keys(answers).forEach(k => {
    Object.keys(answers[k]).forEach(qk => answers[k][qk] = null);
  });
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll();
  updateProgress();
  window.scrollTo(0, 0);
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>

</html>
