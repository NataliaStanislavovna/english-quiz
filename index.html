<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>At the Airport &amp; Flying — check-in, gates, boarding</title>
<style>
:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --accent: #e94560;
  --accent-light: #ff6b81;
  --correct: #2ed573;
  --wrong: #ff4757;
  --text: #eaeaea;
  --text-dim: #8892a4;
  --border: #2a3a5e;
  --btn-radius: 12px;
  --theory-bg: rgba(255,255,255,0.03);
  --theory-border: #3a4a6e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  -webkit-tap-highlight-color: transparent;
}

.container { max-width: 600px; margin: 0 auto; }

.header {
  text-align: center;
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.header h1 { font-size: 22px; font-weight: 700; color: var(--accent-light); }
.header .subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }

.phrase-box {
  background: linear-gradient(135deg, rgba(233,69,96,0.12), rgba(255,107,129,0.08));
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 16px;
  text-align: center;
}
.phrase-box .label { font-size: 11px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.phrase-box .phrase { font-size: 16px; font-weight: 600; font-style: italic; color: var(--text); }
.phrase-box .translation { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

.audio-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  text-align: center;
}
.audio-box .audio-label { font-size: 12px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.audio-box audio { width: 100%; max-width: 320px; height: 40px; border-radius: 8px; }

.progress-bar {
  width: 100%; height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin-bottom: 16px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}

.section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-title {
  font-size: 16px; font-weight: 700; color: var(--text);
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
  display: flex; align-items: center; gap: 8px;
}
.section-title .icon { font-size: 20px; }

.theory {
  background: var(--theory-bg);
  border-left: 3px solid var(--theory-border);
  border-radius: 0 8px 8px 0;
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-dim);
}
.theory strong { color: var(--text); font-weight: 600; }
.theory em { color: var(--accent-light); font-style: italic; }

.question-block {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.question-number {
  font-size: 12px; font-weight: 600;
  color: var(--accent-light);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.sentence {
  font-size: 15px; line-height: 1.7;
  margin-bottom: 14px;
  padding: 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 8px;
}

.blank {
  display: inline-block;
  min-width: 80px;
  border-bottom: 2px dashed var(--accent);
  margin: 0 4px;
  text-align: center;
  color: var(--accent-light);
  font-weight: 600;
}
.blank.filled { border-bottom-style: solid; color: var(--correct); }
.blank.wrong-fill { border-bottom-style: solid; color: var(--wrong); }

.options { display: flex; flex-direction: column; gap: 8px; }
.options.horizontal { flex-direction: row; justify-content: center; gap: 12px; }

.option-btn {
  background: rgba(255,255,255,0.06);
  border: 2px solid var(--border);
  border-radius: var(--btn-radius);
  padding: 14px 20px;
  font-size: 15px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  min-height: 48px;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
}
.option-btn:active { transform: scale(0.97); }
.option-btn.correct {
  background: rgba(46,213,115,0.15);
  border-color: var(--correct);
  color: var(--correct);
  font-weight: 600;
}
.option-btn.wrong {
  background: rgba(255,71,87,0.15);
  border-color: var(--wrong);
  color: var(--wrong);
  font-weight: 600;
}
.option-btn:disabled { cursor: default; opacity: 0.7; }
.option-btn:disabled:active { transform: none; }
.option-btn .letter { font-weight: 700; margin-right: 8px; color: var(--text-dim); }
.option-btn.correct .letter { color: var(--correct); }
.option-btn.wrong .letter { color: var(--wrong); }

.tf-btn {
  flex: 1; max-width: 140px;
  padding: 18px 24px;
  font-size: 18px; font-weight: 700;
  letter-spacing: 1px;
}

.explanation {
  margin-top: 10px;
  padding: 10px 12px;
  background: rgba(46,213,115,0.08);
  border-left: 3px solid var(--correct);
  border-radius: 0 8px 8px 0;
  font-size: 13px; line-height: 1.6;
  color: var(--text-dim);
  display: none;
}
.explanation.visible { display: block; }

.results {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  animation: fadeIn 0.5s ease;
}
.results .score { font-size: 48px; font-weight: 800; margin: 16px 0; }
.results .score .pct { font-size: 24px; color: var(--text-dim); }
.results .score.excellent { color: var(--correct); }
.results .score.good { color: var(--accent-light); }
.results .score.needs-work { color: var(--wrong); }
.results .message { font-size: 16px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }

.results-detail {
  text-align: left;
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.results-detail h3 {
  font-size: 14px; color: var(--text-dim);
  margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 1px;
}
.result-item {
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 14px; line-height: 1.5;
}
.result-item .ri-q { color: var(--text-dim); margin-bottom: 4px; }
.result-item .ri-correct { color: var(--correct); font-weight: 600; }
.result-item .ri-wrong { color: var(--wrong); font-weight: 600; text-decoration: line-through; margin-right: 8px; }

.restart-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  border: none; border-radius: var(--btn-radius);
  padding: 16px 40px;
  font-size: 16px; font-weight: 700;
  color: white; cursor: pointer;
  margin-top: 20px;
  transition: all 0.2s ease;
}
.restart-btn:active { transform: scale(0.97); }

.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>At the Airport &amp; Flying — check-in, gates, boarding</h1>
    <div class="subtitle">2026-07-16</div>
  </div>
  <div class="phrase-box">
<div class="label">💡 Фраза дня</div>
<div class="phrase">Could you tell me which gate my flight departs from?</div>
<div class="translation">Не подскажете, с какого гейта вылетает мой рейс?</div>
</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quizContent"></div>
  <div class="results hidden" id="results">
    <div style="font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;">Результат</div>
    <div class="score" id="scoreDisplay"></div>
    <div class="message" id="scoreMessage"></div>
    <div class="results-detail" id="resultsDetail"></div>
    <button class="restart-btn" onclick="restartQuiz()">Пройти ещё раз</button>
  </div>
</div>
<script>
const quizData = {"title": "At the Airport & Flying — check-in, gates, boarding", "subtitle": "2026-07-16", "date": "2026-07-16", "phrase_of_the_day": "Could you tell me which gate my flight departs from?", "phrase_translation": "Не подскажете, с какого гейта вылетает мой рейс?", "audio_url": "https://nataliastanislavovna.github.io/english-quiz/audio.mp3", "sections": [{"id": "s1", "title": "Theory: Airport vocabulary", "icon": "📖", "theory": "Ключевые слова аэропорта: **boarding pass** (посадочный талон), **check-in** (регистрация на рейс), **gate** (выход на посадку), **departure** (вылет), **arrival** (прибытие), **delayed** (задержан), ** luggage / baggage** (багаж), **carry-on** (ручная кладь), **boarding** (посадка на самолёт), **aisle seat** (место у прохода), **window seat** (место у окна).", "instruction": "", "questions": [{"id": 1, "type": "choice", "sentence": "After you check in, you receive a ___ which shows your seat number and gate.", "options": ["boarding pass", "passport", "receipt", "ticket machine"], "correct": "boarding pass", "explanation": "«Boarding pass» = посадочный талон. Это документ, который вы получаете после регистрации (check-in). На нём указаны: номер места (seat number), выход на посадку (gate) и время вылета (departure time)."}, {"id": 2, "type": "fill", "sentence": "I prefer an ___ seat because I like to look out during the flight.", "options": ["window", "wind", "winter", "wing"], "correct": "window", "explanation": "«Window seat» = место у окна. «Aisle seat» = место у прохода. Если любите смотреть на облака — просите window seat. Если нужно часто вставать — лучше aisle seat."}, {"id": 3, "type": "tf", "sentence": "\"Carry-on\" refers to luggage that you keep with you in the passenger cabin.", "options": ["T", "F"], "correct": "T", "explanation": "Да! Carry-on (или carry-on baggage) = ручная кладь. Это багаж, который вы берёте с собой в салон самолёта. Обычно есть ограничения по размеру и весу (например, не более 7 кг)."}]}, {"id": "s2", "title": "Vocabulary: Travel phrases", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": 4, "type": "choice", "sentence": "Your flight was supposed to leave at 10:00, but now it leaves at 12:30. The flight is ___.", "options": ["delayed", "cancelled", "arrived", "departed"], "correct": "delayed", "explanation": "«Delayed» = задержан. Когда рейс вылетает позже указанного времени — он delayed. Если рейс полностью отменяют — тогда cancelled. «My flight is delayed by two hours» = Мой рейс задержан на два часа."}, {"id": 5, "type": "fill", "sentence": "Passengers travelling to international destinations must go through passport ___ and security.", "options": ["control", "controller", "controlling", "contest"], "correct": "control", "explanation": "«Passport control» = паспортный контроль. В аэропорту вы проходите: check-in → security → passport control → boarding. Security control проверяет багаж, а passport control проверяет ваш паспорт."}, {"id": 6, "type": "choice", "sentence": "The announcement says: \"Please proceed to gate B7 for ___.\"", "options": ["boarding", "landing", "parking", "loading"], "correct": "boarding", "explanation": "«Boarding» = посадка на самолёт. Когда объявляют boarding, пассажиры идут к gate и показывают boarding pass. «Now boarding all rows» = посадка всех рядов. Не путайте с boarding pass (посадочный талон)."}]}, {"id": "s3", "title": "Grammar: Future forms for travel plans", "icon": "✏️", "theory": "Для планов поездок используем: **be going to** (для запланированных решений) и **will** (для предсказаний и быстрых решений). Примеры: **I'm going to visit Paris next month.** (Я собираюсь посетить Париж в следующем месяце.) **The flight will arrive at 6 PM.** (Рейс прибудет в 6 вечера.) В вопросах в аэропорту часто используют: **Will the flight be delayed?** (Рейс будет задержан?)", "instruction": "", "questions": [{"id": 7, "type": "choice", "sentence": "We ___ visit my sister in London next summer. We already bought the tickets.", "options": ["are going to", "will", "going", "do"], "correct": "are going to", "explanation": "«Are going to» используется, когда решение уже принято и есть план (билеты уже куплены). «Will» — для спонтанных решений или предсказаний. «We already bought the tickets» = мы уже купили билеты — значит, план точно есть."}, {"id": 8, "type": "fill", "sentence": "I think the weather ___ be warm in Spain in July.", "options": ["will", "going to", "are going to", "shall"], "correct": "will", "explanation": "«I think... will» = Я думаю, будет... Когда вы выражаете мнение или прогноз (prediction), используем will. «I think it will rain» = Думаю, пойдёт дождь. Это не факт, а ваше предположение."}, {"id": 9, "type": "tf", "sentence": "\"My flight departs at 8 AM tomorrow\" and \"My flight will depart at 8 AM tomorrow\" both sound natural.", "options": ["T", "F"], "correct": "T", "explanation": "Да! Для расписаний (timetables) можно использовать Present Simple: «My flight departs at 8 AM» = Мой рейс вылетает в 8 утра. Но «will depart» тоже правильный вариант в разговорной речи. Оба варианта естественны!"}]}, {"id": "s4", "title": "Listening: At the airport check-in", "icon": "🎧", "theory": "", "instruction": "", "questions": [{"id": 10, "type": "listen", "sentence": "Listen and answer: Where is the passenger flying to?", "options": ["Barcelona", "London", "Madrid", "Paris"], "correct": "Barcelona", "explanation": "Сотрудник спрашивает: «Where are you flying to today?» Пассажир отвечает: «I'm flying to Barcelona» = Я лечу в Барселону. Barcelona — город в Испании.", "audio_text": "Good morning, welcome to British Airways. Can I see your passport and booking confirmation, please? Here you go. Thank you. Are you checking any bags today? Yes, just this one suitcase. Could you please place it on the belt? Alright. Let me check the weight. That's twenty-two kilos, which is just under the limit. Where are you flying to today? I'm flying to Barcelona. And is this a return ticket? Yes, I'm coming back on Friday evening. Perfect. Would you prefer an aisle seat or a window seat? An aisle seat, please. Here is your boarding pass. Your flight departs from gate fourteen at eleven forty-five. Boarding starts at eleven fifteen. Please proceed to security and then to the departure lounge. Thank you very much. Enjoy your flight!"}, {"id": 11, "type": "listen", "sentence": "Listen and answer: What kind of seat did the passenger choose?", "options": ["An aisle seat", "A window seat", "A seat near the exit", "A seat in business class"], "correct": "An aisle seat", "explanation": "Сотрудник спрашивает: «Would you prefer an aisle seat or a window seat?» Пассажир отвечает: «An aisle seat, please» = Место у прохода, пожалуйста. Aisle seat — удобно, если нужно часто вставать.", "audio_text": "Good morning, welcome to British Airways. Can I see your passport and booking confirmation, please? Here you go. Thank you. Are you checking any bags today? Yes, just this one suitcase. Could you please place it on the belt? Alright. Let me check the weight. That's twenty-two kilos, which is just under the limit. Where are you flying to today? I'm flying to Barcelona. And is this a return ticket? Yes, I'm coming back on Friday evening. Perfect. Would you prefer an aisle seat or a window seat? An aisle seat, please. Here is your boarding pass. Your flight departs from gate fourteen at eleven forty-five. Boarding starts at eleven fifteen. Please proceed to security and then to the departure lounge. Thank you very much. Enjoy your flight!"}, {"id": 12, "type": "listen", "sentence": "Listen and answer: What time does boarding start?", "options": ["At 11:15", "At 11:45", "At 10:45", "At 12:00"], "correct": "At 11:15", "explanation": "Сотрудник говорит: «Boarding starts at eleven fifteen» = Посадка начинается в 11:15. А сам вылет (departure) — в 11:45 (eleven forty-five). Разница — 30 минут между началом посадки и вылетом.", "audio_text": "Good morning, welcome to British Airways. Can I see your passport and booking confirmation, please? Here you go. Thank you. Are you checking any bags today? Yes, just this one suitcase. Could you please place it on the belt? Alright. Let me check the weight. That's twenty-two kilos, which is just under the limit. Where are you flying to today? I'm flying to Barcelona. And is this a return ticket? Yes, I'm coming back on Friday evening. Perfect. Would you prefer an aisle seat or a window seat? An aisle seat, please. Here is your boarding pass. Your flight departs from gate fourteen at eleven forty-five. Boarding starts at eleven fifteen. Please proceed to security and then to the departure lounge. Thank you very much. Enjoy your flight!"}]}]};

let answered = 0;
let totalQuestions = 0;
let answers = {};
let sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(section => {
    if (!answers[section.id]) answers[section.id] = {};
    (section.questions || []).forEach(q => {
      totalQuestions++;
      answers[section.id][q.id] = null;
    });
  });
  renderAll();
  updateProgress();
}

function renderAll() {
  const container = document.getElementById('quizContent');
  container.innerHTML = '';
  let globalQ = 0;
  sectionData.forEach(section => {
    let html = '<div class="section-card" id="section_' + section.id + '">';

    // Section title
    html += '<div class="section-title"><span class="icon">' + (section.icon || '📝') + '</span>' + esc(section.title) + '</div>';

    // Audio player INSIDE this section if it has listen questions
    const hasListen = (section.questions || []).some(q => q.type === 'listen');
    if (hasListen && quizData.audio_url) {
      html += '<div class="audio-box">';
      html += '<div class="audio-label">🎧 Listen to the dialogue</div>';
      html += '<audio controls preload="none"><source src="' + esc(quizData.audio_url) + '">Your browser does not support audio.</audio>';
      html += '</div>';
    }

    // Theory BEFORE questions
    if (section.theory) {
      html += '<div class="theory">' + formatTheory(section.theory) + '</div>';
    }

    // Instruction
    if (section.instruction) {
      html += '<div class="instruction" style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(section.instruction) + '</div>';
    }

    // Questions
    (section.questions || []).forEach(q => {
      globalQ++;
      html += '<div class="question-block">';
      html += '<div class="question-number">Вопрос ' + globalQ + '</div>';
      if (q.sentence) {
        html += '<div class="sentence">' + formatSentence(q.sentence, section.id, q.id, q.type) + '</div>';
      }
      html += renderOptions(section.id, q);
      if (q.explanation) {
        html += '<div class="explanation" id="exp_' + section.id + '_' + q.id + '">' + esc(q.explanation) + '</div>';
      }
      html += '</div>';
    });

    html += '</div>';
    container.insertAdjacentHTML('beforeend', html);
  });
}

function formatTheory(text) {
  // Support **bold** and *italic* in theory text
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function formatSentence(sentence, secId, qId, type) {
  if (!sentence) return '';
  if (type === 'fill' || type === 'choice') {
    return sentence.replace(/___+/g, '<span class="blank" id="blank_' + secId + '_' + qId + '">___</span>');
  }
  return esc(sentence);
}

function renderOptions(secId, q) {
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type === 'tf') {
    return '<div class="options horizontal">' +
      '<button class="option-btn tf-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="T" onclick="selectOption(this)">✓ True</button>' +
      '<button class="option-btn tf-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="F" onclick="selectOption(this)">✗ False</button>' +
      '</div>';
  }
  if (q.type === 'choice' || q.type === 'fill' || q.type === 'select' || q.type === 'listen') {
    let html = '<div class="options">';
    (q.options || []).forEach((opt, i) => {
      html += '<button class="option-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="' + esc(opt) + '" onclick="selectOption(this)">' +
        '<span class="letter">' + letters[i] + '</span>' + esc(opt) + '</button>';
    });
    html += '</div>';
    return html;
  }
  return '';
}

function selectOption(btn) {
  const secId = btn.dataset.sec;
  const qId = btn.dataset.q;
  const val = btn.dataset.val;

  if (answers[secId][qId] !== null) return;

  answers[secId][qId] = val;
  answered++;

  const section = sectionData.find(s => s.id === secId);
  const question = section.questions.find(q => q.id == qId);
  const correct = question.correct;
  const isCorrect = val === correct;

  const siblings = btn.parentElement.querySelectorAll('.option-btn');
  siblings.forEach(s => {
    s.disabled = true;
    if (s.dataset.val === correct) s.classList.add('correct');
    if (s === btn && !isCorrect) s.classList.add('wrong');
  });

  const blank = document.getElementById('blank_' + secId + '_' + qId);
  if (blank) {
    blank.textContent = correct;
    blank.classList.add(isCorrect ? 'filled' : 'wrong-fill');
  }

  const exp = document.getElementById('exp_' + secId + '_' + qId);
  if (exp) exp.classList.add('visible');

  updateProgress();

  if (answered >= totalQuestions) {
    setTimeout(showResults, 800);
  }
}

function updateProgress() {
  const pct = totalQuestions > 0 ? (answered / totalQuestions * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function showResults() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');

  let correct = 0;
  let detailsHtml = '';

  sectionData.forEach(section => {
    section.questions.forEach(q => {
      const userAnswer = answers[section.id][q.id];
      const isCorrect = userAnswer === q.correct;
      if (isCorrect) correct++;

      detailsHtml += '<div class="result-item">';
      detailsHtml += '<div class="ri-q">' + esc(section.title) + ' — Вопрос ' + q.id + '</div>';
      if (q.sentence) {
        detailsHtml += '<div>' + esc(q.sentence.replace(/___+/g, q.correct)) + '</div>';
      } else {
        detailsHtml += '<div>' + esc(q.options ? q.options.join(' / ') : '') + '</div>';
      }
      if (!isCorrect && userAnswer !== null) {
        detailsHtml += '<div><span class="ri-wrong">' + esc(userAnswer) + '</span><span class="ri-correct">' + esc(q.correct) + '</span></div>';
      }
      if (isCorrect) {
        detailsHtml += '<div><span class="ri-correct">✓ ' + esc(q.correct) + '</span></div>';
      }
      if (q.explanation) {
        detailsHtml += '<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">' + esc(q.explanation) + '</div>';
      }
      detailsHtml += '</div>';
    });
  });

  const pct = Math.round(correct / totalQuestions * 100);
  const scoreEl = document.getElementById('scoreDisplay');
  scoreEl.textContent = correct + '/' + totalQuestions + ' ';
  scoreEl.innerHTML += '<span class="pct">(' + pct + '%)</span>';
  scoreEl.className = 'score ' + (pct >= 90 ? 'excellent' : pct >= 60 ? 'good' : 'needs-work');

  let msg = '';
  if (pct >= 90) msg = '🎉 Отлично! Великолепная работа!';
  else if (pct >= 70) msg = '👍 Хороший результат! Ещё немного практики.';
  else if (pct >= 50) msg = '📚 Неплохо, но стоит повторить материал.';
  else msg = '💪 Не расстраивайся! Повтори тему и попробуй ещё раз.';
  document.getElementById('scoreMessage').textContent = msg;

  document.getElementById('resultsDetail').innerHTML = '<h3>Подробно</h3>' + detailsHtml;
}

function restartQuiz() {
  answered = 0;
  Object.keys(answers).forEach(k => {
    Object.keys(answers[k]).forEach(qk => answers[k][qk] = null);
  });
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll();
  updateProgress();
  window.scrollTo(0, 0);
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>

</html>
