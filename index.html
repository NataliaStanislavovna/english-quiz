<!DOCTYPE html>
<html lang="en">

<style>
:root {
  --bg: #1a1a2e; --card: #16213e; --accent: #e94560; --accent-light: #ff6b81;
  --correct: #2ed573; --wrong: #ff4757; --text: #eaeaea; --text-dim: #8892a4;
  --border: #2a3a5e; --btn-radius: 12px;
  --theory-bg: rgba(255,255,255,0.03); --theory-border: #3a4a6e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; -webkit-tap-highlight-color: transparent; }
.container { max-width: 600px; margin: 0 auto; }
.header { text-align: center; padding: 20px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.header h1 { font-size: 22px; font-weight: 700; color: var(--accent-light); }
.header .subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
.phrase-box { background: linear-gradient(135deg, rgba(233,69,96,0.12), rgba(255,107,129,0.08)); border: 1px solid rgba(233,69,96,0.3); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; text-align: center; }
.phrase-box .label { font-size: 11px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.phrase-box .phrase { font-size: 16px; font-weight: 600; font-style: italic; color: var(--text); }
.phrase-box .translation { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
.progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); border-radius: 3px; transition: width 0.4s ease; width: 0%; }
.section-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.section-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--accent); display: flex; align-items: center; gap: 8px; }
.section-audio { text-align: center; margin-bottom: 14px; padding: 12px; background: rgba(233,69,96,0.08); border-radius: 10px; border: 1px solid rgba(233,69,96,0.2); }
.section-title .icon { font-size: 20px; }
.theory { background: var(--theory-bg); border-left: 3px solid var(--theory-border); border-radius: 0 8px 8px 0; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; line-height: 1.7; color: var(--text-dim); }

.speak-btn:active { transform: scale(0.92); }
.speak-btn.speaking { animation: pulse 0.8s ease-in-out infinite; background: rgba(233,69,96,0.3); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(233,69,96,0.4); } 50% { box-shadow: 0 0 0 10px rgba(233,69,96,0); } }
.options { display: flex; flex-direction: column; gap: 8px; }
.options.horizontal { flex-direction: row; justify-content: center; gap: 12px; }
.option-btn { background: rgba(255,255,255,0.06); border: 2px solid var(--border); border-radius: var(--btn-radius); padding: 14px 20px; font-size: 15px; color: var(--text); cursor: pointer; transition: all 0.2s ease; text-align: center; min-height: 48px; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
.option-btn:active { transform: scale(0.97); }

.option-btn.wrong { background: rgba(255,71,87,0.15); border-color: var(--wrong); color: var(--wrong); font-weight: 600; }
.option-btn:disabled { cursor: default; opacity: 0.7; }
.option-btn:disabled:active { transform: none; }
.option-btn .letter { font-weight: 700; margin-right: 8px; color: var(--text-dim); }
.option-btn.correct .letter { color: var(--correct); }
.option-btn.wrong .letter { color: var(--wrong); }

.results-detail { text-align: left; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

.result-item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; line-height: 1.5; }
.result-item .ri-q { color: var(--text-dim); margin-bottom: 4px; }

.result-item .ri-wrong { color: var(--wrong); font-weight: 600; text-decoration: line-through; margin-right: 8px; }
.restart-btn { background: linear-gradient(135deg, var(--accent), var(--accent-light)); border: none; border-radius: var(--btn-radius); padding: 16px 40px; font-size: 16px; font-weight: 700; color: white; cursor: pointer; margin-top: 20px; transition: all 0.2s ease; }
.restart-btn:active { transform: scale(0.97); }
.hidden { display: none; }
.speed-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 13px; color: var(--text-dim); cursor: pointer; transition: all 0.2s ease; }
.speed-btn:active { transform: scale(0.95); }
.speed-btn.active { background: rgba(233,69,96,0.2); border-color: var(--accent); color: var(--accent-light); font-weight: 600; }

const quizData = {"title": "Clothing & Fashion + Gerund vs Infinitive", "subtitle": "2026-08-28", "date": "2026-08-28", "phrase_of_the_day": "You're in luck", "phrase_translation": "Вам повезло (как раз есть то, что нужно)", "audio_url": "https://nataliastanislavovna.github.io/english-quiz/audio.mp3", "sections": [{"id": "s1", "title": "Vocabulary — Clothing & Fashion", "icon": "📚", "theory": "", "instruction": "", "questions": [{"id": "v1", "type": "choice", "sentence": "If a jacket 'fits' you, it...", "options": ["is the right size for you", "looks good on you", "is very expensive", "matches your shoes"], "correct": "is the right size for you", "explanation": "Fit - подходить по размеру (не жмёт, не велика). Suit - идти вам, красиво смотреться. The jacket fits, but the colour doesn't suit me - размер мой, но цвет не мой."}, {"id": "v2", "type": "choice", "sentence": "Which of these words means a fabric (material)?", "options": ["wool", "heel", "sleeve", "button"], "correct": "wool", "explanation": "Wool - шерсть, ткань (материал). Ещё ткани: cotton - хлопок, leather - кожа, silk - шёлк. Heel - каблук, sleeve - рукав, button - пуговица, это части одежды."}, {"id": "v3", "type": "choice", "sentence": "A customer says: 'I'm just browsing, thanks.' What does she mean?", "options": ["she is just looking around, not ready to buy yet", "she is in a hurry", "she wants a discount", "she has already paid"], "correct": "she is just looking around, not ready to buy yet", "explanation": "To browse - рассматривать, смотреть товары без цели купить прямо сейчас. Стандартный ответ на Can I help you? в магазине: I'm just browsing / I'm just looking, thanks."}, {"id": "v4", "type": "choice", "sentence": "A scarf, a belt and a hat are examples of...", "options": ["accessories", "footwear", "fabrics", "patterns"], "correct": "accessories", "explanation": "Accessories - аксессуары: шарф, ремень, шляпа, сумка. Footwear - обувь (trainers, high heels). Patterns - узоры (striped - в полоску, checked - в клетку, plain - однотонный)."}]}, {"id": "s2", "title": "Grammar — Gerund vs Infinitive", "icon": "📖", "theory": "", "instruction": "", "questions": [{"id": "g1", "type": "choice", "sentence": "It's cold in here. Would you mind ___ the window?", "options": ["closing", "to close", "close", "closed"], "correct": "closing", "explanation": "Mind + герундий (V-ing): Would you mind closing...? Не возражаете против того, чтобы закрыть? Так же: enjoy, avoid, suggest, keep + V-ing."}, {"id": "g2", "type": "choice", "sentence": "Sarah decided ___ the blue dress instead.", "options": ["to buy", "buying", "buy", "to buying"], "correct": "to buy", "explanation": "Decide + инфинитив (to + V1): decided to buy. Так же: want, hope, agree, afford, promise, learn + to do."}, {"id": "g3", "type": "choice", "sentence": "Remember ___ the receipt - you'll need it for a refund.", "options": ["to keep", "keeping", "keep", "to keeping"], "correct": "to keep", "explanation": "Remember TO DO - не забыть сделать (задача впереди). Remember DOING - помнить, что уже сделал (воспоминание). Remember to keep - не забудь сохранить чек."}, {"id": "g4", "type": "tf", "sentence": "The sentence 'I look forward to hear from you' is correct English.", "options": ["T", "F"], "correct": "F", "explanation": "Неверно. Look forward to + герундий: I look forward to HEARING from you. С industrials тут to - это предлог, а не часть инфинитива. То же с be used to doing."}]}, {"id": "s3", "title": "Practical — In a Clothes Shop", "icon": "💬", "theory": "", "instruction": "", "questions": [{"id": "p1", "type": "choice", "sentence": "A shop assistant asks: 'Can I help you?' You only want to look around. The natural reply is:", "options": ["I'm just looking, thanks.", "No, you can't.", "I don't need help of you.", "You help me nothing."], "correct": "I'm just looking, thanks.", "explanation": "I'm just looking, thanks - просто смотрю, спасибо. Вежливый и самый естественный ответ. Можно и I'm just browsing."}, {"id": "p2", "type": "choice", "sentence": "Your friend tries on a jacket, and it looks great on her. What do you say?", "options": ["That really suits you!", "That really fits your price!", "You are suiting this jacket!", "This jacket is wearing you well!"], "correct": "That really suits you!", "explanation": "That really suits you! - тебе очень идёт! Запомните конструкцию: something suits SOMEBODY. Не путайте с fit (подходить по размеру)."}]}, {"id": "s4", "title": "Challenge", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": "c1", "type": "choice", "sentence": "What is the difference between 'I stopped to buy a scarf' and 'I stopped buying scarves'?", "options": ["first: I paused my journey in order to buy a scarf; second: I no longer buy scarves at all", "first: I don't buy scarves anymore; second: I paused to buy one", "there is no difference at all", "first is about the future, second is about the present"], "correct": "first: I paused my journey in order to buy a scarf; second: I no longer buy scarves at all", "explanation": "Stop TO DO - остановиться, чтобы сделать что-то (цель). Stop DOING - перестать делать что-то вообще. То же с remember: remember to do (не забыть) vs remember doing (помнить, как делал)."}, {"id": "c2", "type": "choice", "sentence": "Sarah's old winter coat has seen better days. This means...", "options": ["it is old and worn out, it looks bad now", "it was very expensive", "it is her favourite thing", "it will be fashionable again soon"], "correct": "it is old and worn out, it looks bad now", "explanation": "Has seen better days - идиома: видывал и лучшие времена, то есть старый, изношенный. Ещё про одежду: worn out - изношенный (мои trainers wore out - стёрлись от долгой носки)."}]}, {"id": "s5", "title": "Listening Comprehension", "icon": "🎧", "theory": "", "instruction": "Listen to the audio, then answer the questions below.", "questions": [{"id": "l1", "type": "listen", "sentence": "Listen to the conversation in a clothes shop. What is Sarah shopping for?", "options": ["a dress to wear at her cousin's wedding", "a jacket for her new job", "shoes for a birthday party", "a gift for her cousin"], "correct": "a dress to wear at her cousin's wedding", "explanation": "Sarah говорит: This one is perfect. It's for my cousin's wedding - платье на свадьбу кузины.", "audio_text": "Emma(F): Hi there! Can I help you find anything?\nSarah(F): I'm just browsing, thanks. Actually... wait. That green dress in the window - do you have it in a size twelve?\nEmma(F): Let me check... you're in luck, there's one left on the rack. The fitting rooms are just over there.\nSarah(F): Thanks. If it doesn't fit, I'll try the blue one instead.\nEmma(F): Take your time. Oh, and everything on that rack is twenty percent off today.\nSarah(F): Twenty percent? Now that's what I call good timing.\nEmma(F): So... how did it go? Come out and let me see.\nSarah(F): What do you think? Be honest.\nEmma(F): Honestly? The colour really suits you. But the fit is a bit tight around the shoulders.\nSarah(F): I thought so too. It's beautiful, but I can barely raise my arms in it.\nEmma(F): Try the size up - same dress, more room. Better loose than uncomfortable, trust me.\nSarah(F): Good point... Yes! This one is perfect. It's for my cousin's wedding.\nEmma(F): Lovely occasion! And it's pure cotton, by the way - very light, perfect for dancing.\nSarah(F): Speaking of dancing, does this shop do refunds? Just in case my cousin hates it.\nEmma(F): A full refund within fourteen days with the receipt. But between you and me, nobody ever brings this dress back.\nSarah(F): Flattering and clever. You should get a commission.\nEmma(F): I work on smiles... but don't tell my manager I said that."}, {"id": "l2", "type": "listen", "sentence": "Listen again. What does Emma say about refunds?", "options": ["a full refund within fourteen days with the receipt", "no refunds at all in this shop", "a refund only if the dress is damaged", "a refund only for club members"], "correct": "a full refund within fourteen days with the receipt", "explanation": "Emma говорит: A full refund within fourteen days with the receipt - полный возврат в течение четырнадцати дней при наличии чека.", "audio_text": "Emma(F): Hi there! Can I help you find anything?\nSarah(F): I'm just browsing, thanks. Actually... wait. That green dress in the window - do you have it in a size twelve?\nEmma(F): Let me check... you're in luck, there's one left on the rack. The fitting rooms are just over there.\nSarah(F): Thanks. If it doesn't fit, I'll try the blue one instead.\nEmma(F): Take your time. Oh, and everything on that rack is twenty percent off today.\nSarah(F): Twenty percent? Now that's what I call good timing.\nEmma(F): So... how did it go? Come out and let me see.\nSarah(F): What do you think? Be honest.\nEmma(F): Honestly? The colour really suits you. But the fit is a bit tight around the shoulders.\nSarah(F): I thought so too. It's beautiful, but I can barely raise my arms in it.\nEmma(F): Try the size up - same dress, more room. Better loose than uncomfortable, trust me.\nSarah(F): Good point... Yes! This one is perfect. It's for my cousin's wedding.\nEmma(F): Lovely occasion! And it's pure cotton, by the way - very light, perfect for dancing.\nSarah(F): Speaking of dancing, does this shop do refunds? Just in case my cousin hates it.\nEmma(F): A full refund within fourteen days with the receipt. But between you and me, nobody ever brings this dress back.\nSarah(F): Flattering and clever. You should get a commission.\nEmma(F): I work on smiles... but don't tell my manager I said that."}]}]};
let answered = 0, totalQuestions = 0, answers = {}, sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(s => {
    if (!answers[s.id]) answers[s.id] = {};
    (s.questions || []).forEach(q => { totalQuestions++; answers[s.id][q.id] = null; });
  });
  renderAll(); updateProgress();
  // Fix: after audio ends, reset so it can be replayed
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function renderAll() {
  const c = document.getElementById('quizContent'); c.innerHTML = ''; let gq = 0;
  sectionData.forEach(sec => {
    let h = '<div class="section-card" id="section_' + sec.id + '">';
    h += '<div class="section-title"><span class="icon">' + (sec.icon||'📝') + '</span>' + esc(sec.title) + '</div>';
    if (sec.theory) h += '<div class="theory">' + fmtTheory(sec.theory) + '</div>';
    if (sec.instruction) h += '<div style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(sec.instruction) + '</div>';
    // Section-level audio: use pre-generated MP3 if available, else TTS fallback
    var secAudioTexts = [...new Set((sec.questions||[]).filter(q=>q.type==='listen'&&q.audio_text).map(q=>q.audio_text))];
    var secAudioUrl = quizData.audio_url || '';
    if (secAudioTexts.length > 0) {
      h += '<div class="section-audio">';
      if (secAudioUrl) {
        h += '<audio id="dialogAudio" controls preload="auto" style="width:100%;border-radius:10px;margin-bottom:6px;">';
        h += '<source src="' + secAudioUrl + '" type="audio/mpeg">';
        h += '</audio>';
        h += '<div style="margin-top:8px;display:flex;justify-content:center;gap:8px;align-items:center;">';
        h += '<span style="font-size:12px;color:var(--text-dim);">Скорость:</span>';
        h += '<button class="speed-btn" data-speed="0.5" onclick="setAudioSpeed(0.5,this)">🐢 0.5x</button>';
        h += '<button class="speed-btn" data-speed="0.75" onclick="setAudioSpeed(0.75,this)">0.75x</button>';
        h += '<button class="speed-btn active" data-speed="1" onclick="setAudioSpeed(1,this)">1x</button>';
        h += '</div>';
      } else {
        h += '<button class="speak-btn" data-audio-b64="' + btoa(unescape(encodeURIComponent(JSON.stringify(secAudioTexts)))) + '" onclick="speakSection(this)">🔊</button>';
      }
      h += '<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">Нажми Play, чтобы послушать диалог</div>';
      h += '</div>';
    }
    (sec.questions||[]).forEach(q => {
      gq++; h += '<div class="question-block"><div class="question-number">Вопрос ' + gq + '</div>';
      if (q.sentence) h += '<div class="sentence">' + fmtSent(q.sentence, sec.id, q.id, q.type) + '</div>';
      h += renderOpts(sec.id, q);
      if (q.explanation) h += '<div class="explanation" id="exp_'+sec.id+'_'+q.id+'">' + esc(q.explanation) + '</div>';
      h += '</div>';
    });
    h += '</div>'; c.insertAdjacentHTML('beforeend', h);
  });
}

function speakSection(btn) {
  const texts = JSON.parse(decodeURIComponent(escape(atob(btn.dataset.audioB64))));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn || texts.length === 0) return; btn.classList.add('speaking');
  const v = window.speechSynthesis.getVoices();
  const voice = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  let idx = 0;
  function next() {
    if (idx >= texts.length) { btn.classList.remove('speaking'); return; }
    const u = new SpeechSynthesisUtterance(texts[idx]); u.lang='en-US'; u.rate=0.85;
    if (voice) u.voice = voice;
    u.onend = () => { idx++; setTimeout(next, 400); };
    u.onerror = () => { btn.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function speak(btn) {
  const text = btn.dataset.audioText;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (!btn) return; btn.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
  const v = window.speechSynthesis.getVoices();
  const ev = v.find(x=>x.lang.startsWith('en')&&/female/i.test(x.name)) || v.find(x=>x.lang.startsWith('en-')) || v.find(x=>x.lang.startsWith('en'));
  if (ev) u.voice = ev;
  u.onend = () => btn.classList.remove('speaking');
  u.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) { window.speechSynthesis.getVoices(); if (window.speechSynthesis.onvoiceschanged!==undefined) { window.speechSynthesis.onvoiceschanged = function(){}; } }

function fmtTheory(t) { return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function fmtSent(s,sid,qid,type) { if(!s) return ''; if(type==='choice') return s.replace(/___+/g,'<span class="blank" id="blank_'+sid+'_'+qid+'">___</span>'); return esc(s); }

function renderOpts(sid, q) {
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type==='tf') return '<div class="options horizontal"><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="T" onclick="sel(this)">✓ True</button><button class="option-btn tf-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="F" onclick="sel(this)">✗ False</button></div>';
  if (q.type==='choice'||q.type==='listen') {
    let h='<div class="options">';
    var _opts = (q.options||[]).slice();
    for (var _i=_opts.length-1; _i>0; _i--) { var _j=Math.floor(Math.random()*(_i+1)); var _t=_opts[_i]; _opts[_i]=_opts[_j]; _opts[_j]=_t; }
    _opts.forEach((o,i) => { h+='<button class="option-btn" data-sec="'+sid+'" data-q="'+q.id+'" data-val="'+esc(o)+'" onclick="sel(this)"><span class="letter">'+L[i]+'</span>'+esc(o)+'</button>'; });
    return h+'</div>';
  }
  return '';
}

function sel(btn) {
  const sid=btn.dataset.sec, qid=btn.dataset.q, val=btn.dataset.val;
  if(answers[sid][qid]!==null) return;
  answers[sid][qid]=val; answered++;
  const sec=sectionData.find(s=>s.id===sid), q=sec.questions.find(x=>x.id==qid);
  const corr=String(q.correct), ok=val===corr;
  btn.parentElement.querySelectorAll('.option-btn').forEach(s => {
    s.disabled=true; if(s.dataset.val===corr) s.classList.add('correct'); if(s===btn&&!ok) s.classList.add('wrong');
  });
  const bl=document.getElementById('blank_'+sid+'_'+qid);
  if(bl) { bl.textContent=corr; bl.classList.add(ok?'filled':'wrong-fill'); }
  const ex=document.getElementById('exp_'+sid+'_'+qid); if(ex) ex.classList.add('visible');
  updateProgress();
  if(answered>=totalQuestions) setTimeout(showRes, 800);
}

function updateProgress() { document.getElementById('progressFill').style.width = (totalQuestions>0?(answered/totalQuestions*100):0)+'%'; }

function showRes() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  let ok=0, d='';
  sectionData.forEach(sec => {
    sec.questions.forEach(q => {
      const ua=answers[sec.id][q.id], cs=String(q.correct), isOK=ua===cs; if(isOK) ok++;
      d+='<div class="result-item"><div class="ri-q">'+esc(sec.title)+' — '+q.id+'</div>';
      if(q.sentence) d+='<div>'+esc(q.sentence.replace(/___+/g,cs))+'</div>';
      else if(q.options) d+='<div>'+esc(q.options.join(' / '))+'</div>';
      if(!isOK&&ua!==null) d+='<div><span class="ri-wrong">'+esc(ua)+'</span> <span class="ri-correct">'+esc(cs)+'</span></div>';
      if(isOK) d+='<div><span class="ri-correct">✓ '+esc(cs)+'</span></div>';
      if(q.explanation) d+='<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">'+esc(q.explanation)+'</div>';
      d+='</div>';
    });
  });
  const p=Math.round(ok/totalQuestions*100), el=document.getElementById('scoreDisplay');
  el.innerHTML=ok+'/'+totalQuestions+' <span class="pct">('+p+'%)</span>';
  el.className='score '+(p>=90?'excellent':p>=60?'good':'needs-work');
  let m=''; if(p>=90) m='🎉 Отлично!'; else if(p>=70) m='👍 Хороший результат!'; else if(p>=50) m='📚 Стоит повторить.'; else m='💪 Попробуй ещё раз!';
  document.getElementById('scoreMessage').textContent=m;
  document.getElementById('resultsDetail').innerHTML='<h3>Подробно</h3>'+d;
}

function restartQuiz() {
  answered=0; if(window.speechSynthesis) window.speechSynthesis.cancel();
  Object.keys(answers).forEach(k=>Object.keys(answers[k]).forEach(qk=>answers[k][qk]=null));
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll(); updateProgress(); window.scrollTo(0,0);
  // Re-attach audio ended handler after re-render
  var audioEl = document.getElementById('dialogAudio');
  if (audioEl) {
    audioEl.addEventListener('ended', function() {
      this.currentTime = 0;
      this.pause();
    });
  }
}

function setAudioSpeed(speed, btn) {
  const audio = document.getElementById('dialogAudio');
  if (audio) audio.playbackRate = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
init();
</script>
