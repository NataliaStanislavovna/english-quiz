<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Travel &amp; Transport — journeys, tickets, directions</title>
<style>
:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --accent: #e94560;
  --accent-light: #ff6b81;
  --correct: #2ed573;
  --wrong: #ff4757;
  --text: #eaeaea;
  --text-dim: #8892a4;
  --border: #2a3a5e;
  --btn-radius: 12px;
  --theory-bg: rgba(255,255,255,0.03);
  --theory-border: #3a4a6e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  -webkit-tap-highlight-color: transparent;
}

.container { max-width: 600px; margin: 0 auto; }

.header {
  text-align: center;
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.header h1 { font-size: 22px; font-weight: 700; color: var(--accent-light); }
.header .subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }

.phrase-box {
  background: linear-gradient(135deg, rgba(233,69,96,0.12), rgba(255,107,129,0.08));
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 16px;
  text-align: center;
}
.phrase-box .label { font-size: 11px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.phrase-box .phrase { font-size: 16px; font-weight: 600; font-style: italic; color: var(--text); }
.phrase-box .translation { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

.audio-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  text-align: center;
}
.audio-box .audio-label { font-size: 12px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.audio-box audio { width: 100%; max-width: 320px; height: 40px; border-radius: 8px; }

.progress-bar {
  width: 100%; height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin-bottom: 16px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}

.section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-title {
  font-size: 16px; font-weight: 700; color: var(--text);
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
  display: flex; align-items: center; gap: 8px;
}
.section-title .icon { font-size: 20px; }

.theory {
  background: var(--theory-bg);
  border-left: 3px solid var(--theory-border);
  border-radius: 0 8px 8px 0;
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-dim);
}
.theory strong { color: var(--text); font-weight: 600; }
.theory em { color: var(--accent-light); font-style: italic; }

.question-block {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.question-number {
  font-size: 12px; font-weight: 600;
  color: var(--accent-light);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.sentence {
  font-size: 15px; line-height: 1.7;
  margin-bottom: 14px;
  padding: 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 8px;
}

.blank {
  display: inline-block;
  min-width: 80px;
  border-bottom: 2px dashed var(--accent);
  margin: 0 4px;
  text-align: center;
  color: var(--accent-light);
  font-weight: 600;
}
.blank.filled { border-bottom-style: solid; color: var(--correct); }
.blank.wrong-fill { border-bottom-style: solid; color: var(--wrong); }

.options { display: flex; flex-direction: column; gap: 8px; }
.options.horizontal { flex-direction: row; justify-content: center; gap: 12px; }

.option-btn {
  background: rgba(255,255,255,0.06);
  border: 2px solid var(--border);
  border-radius: var(--btn-radius);
  padding: 14px 20px;
  font-size: 15px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  min-height: 48px;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
}
.option-btn:active { transform: scale(0.97); }
.option-btn.correct {
  background: rgba(46,213,115,0.15);
  border-color: var(--correct);
  color: var(--correct);
  font-weight: 600;
}
.option-btn.wrong {
  background: rgba(255,71,87,0.15);
  border-color: var(--wrong);
  color: var(--wrong);
  font-weight: 600;
}
.option-btn:disabled { cursor: default; opacity: 0.7; }
.option-btn:disabled:active { transform: none; }
.option-btn .letter { font-weight: 700; margin-right: 8px; color: var(--text-dim); }
.option-btn.correct .letter { color: var(--correct); }
.option-btn.wrong .letter { color: var(--wrong); }

.tf-btn {
  flex: 1; max-width: 140px;
  padding: 18px 24px;
  font-size: 18px; font-weight: 700;
  letter-spacing: 1px;
}

.explanation {
  margin-top: 10px;
  padding: 10px 12px;
  background: rgba(46,213,115,0.08);
  border-left: 3px solid var(--correct);
  border-radius: 0 8px 8px 0;
  font-size: 13px; line-height: 1.6;
  color: var(--text-dim);
  display: none;
}
.explanation.visible { display: block; }

.results {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  animation: fadeIn 0.5s ease;
}
.results .score { font-size: 48px; font-weight: 800; margin: 16px 0; }
.results .score .pct { font-size: 24px; color: var(--text-dim); }
.results .score.excellent { color: var(--correct); }
.results .score.good { color: var(--accent-light); }
.results .score.needs-work { color: var(--wrong); }
.results .message { font-size: 16px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }

.results-detail {
  text-align: left;
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.results-detail h3 {
  font-size: 14px; color: var(--text-dim);
  margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 1px;
}
.result-item {
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 14px; line-height: 1.5;
}
.result-item .ri-q { color: var(--text-dim); margin-bottom: 4px; }
.result-item .ri-correct { color: var(--correct); font-weight: 600; }
.result-item .ri-wrong { color: var(--wrong); font-weight: 600; text-decoration: line-through; margin-right: 8px; }

.restart-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  border: none; border-radius: var(--btn-radius);
  padding: 16px 40px;
  font-size: 16px; font-weight: 700;
  color: white; cursor: pointer;
  margin-top: 20px;
  transition: all 0.2s ease;
}
.restart-btn:active { transform: scale(0.97); }

.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Travel &amp; Transport — journeys, tickets, directions</h1>
    <div class="subtitle">2026-07-22</div>
  </div>
  <div class="phrase-box">
<div class="label">💡 Фраза дня</div>
<div class="phrase">Could you tell me how to get to the train station?</div>
<div class="translation">Не подскажете, как добраться до вокзала?</div>
</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quizContent"></div>
  <div class="results hidden" id="results">
    <div style="font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;">Результат</div>
    <div class="score" id="scoreDisplay"></div>
    <div class="message" id="scoreMessage"></div>
    <div class="results-detail" id="resultsDetail"></div>
    <button class="restart-btn" onclick="restartQuiz()">Пройти ещё раз</button>
  </div>
</div>
<script>
const quizData = {"title": "Travel & Transport — journeys, tickets, directions", "subtitle": "2026-07-22", "date": "2026-07-22", "phrase_of_the_day": "Could you tell me how to get to the train station?", "phrase_translation": "Не подскажете, как добраться до вокзала?", "audio_url": "https://nataliastanislavovna.github.io/english-quiz/audio.mp3", "sections": [{"id": "s1", "title": "Vocabulary: Travel basics", "icon": "✏️", "theory": "Слова в путешествиях: **journey** (путешествие/поездка), **destination** (пункт назначения), **departure** (отправление), **arrival** (прибытие), **luggage / baggage** (багаж), **passport** (паспорт), **boarding pass** (посадочный талон), **gate** (выход/гейт), **aisle seat** (место у прохода), **window seat** (место у окна).", "instruction": "", "questions": [{"id": 1, "type": "choice", "sentence": "When you arrive at the airport, you go to the check-in desk to get your ___.", "options": ["boarding pass", "passport", "destination", "luggage"], "correct": "boarding pass", "explanation": "«Boarding pass» = посадочный талон. Вы получаете его на регистрации (check-in), и он нужен для посадки на самолёт. «Passport» = паспорт (у вас уже должен быть). «Destination» = пункт назначения. «Luggage» = багаж (вы его сдаёте, не получаете)."}, {"id": 2, "type": "fill", "sentence": "Our ___ is Rome, but we have a short stop in Frankfurt first.", "options": ["destination", "departure", "journey", "aisle"], "correct": "destination", "explanation": "«Destination» = конечный пункт назначения (Рим). «Departure» = отправление (откуда летите). «Journey» = вся поездка. Остановка по пути = «stopover» или «layover», но конечная цель — destination."}, {"id": 3, "type": "tf", "sentence": "\"Departure\" means when a plane, train or bus leaves, and \"arrival\" means when it gets to its stop.", "options": ["T", "F"], "correct": "T", "explanation": "Верно! «Departure» = отправление (выезд), «arrival» = прибытие (приезд). На вокзалах и в аэропортах вы увидите табло «Departures» (вылеты) и «Arrivals» (прилёты)."}]}, {"id": "s2", "title": "Vocabulary: Getting around town", "icon": "✏️", "theory": "Транспорт в городе: **bus stop** (автобусная остановка), **tube / underground / subway** (метро), **train station** (вокзал), **taxi rank** (стоянка такси), **fare** (плата за проезд), **single ticket** (билет в одну сторону), **return ticket / round trip** (билет туда и обратно), **rush hour** (час пик), **delay** (задержка).", "instruction": "", "questions": [{"id": 4, "type": "choice", "sentence": "If you want to travel to London and come back the same day, you should buy a ___.", "options": ["return ticket", "single ticket", "boarding pass", "passport"], "correct": "return ticket", "explanation": "«Return ticket» (британский) или «round trip» (американский) = билет туда и обратно. «Single ticket» = только туда (в одну сторону). Для поездки туда-обратно нужен return ticket — он обычно дешевле, чем два отдельных single."}, {"id": 5, "type": "fill", "sentence": "The bus was late because of heavy traffic during ___ hour.", "options": ["rush", "arrival", "check-in", "departure"], "correct": "rush", "explanation": "«Rush hour» = час пик (утром и вечером, когда все едут на работу и обратно). В это время транспорт задерживается из-за пробок (heavy traffic). Не путайте с «check-in hour» — такого выражения нет."}, {"id": 6, "type": "tf", "sentence": "\"The tube\" is the British English word for the underground railway system in a city.", "options": ["T", "F"], "correct": "T", "explanation": "Верно! «The tube» = лондонское метро (так называют из-за формы тоннелей). В США говорят «the subway», общее слово — «the underground» / «metro»."}]}, {"id": "s3", "title": "Grammar: Directions & prepositions", "icon": "✏️", "theory": "Направления и предлоги: **turn left / turn right** (поверните налево/направо), **go straight** (идите прямо), **go past** (пройдите мимо), **opposite** (напротив), **next to** (рядом с), **between** (между), **at the corner** (на углу), **on the corner** (на углу здания), **across from** (через дорогу от).", "instruction": "", "questions": [{"id": 7, "type": "choice", "sentence": "The bank is ___ the post office and the supermarket.", "options": ["between", "opposite", "next", "across"], "correct": "between", "explanation": "«Between A and B» = между А и Б. Банк находится между почтой и супермаркетом. «Opposite» = напротив (одно здание напротив другого). «Next to» = рядом (одно здание рядом с другим)."}, {"id": 8, "type": "fill", "sentence": "Go straight for two blocks, then ___ right at the traffic lights.", "options": ["turn", "go", "walk", "arrive"], "correct": "turn", "explanation": "«Turn right» = поверните направо. «Turn left» = поверните налево. Это стандартная фраза для указания направления. «Go right» тоже возможно, но «turn right» — наиболее естественное выражение."}, {"id": 9, "type": "tf", "sentence": "If someone says \"It's on the corner\", they mean the place is inside the corner of a building.", "options": ["T", "F"], "correct": "F", "explanation": "Нет! «On the corner» = на углу (здание находится на углу улицы, на пересечении). Это наружное расположение, не внутри. Пример: «The café is on the corner of High Street and Park Road» = кафе на углу Хай-стрит и Парк-роуд."}]}, {"id": "s4", "title": "Listening: At the train station", "icon": "🎧", "theory": "", "instruction": "", "questions": [{"id": 10, "type": "listen", "sentence": "Listen and answer: What time does the train to Manchester leave?", "options": ["Quarter past two", "Half past two", "Two o'clock", "Quarter to two"], "correct": "Quarter past two", "explanation": "Кассир говорит: «The next one is at quarter past two» = следующий поезд в четверть третьего (14:15). «Quarter past» = 15 минут после часа. «Half past» = 30 минут (половина).", "audio_text": "Excuse me, could you tell me what time the next train to Manchester is, please? Let me check for you. The next one is at quarter past two, platform six. And how long does it take? About two and a half hours. Is it direct? Yes, it's a direct train, no changes. Great. And what's a return ticket? Standard class is forty-five pounds, first class is seventy pounds. I'll take a standard return, please. That's forty-five pounds. Cash or card? Card, please. Here's your ticket. Have a good journey!"}, {"id": 11, "type": "listen", "sentence": "Listen and answer: Which platform does the Manchester train leave from?", "options": ["Platform 6", "Platform 4", "Platform 8", "Platform 2"], "correct": "Platform 6", "explanation": "Кассир говорит: «at quarter past two, platform six» = в четверть третьего, платформа шесть. В британских вокзалах говорят «platform», а не «track» (track — американский вариант).", "audio_text": "Excuse me, could you tell me what time the next train to Manchester is, please? Let me check for you. The next one is at quarter past two, platform six. And how long does it take? About two and a half hours. Is it direct? Yes, it's a direct train, no changes. Great. And what's a return ticket? Standard class is forty-five pounds, first class is seventy pounds. I'll take a standard return, please. That's forty-five pounds. Cash or card? Card, please. Here's your ticket. Have a good journey!"}, {"id": 12, "type": "listen", "sentence": "Listen and answer: How much is a standard class return ticket?", "options": ["£45", "£70", "£40", "£55"], "correct": "£45", "explanation": "Кассир говорит: «Standard class is forty-five pounds» = стандартный класс стоит 45 фунтов. First class стоит 70 фунтов, но пассажир выбирает standard (более дешёвый).", "audio_text": "Excuse me, could you tell me what time the next train to Manchester is, please? Let me check for you. The next one is at quarter past two, platform six. And how long does it take? About two and a half hours. Is it direct? Yes, it's a direct train, no changes. Great. And what's a return ticket? Standard class is forty-five pounds, first class is seventy pounds. I'll take a standard return, please. That's forty-five pounds. Cash or card? Card, please. Here's your ticket. Have a good journey!"}]}]};

let answered = 0;
let totalQuestions = 0;
let answers = {};
let sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(section => {
    if (!answers[section.id]) answers[section.id] = {};
    (section.questions || []).forEach(q => {
      totalQuestions++;
      answers[section.id][q.id] = null;
    });
  });
  renderAll();
  updateProgress();
}

function renderAll() {
  const container = document.getElementById('quizContent');
  container.innerHTML = '';
  let globalQ = 0;
  sectionData.forEach(section => {
    let html = '<div class="section-card" id="section_' + section.id + '">';

    // Section title
    html += '<div class="section-title"><span class="icon">' + (section.icon || '📝') + '</span>' + esc(section.title) + '</div>';

    // Audio player INSIDE this section if it has listen questions
    const hasListen = (section.questions || []).some(q => q.type === 'listen');
    if (hasListen && quizData.audio_url) {
      html += '<div class="audio-box">';
      html += '<div class="audio-label">🎧 Listen to the dialogue</div>';
      html += '<audio controls preload="none"><source src="' + esc(quizData.audio_url) + '">Your browser does not support audio.</audio>';
      html += '</div>';
    }

    // Theory BEFORE questions
    if (section.theory) {
      html += '<div class="theory">' + formatTheory(section.theory) + '</div>';
    }

    // Instruction
    if (section.instruction) {
      html += '<div class="instruction" style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(section.instruction) + '</div>';
    }

    // Questions
    (section.questions || []).forEach(q => {
      globalQ++;
      html += '<div class="question-block">';
      html += '<div class="question-number">Вопрос ' + globalQ + '</div>';
      if (q.sentence) {
        html += '<div class="sentence">' + formatSentence(q.sentence, section.id, q.id, q.type) + '</div>';
      }
      html += renderOptions(section.id, q);
      if (q.explanation) {
        html += '<div class="explanation" id="exp_' + section.id + '_' + q.id + '">' + esc(q.explanation) + '</div>';
      }
      html += '</div>';
    });

    html += '</div>';
    container.insertAdjacentHTML('beforeend', html);
  });
}

function formatTheory(text) {
  // Support **bold** and *italic* in theory text
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function formatSentence(sentence, secId, qId, type) {
  if (!sentence) return '';
  if (type === 'fill' || type === 'choice') {
    return sentence.replace(/___+/g, '<span class="blank" id="blank_' + secId + '_' + qId + '">___</span>');
  }
  return esc(sentence);
}

function renderOptions(secId, q) {
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type === 'tf') {
    return '<div class="options horizontal">' +
      '<button class="option-btn tf-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="T" onclick="selectOption(this)">✓ True</button>' +
      '<button class="option-btn tf-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="F" onclick="selectOption(this)">✗ False</button>' +
      '</div>';
  }
  if (q.type === 'choice' || q.type === 'fill' || q.type === 'select' || q.type === 'listen') {
    let html = '<div class="options">';
    (q.options || []).forEach((opt, i) => {
      html += '<button class="option-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="' + esc(opt) + '" onclick="selectOption(this)">' +
        '<span class="letter">' + letters[i] + '</span>' + esc(opt) + '</button>';
    });
    html += '</div>';
    return html;
  }
  return '';
}

function selectOption(btn) {
  const secId = btn.dataset.sec;
  const qId = btn.dataset.q;
  const val = btn.dataset.val;

  if (answers[secId][qId] !== null) return;

  answers[secId][qId] = val;
  answered++;

  const section = sectionData.find(s => s.id === secId);
  const question = section.questions.find(q => q.id == qId);
  const correct = question.correct;
  const isCorrect = val === correct;

  const siblings = btn.parentElement.querySelectorAll('.option-btn');
  siblings.forEach(s => {
    s.disabled = true;
    if (s.dataset.val === correct) s.classList.add('correct');
    if (s === btn && !isCorrect) s.classList.add('wrong');
  });

  const blank = document.getElementById('blank_' + secId + '_' + qId);
  if (blank) {
    blank.textContent = correct;
    blank.classList.add(isCorrect ? 'filled' : 'wrong-fill');
  }

  const exp = document.getElementById('exp_' + secId + '_' + qId);
  if (exp) exp.classList.add('visible');

  updateProgress();

  if (answered >= totalQuestions) {
    setTimeout(showResults, 800);
  }
}

function updateProgress() {
  const pct = totalQuestions > 0 ? (answered / totalQuestions * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function showResults() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');

  let correct = 0;
  let detailsHtml = '';

  sectionData.forEach(section => {
    section.questions.forEach(q => {
      const userAnswer = answers[section.id][q.id];
      const isCorrect = userAnswer === q.correct;
      if (isCorrect) correct++;

      detailsHtml += '<div class="result-item">';
      detailsHtml += '<div class="ri-q">' + esc(section.title) + ' — Вопрос ' + q.id + '</div>';
      if (q.sentence) {
        detailsHtml += '<div>' + esc(q.sentence.replace(/___+/g, q.correct)) + '</div>';
      } else {
        detailsHtml += '<div>' + esc(q.options ? q.options.join(' / ') : '') + '</div>';
      }
      if (!isCorrect && userAnswer !== null) {
        detailsHtml += '<div><span class="ri-wrong">' + esc(userAnswer) + '</span><span class="ri-correct">' + esc(q.correct) + '</span></div>';
      }
      if (isCorrect) {
        detailsHtml += '<div><span class="ri-correct">✓ ' + esc(q.correct) + '</span></div>';
      }
      if (q.explanation) {
        detailsHtml += '<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">' + esc(q.explanation) + '</div>';
      }
      detailsHtml += '</div>';
    });
  });

  const pct = Math.round(correct / totalQuestions * 100);
  const scoreEl = document.getElementById('scoreDisplay');
  scoreEl.textContent = correct + '/' + totalQuestions + ' ';
  scoreEl.innerHTML += '<span class="pct">(' + pct + '%)</span>';
  scoreEl.className = 'score ' + (pct >= 90 ? 'excellent' : pct >= 60 ? 'good' : 'needs-work');

  let msg = '';
  if (pct >= 90) msg = '🎉 Отлично! Великолепная работа!';
  else if (pct >= 70) msg = '👍 Хороший результат! Ещё немного практики.';
  else if (pct >= 50) msg = '📚 Неплохо, но стоит повторить материал.';
  else msg = '💪 Не расстраивайся! Повтори тему и попробуй ещё раз.';
  document.getElementById('scoreMessage').textContent = msg;

  document.getElementById('resultsDetail').innerHTML = '<h3>Подробно</h3>' + detailsHtml;
}

function restartQuiz() {
  answered = 0;
  Object.keys(answers).forEach(k => {
    Object.keys(answers[k]).forEach(qk => answers[k][qk] = null);
  });
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll();
  updateProgress();
  window.scrollTo(0, 0);
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>

</html>
