<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Second Conditional — unlikely situations, dreams, hypothetical scenarios</title>
<style>
:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --accent: #e94560;
  --accent-light: #ff6b81;
  --correct: #2ed573;
  --wrong: #ff4757;
  --text: #eaeaea;
  --text-dim: #8892a4;
  --border: #2a3a5e;
  --btn-radius: 12px;
  --theory-bg: rgba(255,255,255,0.03);
  --theory-border: #3a4a6e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  -webkit-tap-highlight-color: transparent;
}

.container { max-width: 600px; margin: 0 auto; }

.header {
  text-align: center;
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.header h1 { font-size: 22px; font-weight: 700; color: var(--accent-light); }
.header .subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }

.phrase-box {
  background: linear-gradient(135deg, rgba(233,69,96,0.12), rgba(255,107,129,0.08));
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 16px;
  text-align: center;
}
.phrase-box .label { font-size: 11px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.phrase-box .phrase { font-size: 16px; font-weight: 600; font-style: italic; color: var(--text); }
.phrase-box .translation { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

.audio-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  text-align: center;
}
.audio-box .audio-label { font-size: 12px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.audio-box audio { width: 100%; max-width: 320px; height: 40px; border-radius: 8px; }

.progress-bar {
  width: 100%; height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin-bottom: 16px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}

.section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-title {
  font-size: 16px; font-weight: 700; color: var(--text);
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
  display: flex; align-items: center; gap: 8px;
}
.section-title .icon { font-size: 20px; }

.theory {
  background: var(--theory-bg);
  border-left: 3px solid var(--theory-border);
  border-radius: 0 8px 8px 0;
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-dim);
}
.theory strong { color: var(--text); font-weight: 600; }
.theory em { color: var(--accent-light); font-style: italic; }

.question-block {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.question-number {
  font-size: 12px; font-weight: 600;
  color: var(--accent-light);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.sentence {
  font-size: 15px; line-height: 1.7;
  margin-bottom: 14px;
  padding: 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 8px;
}

.blank {
  display: inline-block;
  min-width: 80px;
  border-bottom: 2px dashed var(--accent);
  margin: 0 4px;
  text-align: center;
  color: var(--accent-light);
  font-weight: 600;
}
.blank.filled { border-bottom-style: solid; color: var(--correct); }
.blank.wrong-fill { border-bottom-style: solid; color: var(--wrong); }

.options { display: flex; flex-direction: column; gap: 8px; }
.options.horizontal { flex-direction: row; justify-content: center; gap: 12px; }

.option-btn {
  background: rgba(255,255,255,0.06);
  border: 2px solid var(--border);
  border-radius: var(--btn-radius);
  padding: 14px 20px;
  font-size: 15px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  min-height: 48px;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
}
.option-btn:active { transform: scale(0.97); }
.option-btn.correct {
  background: rgba(46,213,115,0.15);
  border-color: var(--correct);
  color: var(--correct);
  font-weight: 600;
}
.option-btn.wrong {
  background: rgba(255,71,87,0.15);
  border-color: var(--wrong);
  color: var(--wrong);
  font-weight: 600;
}
.option-btn:disabled { cursor: default; opacity: 0.7; }
.option-btn:disabled:active { transform: none; }
.option-btn .letter { font-weight: 700; margin-right: 8px; color: var(--text-dim); }
.option-btn.correct .letter { color: var(--correct); }
.option-btn.wrong .letter { color: var(--wrong); }

.tf-btn {
  flex: 1; max-width: 140px;
  padding: 18px 24px;
  font-size: 18px; font-weight: 700;
  letter-spacing: 1px;
}

.explanation {
  margin-top: 10px;
  padding: 10px 12px;
  background: rgba(46,213,115,0.08);
  border-left: 3px solid var(--correct);
  border-radius: 0 8px 8px 0;
  font-size: 13px; line-height: 1.6;
  color: var(--text-dim);
  display: none;
}
.explanation.visible { display: block; }

.results {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  animation: fadeIn 0.5s ease;
}
.results .score { font-size: 48px; font-weight: 800; margin: 16px 0; }
.results .score .pct { font-size: 24px; color: var(--text-dim); }
.results .score.excellent { color: var(--correct); }
.results .score.good { color: var(--accent-light); }
.results .score.needs-work { color: var(--wrong); }
.results .message { font-size: 16px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }

.results-detail {
  text-align: left;
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.results-detail h3 {
  font-size: 14px; color: var(--text-dim);
  margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 1px;
}
.result-item {
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 14px; line-height: 1.5;
}
.result-item .ri-q { color: var(--text-dim); margin-bottom: 4px; }
.result-item .ri-correct { color: var(--correct); font-weight: 600; }
.result-item .ri-wrong { color: var(--wrong); font-weight: 600; text-decoration: line-through; margin-right: 8px; }

.restart-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  border: none; border-radius: var(--btn-radius);
  padding: 16px 40px;
  font-size: 16px; font-weight: 700;
  color: white; cursor: pointer;
  margin-top: 20px;
  transition: all 0.2s ease;
}
.restart-btn:active { transform: scale(0.97); }

.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Second Conditional — unlikely situations, dreams, hypothetical scenarios</h1>
    <div class="subtitle">2026-07-07</div>
  </div>
  <div class="phrase-box">
<div class="label">💡 Фраза дня</div>
<div class="phrase">If I were you, I would...</div>
<div class="translation">На твоём месте я бы...</div>
</div>
  <div class="audio-box"><div class="audio-label">🎧 Listen to the dialogue</div><audio controls preload="none"><source src="https://nataliastanislavovna.github.io/english-quiz/audio.mp3">Your browser does not support audio.</audio></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quizContent"></div>
  <div class="results hidden" id="results">
    <div style="font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;">Результат</div>
    <div class="score" id="scoreDisplay"></div>

</div>
<script>
const quizData = {"title": "Second Conditional — unlikely situations, dreams, hypothetical scenarios", "subtitle": "2026-07-07", "date": "2026-07-07", "phrase_of_the_day": "If I were you, I would...", "phrase_translation": "На твоём месте я бы...", "audio_url": "https://nataliastanislavovna.github.io/english-quiz/audio.mp3", "sections": [{"id": "s1", "title": "Grammar: Second Conditional — Form & Meaning", "icon": "✏️", "theory": "Second Conditional описывает нереальные или маловероятные ситуации в настоящем/будущем. Структура: If + Past Simple, ... would + infinitive. Пример: If I had a car, I would drive to work. Важное исключение: глагол to be в условии всегда «were» для всех лиц: If I were..., If she were... (хотя в разговорной речи «was» тоже встречается).", "instruction": "", "questions": [{"id": 1, "type": "choice", "sentence": "Choose the correct Second Conditional sentence:", "options": ["If I have more time, I would learn French.", "If I had more time, I would learn French.", "If I would have more time, I learn French.", "If I had more time, I will learn French."], "correct": "If I had more time, I would learn French.", "explanation": "В Second Conditional после If ставим Past Simple (had), а в главной части — would + инфинитив. «If I had..., I would learn...» = Если бы у меня было больше времени, я бы учил французский."}, {"id": 2, "type": "fill", "sentence": "If she ___ a million dollars, she would buy a house near the ocean.", "options": ["has", "had", "would have", "is having"], "correct": "had", "explanation": "В условии (после If) нужен Past Simple: had. «If she had a million dollars, she would buy a house» = Если бы у неё был миллион долларов, она бы купила дом у океана."}, {"id": 3, "type": "tf", "sentence": "«If I were the boss, I would give everyone Fridays off.» — This sentence is grammatically correct.", "options": ["True", "False"], "correct": "True", "explanation": "В Second Conditional глагол to be в условии берёт форму «were» для всех лиц: «If I were...» — это правильно. «If I was...» тоже допустимо в разговорной речи, но «were» — более грамматически корректный вариант."}]}, {"id": "s2", "title": "Vocabulary: Dream Jobs & Life Situations", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": 4, "type": "choice", "sentence": "Which phrase means «устроиться на работу мечты»?", "options": ["Get your dream job", "Find your nightmare job", "Do your dream homework", "Make your dream work"], "correct": "Get your dream job", "explanation": "Dream job = работа мечты. «Get your dream job» = получить работу мечты. Nightmare = кошмар (nightmare job = ужасная работа)."}, {"id": 5, "type": "fill", "sentence": "If I could ___ anywhere in the world, I would choose a warm country near the sea.", "options": ["live", "living", "lived", "to live"], "correct": "live", "explanation": "После could (can в прошедшем) нужен инфинитив без to: could live. «If I could live anywhere...» = Если бы я мог жить где угодно..."}, {"id": 6, "type": "choice", "sentence": "What does «early bird» mean in the context of daily routines?", "options": ["A person who goes to bed very late", "A person who wakes up early and is active in the morning", "A type of breakfast food", "A person who arrives early to meetings"], "correct": "A person who wakes up early and is active in the morning", "explanation": "Early bird = жаворонок (человек, который рано встаёт и рано начинает день). Противоположность — night owl (сова). Устойчивое выражение: The early bird catches the worm."}]}, {"id": "s3", "title": "Grammar: If I were you — giving hypothetical advice", "icon": "✏️", "theory": "Формула «If I were you, I would...» — стандартный способ дать совет, представив себя на месте собеседника. Это более мягкая и вежливая форма совета, чем «You should...». Пример: If I were you, I would talk to the manager.", "instruction": "", "questions": [{"id": 7, "type": "fill", "sentence": "If I ___ you, I would accept that job offer — the salary is great and the office is close to home.", "options": ["am", "was", "were", "be"], "correct": "were", "explanation": "В выражении «If I were you» всегда используется «were» — это фиксированная фраза для hypothetical advice. «If I were you, I would accept...» = На твоём месте я бы приняла..."}, {"id": 8, "type": "choice", "sentence": "Which sentence gives a hypothetical advice more politely?", "options": ["You should quit your job immediately.", "If I were you, I would think about it before quitting.", "You must quit your job right now.", "Quit your job or you'll regret it."], "correct": "If I were you, I would think about it before quitting.", "explanation": "«If I were you, I would...» звучит мягче, чем «You should/must...». Это не прямой приказ, а предложение поставить себя на место другого человека."}]}, {"id": "s4", "title": "Grammar: First vs Second Conditional", "icon": "✏️", "theory": "First Conditional = реальные/вероятные ситуации: If it rains tomorrow, I will stay home. Second Conditional = нереальные/маловероятные: If I won the lottery, I would travel the world. Разница: will (First) vs would (Second); Present Simple после If (First) vs Past Simple после If (Second).", "instruction": "", "questions": [{"id": 9, "type": "tf", "sentence": "«If she studied harder, she would pass the exam.» — This is Second Conditional because passing the exam is unlikely in this situation.", "options": ["True", "False"], "correct": "True", "explanation": "Правильно — это Second Conditional (studied = Past Simple после If, would pass = would + инфинитив). Подразумевается, что она НЕ учится усердно, поэтому сдача экзамена маловероятна. First Conditional был бы: If she studies harder, she will pass."}]}, {"id": "s5", "title": "Listening: Hypothetical Situations", "icon": "🎧", "theory": "", "instruction": "", "questions": [{"id": 10, "type": "listen", "sentence": "Listen to the dialogue and answer: What would Mark do if he had more free time?", "options": ["Learn to play the guitar", "Learn to play the piano", "Travel to Japan immediately", "Start taking piano lessons again"], "correct": "Learn to play the piano", "explanation": "«If I had more free time, I would definitely learn to play the piano» = Если бы у него было больше свободного времени, он бы научился играть на пианино.", "audio_text": "So Mark, if you had more free time, what would you do? — That's a good question. If I had more free time, I would definitely learn to play the piano. I took lessons as a kid but gave up after a year. — Really? I didn't know that. What else? — I would also travel more. There are so many countries I haven't visited yet. I'd love to go to Japan and try authentic sushi. — That sounds amazing! Maybe next year we could go together?"}, {"id": 11, "type": "listen", "sentence": "Listen again and answer: Which country does Mark dream of visiting?", "options": ["Italy", "China", "France", "Japan"], "correct": "Japan", "explanation": "«I'd love to go to Japan and try authentic sushi» = Он мечтает поехать в Японию и попробовать настоящие суши.", "audio_text": "So Mark, if you had more free time, what would you do? — That's a good question. If I had more free time, I would definitely learn to play the piano. I took lessons as a kid but gave up after a year. — Really? I didn't know that. What else? — I would also travel more. There are so many countries I haven't visited yet. I'd love to go to Japan and try authentic sushi. — That sounds amazing! Maybe next year we could go together?"}]}, {"id": "s6", "title": "Vocabulary: Hypothetical Expressions", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": 12, "type": "choice", "sentence": "Which expression means «в идеальном мире / если бы всё было идеально»?", "options": ["In a perfect world", "In the real world", "On another planet", "In the best way"], "correct": "In a perfect world", "explanation": "«In a perfect world» = в идеальном мире (часто используется с Second Conditional: In a perfect world, I would work four days a week). Это устойчивое выражение для описания гипотетических желаний."}]}]};

let answered = 0;
let totalQuestions = 0;
let answers = {};
let sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(section => {
    if (!answers[section.id]) answers[section.id] = {};
    (section.questions || []).forEach(q => {
      totalQuestions++;
      answers[section.id][q.id] = null;
    });
  });
  renderAll();
  updateProgress();
}

function renderAll() {
  const container = document.getElementById('quizContent');
  container.innerHTML = '';
  let globalQ = 0;
  sectionData.forEach(section => {
    let html = '<div class="section-card" id="section_' + section.id + '">';

    // Section title
    html += '<div class="section-title"><span class="icon">' + (section.icon || '📝') + '</span>' + esc(section.title) + '</div>';

    // Theory BEFORE questions
    if (section.theory) {
      html += '<div class="theory">' + formatTheory(section.theory) + '</div>';
    }

    // Instruction
    if (section.instruction) {
      html += '<div class="instruction" style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(section.instruction) + '</div>';
    }

    // Questions
    (section.questions || []).forEach(q => {
      globalQ++;
      html += '<div class="question-block">';
      html += '<div class="question-number">Вопрос ' + globalQ + '</div>';
      if (q.sentence) {
        html += '<div class="sentence">' + formatSentence(q.sentence, section.id, q.id, q.type) + '</div>';
      }
      html += renderOptions(section.id, q);
      if (q.explanation) {
        html += '<div class="explanation" id="exp_' + section.id + '_' + q.id + '">' + esc(q.explanation) + '</div>';
      }
      html += '</div>';
    });

    html += '</div>';
    container.insertAdjacentHTML('beforeend', html);
  });
}

function formatTheory(text) {
  // Support **bold** and *italic* in theory text
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function formatSentence(sentence, secId, qId, type) {
  if (!sentence) return '';
  if (type === 'fill' || type === 'choice') {
    return sentence.replace(/___+/g, '<span class="blank" id="blank_' + secId + '_' + qId + '">___</span>');
  }
  return esc(sentence);
}

function renderOptions(secId, q) {
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type === 'tf') {
    return '<div class="options horizontal">' +
      '<button class="option-btn tf-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="T" onclick="selectOption(this)">✓ True</button>' +
      '<button class="option-btn tf-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="F" onclick="selectOption(this)">✗ False</button>' +
      '</div>';
  }
  if (q.type === 'choice' || q.type === 'fill' || q.type === 'select' || q.type === 'listen') {
    let html = '<div class="options">';
    (q.options || []).forEach((opt, i) => {
      html += '<button class="option-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="' + esc(opt) + '" onclick="selectOption(this)">' +
        '<span class="letter">' + letters[i] + '</span>' + esc(opt) + '</button>';
    });
    html += '</div>';
    return html;
  }
  return '';
}

function selectOption(btn) {
  const secId = btn.dataset.sec;
  const qId = btn.dataset.q;
  const val = btn.dataset.val;

  if (answers[secId][qId] !== null) return;

  answers[secId][qId] = val;
  answered++;

  const section = sectionData.find(s => s.id === secId);
  const question = section.questions.find(q => q.id == qId);
  const correct = question.correct;
  const isCorrect = val === correct;

  const siblings = btn.parentElement.querySelectorAll('.option-btn');
  siblings.forEach(s => {
    s.disabled = true;
    if (s.dataset.val === correct) s.classList.add('correct');
    if (s === btn && !isCorrect) s.classList.add('wrong');
  });

  const blank = document.getElementById('blank_' + secId + '_' + qId);
  if (blank) {
    blank.textContent = correct;
    blank.classList.add(isCorrect ? 'filled' : 'wrong-fill');
  }

  const exp = document.getElementById('exp_' + secId + '_' + qId);
  if (exp) exp.classList.add('visible');

  updateProgress();

  if (answered >= totalQuestions) {
    setTimeout(showResults, 800);
  }
}

function updateProgress() {
  const pct = totalQuestions > 0 ? (answered / totalQuestions * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function showResults() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');

  let correct = 0;
  let detailsHtml = '';

  sectionData.forEach(section => {
    section.questions.forEach(q => {
      const userAnswer = answers[section.id][q.id];
      const isCorrect = userAnswer === q.correct;
      if (isCorrect) correct++;

      detailsHtml += '<div class="result-item">';
      detailsHtml += '<div class="ri-q">' + esc(section.title) + ' — Вопрос ' + q.id + '</div>';
      if (q.sentence) {
        detailsHtml += '<div>' + esc(q.sentence.replace(/___+/g, q.correct)) + '</div>';
      } else {
        detailsHtml += '<div>' + esc(q.options ? q.options.join(' / ') : '') + '</div>';
      }
      if (!isCorrect && userAnswer !== null) {
        detailsHtml += '<div><span class="ri-wrong">' + esc(userAnswer) + '</span><span class="ri-correct">' + esc(q.correct) + '</span></div>';
      }
      if (isCorrect) {
        detailsHtml += '<div><span class="ri-correct">✓ ' + esc(q.correct) + '</span></div>';
      }
      if (q.explanation) {
        detailsHtml += '<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">' + esc(q.explanation) + '</div>';
      }
      detailsHtml += '</div>';
    });
  });

  const pct = Math.round(correct / totalQuestions * 100);
  const scoreEl = document.getElementById('scoreDisplay');
  scoreEl.textContent = correct + '/' + totalQuestions + ' ';
  scoreEl.innerHTML += '<span class="pct">(' + pct + '%)</span>';
  scoreEl.className = 'score ' + (pct >= 90 ? 'excellent' : pct >= 60 ? 'good' : 'needs-work');

  let msg = '';
  if (pct >= 90) msg = '🎉 Отлично! Великолепная работа!';
  else if (pct >= 70) msg = '👍 Хороший результат! Ещё немного практики.';
  else if (pct >= 50) msg = '📚 Неплохо, но стоит повторить материал.';
  else msg = '💪 Не расстраивайся! Повтори тему и попробуй ещё раз.';
  document.getElementById('scoreMessage').textContent = msg;

  document.getElementById('resultsDetail').innerHTML = '<h3>Подробно</h3>' + detailsHtml;
}

function restartQuiz() {
  answered = 0;
  Object.keys(answers).forEach(k => {
    Object.keys(answers[k]).forEach(qk => answers[k][qk] = null);
  });
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll();
  updateProgress();
  window.scrollTo(0, 0);
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
