<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Must / Have to / Don&#x27;t have to — обязанности, запреты и отсутствие обязательств</title>
<style>
:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --accent: #e94560;
  --accent-light: #ff6b81;
  --correct: #2ed573;
  --wrong: #ff4757;
  --text: #eaeaea;
  --text-dim: #8892a4;
  --border: #2a3a5e;
  --btn-radius: 12px;
  --theory-bg: rgba(255,255,255,0.03);
  --theory-border: #3a4a6e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  -webkit-tap-highlight-color: transparent;
}

.container { max-width: 600px; margin: 0 auto; }

.header {
  text-align: center;
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.header h1 { font-size: 22px; font-weight: 700; color: var(--accent-light); }
.header .subtitle { font-size: 14px; color: var(--text-dim); margin-top: 4px; }

.phrase-box {
  background: linear-gradient(135deg, rgba(233,69,96,0.12), rgba(255,107,129,0.08));
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 16px;
  text-align: center;
}
.phrase-box .label { font-size: 11px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.phrase-box .phrase { font-size: 16px; font-weight: 600; font-style: italic; color: var(--text); }
.phrase-box .translation { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

.audio-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  text-align: center;
}
.audio-box .audio-label { font-size: 12px; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.audio-box audio { width: 100%; max-width: 320px; height: 40px; border-radius: 8px; }

.progress-bar {
  width: 100%; height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin-bottom: 16px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}

.section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-title {
  font-size: 16px; font-weight: 700; color: var(--text);
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
  display: flex; align-items: center; gap: 8px;
}
.section-title .icon { font-size: 20px; }

.theory {
  background: var(--theory-bg);
  border-left: 3px solid var(--theory-border);
  border-radius: 0 8px 8px 0;
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-dim);
}
.theory strong { color: var(--text); font-weight: 600; }
.theory em { color: var(--accent-light); font-style: italic; }

.question-block {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.question-number {
  font-size: 12px; font-weight: 600;
  color: var(--accent-light);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.sentence {
  font-size: 15px; line-height: 1.7;
  margin-bottom: 14px;
  padding: 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 8px;
}

.blank {
  display: inline-block;
  min-width: 80px;
  border-bottom: 2px dashed var(--accent);
  margin: 0 4px;
  text-align: center;
  color: var(--accent-light);
  font-weight: 600;
}
.blank.filled { border-bottom-style: solid; color: var(--correct); }
.blank.wrong-fill { border-bottom-style: solid; color: var(--wrong); }

.options { display: flex; flex-direction: column; gap: 8px; }
.options.horizontal { flex-direction: row; justify-content: center; gap: 12px; }

.option-btn {
  background: rgba(255,255,255,0.06);
  border: 2px solid var(--border);
  border-radius: var(--btn-radius);
  padding: 14px 20px;
  font-size: 15px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  min-height: 48px;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
}
.option-btn:active { transform: scale(0.97); }
.option-btn.correct {
  background: rgba(46,213,115,0.15);
  border-color: var(--correct);
  color: var(--correct);
  font-weight: 600;
}
.option-btn.wrong {
  background: rgba(255,71,87,0.15);
  border-color: var(--wrong);
  color: var(--wrong);
  font-weight: 600;
}
.option-btn:disabled { cursor: default; opacity: 0.7; }
.option-btn:disabled:active { transform: none; }
.option-btn .letter { font-weight: 700; margin-right: 8px; color: var(--text-dim); }
.option-btn.correct .letter { color: var(--correct); }
.option-btn.wrong .letter { color: var(--wrong); }

.tf-btn {
  flex: 1; max-width: 140px;
  padding: 18px 24px;
  font-size: 18px; font-weight: 700;
  letter-spacing: 1px;
}

.explanation {
  margin-top: 10px;
  padding: 10px 12px;
  background: rgba(46,213,115,0.08);
  border-left: 3px solid var(--correct);
  border-radius: 0 8px 8px 0;
  font-size: 13px; line-height: 1.6;
  color: var(--text-dim);
  display: none;
}
.explanation.visible { display: block; }

.results {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  animation: fadeIn 0.5s ease;
}
.results .score { font-size: 48px; font-weight: 800; margin: 16px 0; }
.results .score .pct { font-size: 24px; color: var(--text-dim); }
.results .score.excellent { color: var(--correct); }
.results .score.good { color: var(--accent-light); }
.results .score.needs-work { color: var(--wrong); }
.results .message { font-size: 16px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }

.results-detail {
  text-align: left;
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.results-detail h3 {
  font-size: 14px; color: var(--text-dim);
  margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 1px;
}
.result-item {
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 14px; line-height: 1.5;
}
.result-item .ri-q { color: var(--text-dim); margin-bottom: 4px; }
.result-item .ri-correct { color: var(--correct); font-weight: 600; }
.result-item .ri-wrong { color: var(--wrong); font-weight: 600; text-decoration: line-through; margin-right: 8px; }

.restart-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  border: none; border-radius: var(--btn-radius);
  padding: 16px 40px;
  font-size: 16px; font-weight: 700;
  color: white; cursor: pointer;
  margin-top: 20px;
  transition: all 0.2s ease;
}
.restart-btn:active { transform: scale(0.97); }

.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Must / Have to / Don&#x27;t have to — обязанности, запреты и отсутствие обязательств</h1>
    <div class="subtitle">2026-07-03</div>
  </div>
  <div class="phrase-box">
<div class="label">💡 Фраза дня</div>
<div class="phrase">It&#x27;s up to you.</div>
<div class="translation">Решать тебе. / Как хочешь. (Когда предлагаешь выбор)</div>
</div>
  
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div id="quizContent"></div>
  <div class="results hidden" id="results">
    <div style="font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;">Результат</div>
    <div class="score" id="scoreDisplay"></div>
    <div class="message" id="scoreMessage"></div>
    <div class="results-detail" id="resultsDetail"></div>
    <button class="restart-btn" onclick="restartQuiz()">Пройти ещё раз</button>
  </div>
</div>
<script>
const quizData = {"title": "Must / Have to / Don't have to — обязанности, запреты и отсутствие обязательств", "subtitle": "2026-07-03", "date": "2026-07-03", "phrase_of_the_day": "It's up to you.", "phrase_translation": "Решать тебе. / Как хочешь. (Когда предлагаешь выбор)", "sections": [{"id": "s1", "title": "Must vs Have to — что выбрать?", "icon": "✏️", "theory": "Must и have to оба означают «должен», но «must» чаще выражает личную необходимость или внутреннее убеждение, а «have to» — внешнее правило, закон или чужое требование. Пример: I must call my sister — я чувствую, что должен. I have to wear a uniform at work — так требует компания.", "instruction": "", "questions": [{"id": 1, "type": "choice", "sentence": "You ___ wear a seatbelt by law in most countries. Which modal sounds most natural here?", "options": ["have to", "must", "should", "need"], "correct": "have to", "explanation": "Когда речь о законе или правиле — «have to» звучит естественнее, потому что это внешнее требование. «Must» тоже допустимо, но «have to» точнее передаёт «так принято/так требует закон»."}, {"id": 2, "type": "fill", "sentence": "I really ___ lose some weight. The doctor said my cholesterol is too high.", "options": ["must", "have to", "need", "should"], "correct": "must", "explanation": "Здесь — личная необходимость и сильное внутреннее убеждение после визита к врачу. «Must» передаёт эту эмоциональную окраску лучше всего."}, {"id": 3, "type": "tf", "sentence": "«I have to work late tonight — my boss asked me to stay.» means the speaker personally WANTS to work late.", "options": ["True", "False"], "correct": "False", "explanation": "«Have to» = внешняя обязанность, босс попросил остаться. Это не личное желание, а требование извне."}]}, {"id": "s2", "title": "Mustn't vs Don't have to — запрет или выбор?", "icon": "✏️", "theory": "Mustn't = НЕЛЬЗЯ, строгий запрет (You mustn't park here = здесь парковка запрещена). Don't have to = НЕ ОБЯЗАТЕЛЬНО, можно если хочешь, но не обязаны (You don't have to come = можешь не приходить). Разница огромная: mustn't запрещает, don't have to освобождает от обязанности.", "instruction": "", "questions": [{"id": 4, "type": "tf", "sentence": "«You mustn't wear jeans to the interview, but you don't have to wear a suit — smart casual is fine.» — In this situation, you MUST wear a formal suit.", "options": ["True", "False"], "correct": "False", "explanation": "Don't have to wear a suit = костюм необязателен. Но джинсы нельзя (mustn't). Подходит стиль «smart casual» — значит можно neat trousers и блузку/рубашку."}, {"id": 5, "type": "fill", "sentence": "You ___ tell anyone about this surprise party. It's supposed to be a secret!", "options": ["mustn't", "don't have to", "needn't", "shouldn't"], "correct": "mustn't", "explanation": "Mustn't = запрещено, это секрет. «Don't have to» означало бы «не обязательно» — можно было бы рассказать, что неверно. «Shouldn't» — мягкий совет, а здесь нужен запрет."}, {"id": 6, "type": "choice", "sentence": "Your friend invites you to dinner, but says it's OK if you can't make it. Which sentence is correct?", "options": ["You mustn't come to the dinner.", "You don't have to come to the dinner.", "You can't coming to the dinner.", "You must not coming to the dinner."], "correct": "You don't have to come to the dinner.", "explanation": "Don't have to = необязательно, выбор за вами. «Mustn't» = нельзя — это было бы грубым, как запрет."}]}, {"id": "s3", "title": "Need to — грамматическая форма", "icon": "📖", "theory": "", "instruction": "", "questions": [{"id": 7, "type": "choice", "sentence": "Which sentence is grammatically correct?", "options": ["We need to finish this report by Friday.", "We must to finish this report by Friday.", "We don't need finish this report by Friday.", "We need finishing this report by Friday."], "correct": "We need to finish this report by Friday.", "explanation": "Need to + infinitive — правильная форма. «Must to» — ошибка (must + bare infinitive без to). «Don't need finish» — нужно «don't need TO finish». «Need finishing» — другая грамматическая конструкция."}, {"id": 8, "type": "fill", "sentence": "I ___ to buy a birthday present for my brother. His birthday is tomorrow and I completely forgot!", "options": ["need", "must", "have", "should"], "correct": "need", "explanation": "Need to = нужно. В этой ситуации — практическая необходимость (забыл про подарок). Также можно «have to» или «must», но «need to» — самый нейтральный и естественный вариант."}]}, {"id": "s4", "title": "Listening: Rules at a new workplace", "icon": "🎧", "theory": "", "instruction": "", "questions": [{"id": 9, "type": "listen", "sentence": "Listen to the dialogue and answer: What must the new employee always wear?", "options": ["A uniform", "An ID badge", "A suit and tie", "A name tag"], "correct": "An ID badge", "explanation": "В диалоге прямо сказано: «You must wear your ID badge at all times» = всегда носить бейдж. Униформы не упоминается.", "audio_text": "Hi! I'm the new marketing coordinator. What do I need to know about the office rules? — OK, first of all, you have to arrive by 9 AM, but you don't have to stay after 5 — flexible hours. You must wear your ID badge at all times, that's very important for security. And you don't have to bring your own lunch — we have a free cafeteria on the ground floor."}, {"id": 10, "type": "listen", "sentence": "Listen again and answer: According to the dialogue, what is the person NOT required to do?", "options": ["Arrive by 9 AM", "Wear an ID badge", "Bring their own lunch", "Stay until 5 PM"], "correct": "Bring their own lunch", "explanation": "«You don't have to bring your own lunch» = не обязательно приносить обед. Столовая бесплатная — можно питаться там. Оставаться после 5 тоже не обязательно (don't have to stay after 5), но вопрос «what is NOT required» — оба варианта верны, однако приносить обед — более явное «не требуется».", "audio_text": "Hi! I'm the new marketing coordinator. What do I need to know about the office rules? — OK, first of all, you have to arrive by 9 AM, but you don't have to stay after 5 — flexible hours. You must wear your ID badge at all times, that's very important for security. And you don't have to bring your own lunch — we have a free cafeteria on the ground floor."}]}, {"id": "s5", "title": "Choosing the right modal — выбираем верный модальный глагол", "icon": "✏️", "theory": "", "instruction": "", "questions": [{"id": 11, "type": "choice", "sentence": "You are in an art gallery. There is a sign: «Please do not touch the paintings.» Which sentence correctly describes this rule?", "options": ["I don't have to touch the paintings.", "I mustn't touch the paintings.", "I needn't touch the paintings.", "I shouldn't touch the paintings."], "correct": "I mustn't touch the paintings.", "explanation": "Запрет в музее = mustn't (нельзя). «Don't have to» = не обязательно, «shouldn't» = не стоит (мягкий совет), «needn't» = нет необходимости. Здесь — строгий запрет."}, {"id": 12, "type": "fill", "sentence": "You ___ drive without a licence. It's against the law and you can go to prison for it.", "options": ["mustn't", "don't have to", "needn't", "shouldn't"], "correct": "mustn't", "explanation": "Водить без прав — незаконно и наказуемо. Mustn't = нельзя (строгий запрет). «Don't have to» означало бы «не обязательно» — что неверно, потому что это закон."}]}]};

let answered = 0;
let totalQuestions = 0;
let answers = {};
let sectionData = [];

function init() {
  sectionData = quizData.sections || quizData;
  sectionData.forEach(section => {
    if (!answers[section.id]) answers[section.id] = {};
    (section.questions || []).forEach(q => {
      totalQuestions++;
      answers[section.id][q.id] = null;
    });
  });
  renderAll();
  updateProgress();
}

function renderAll() {
  const container = document.getElementById('quizContent');
  container.innerHTML = '';
  let globalQ = 0;
  sectionData.forEach(section => {
    let html = '<div class="section-card" id="section_' + section.id + '">';

    // Section title
    html += '<div class="section-title"><span class="icon">' + (section.icon || '📝') + '</span>' + esc(section.title) + '</div>';

    // Theory BEFORE questions
    if (section.theory) {
      html += '<div class="theory">' + formatTheory(section.theory) + '</div>';
    }

    // Instruction
    if (section.instruction) {
      html += '<div class="instruction" style="font-size:14px;color:var(--text-dim);margin-bottom:14px;">' + esc(section.instruction) + '</div>';
    }

    // Questions
    (section.questions || []).forEach(q => {
      globalQ++;
      html += '<div class="question-block">';
      html += '<div class="question-number">Вопрос ' + globalQ + '</div>';
      if (q.sentence) {
        html += '<div class="sentence">' + formatSentence(q.sentence, section.id, q.id, q.type) + '</div>';
      }
      html += renderOptions(section.id, q);
      if (q.explanation) {
        html += '<div class="explanation" id="exp_' + section.id + '_' + q.id + '">' + esc(q.explanation) + '</div>';
      }
      html += '</div>';
    });

    html += '</div>';
    container.insertAdjacentHTML('beforeend', html);
  });
}

function formatTheory(text) {
  // Support **bold** and *italic* in theory text
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function formatSentence(sentence, secId, qId, type) {
  if (!sentence) return '';
  if (type === 'fill' || type === 'choice') {
    return sentence.replace(/___+/g, '<span class="blank" id="blank_' + secId + '_' + qId + '">___</span>');
  }
  return esc(sentence);
}

function renderOptions(secId, q) {
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (q.type === 'tf') {
    return '<div class="options horizontal">' +
      '<button class="option-btn tf-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="T" onclick="selectOption(this)">✓ True</button>' +
      '<button class="option-btn tf-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="F" onclick="selectOption(this)">✗ False</button>' +
      '</div>';
  }
  if (q.type === 'choice' || q.type === 'fill' || q.type === 'select' || q.type === 'listen') {
    let html = '<div class="options">';
    (q.options || []).forEach((opt, i) => {
      html += '<button class="option-btn" data-sec="' + secId + '" data-q="' + q.id + '" data-val="' + esc(opt) + '" onclick="selectOption(this)">' +
        '<span class="letter">' + letters[i] + '</span>' + esc(opt) + '</button>';
    });
    html += '</div>';
    return html;
  }
  return '';
}

function selectOption(btn) {
  const secId = btn.dataset.sec;
  const qId = btn.dataset.q;
  const val = btn.dataset.val;

  if (answers[secId][qId] !== null) return;

  answers[secId][qId] = val;
  answered++;

  const section = sectionData.find(s => s.id === secId);
  const question = section.questions.find(q => q.id == qId);
  const correct = question.correct;
  const isCorrect = val === correct;

  const siblings = btn.parentElement.querySelectorAll('.option-btn');
  siblings.forEach(s => {
    s.disabled = true;
    if (s.dataset.val === correct) s.classList.add('correct');
    if (s === btn && !isCorrect) s.classList.add('wrong');
  });

  const blank = document.getElementById('blank_' + secId + '_' + qId);
  if (blank) {
    blank.textContent = correct;
    blank.classList.add(isCorrect ? 'filled' : 'wrong-fill');
  }

  const exp = document.getElementById('exp_' + secId + '_' + qId);
  if (exp) exp.classList.add('visible');

  updateProgress();

  if (answered >= totalQuestions) {
    setTimeout(showResults, 800);
  }
}

function updateProgress() {
  const pct = totalQuestions > 0 ? (answered / totalQuestions * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function showResults() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');

  let correct = 0;
  let detailsHtml = '';

  sectionData.forEach(section => {
    section.questions.forEach(q => {
      const userAnswer = answers[section.id][q.id];
      const isCorrect = userAnswer === q.correct;
      if (isCorrect) correct++;

      detailsHtml += '<div class="result-item">';
      detailsHtml += '<div class="ri-q">' + esc(section.title) + ' — Вопрос ' + q.id + '</div>';
      if (q.sentence) {
        detailsHtml += '<div>' + esc(q.sentence.replace(/___+/g, q.correct)) + '</div>';
      } else {
        detailsHtml += '<div>' + esc(q.options ? q.options.join(' / ') : '') + '</div>';
      }
      if (!isCorrect && userAnswer !== null) {
        detailsHtml += '<div><span class="ri-wrong">' + esc(userAnswer) + '</span><span class="ri-correct">' + esc(q.correct) + '</span></div>';
      }
      if (isCorrect) {
        detailsHtml += '<div><span class="ri-correct">✓ ' + esc(q.correct) + '</span></div>';
      }
      if (q.explanation) {
        detailsHtml += '<div style="color:var(--text-dim);font-size:12px;margin-top:4px;">' + esc(q.explanation) + '</div>';
      }
      detailsHtml += '</div>';
    });
  });

  const pct = Math.round(correct / totalQuestions * 100);
  const scoreEl = document.getElementById('scoreDisplay');
  scoreEl.textContent = correct + '/' + totalQuestions + ' ';
  scoreEl.innerHTML += '<span class="pct">(' + pct + '%)</span>';
  scoreEl.className = 'score ' + (pct >= 90 ? 'excellent' : pct >= 60 ? 'good' : 'needs-work');

  let msg = '';
  if (pct >= 90) msg = '🎉 Отлично! Великолепная работа!';
  else if (pct >= 70) msg = '👍 Хороший результат! Ещё немного практики.';
  else if (pct >= 50) msg = '📚 Неплохо, но стоит повторить материал.';
  else msg = '💪 Не расстраивайся! Повтори тему и попробуй ещё раз.';
  document.getElementById('scoreMessage').textContent = msg;

  document.getElementById('resultsDetail').innerHTML = '<h3>Подробно</h3>' + detailsHtml;
}

function restartQuiz() {
  answered = 0;
  Object.keys(answers).forEach(k => {
    Object.keys(answers[k]).forEach(qk => answers[k][qk] = null);
  });
  document.getElementById('quizContent').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  renderAll();
  updateProgress();
  window.scrollTo(0, 0);
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
